  api('/api/admin/giveaway',{}).then(function(d){
    var el=document.getElementById('gwbody');if(!el)return;
    if(!d||!d.ok){el.innerHTML='<div class="note">Ошибка загрузки.</div>';return;}
    window._gw=d;_gwRender();
    /* пока идёт пересчёт — подтягиваем сами, чтобы не жать «обновить» */
    if(d.refreshing){clearTimeout(window._gwPoll);window._gwPoll=setTimeout(_gwLoad,3000);}
  });
}

function _gwRender(){
  var el=document.getElementById('gwbody');if(!el)return;
  var d=window._gw||{},g=d.giveaway;
  if(!g){
    el.innerHTML='<div class="block"><h4>Розыгрыша ещё нет</h4>'
      +'<div class="note">Создай его — после этого бот начнёт засчитывать комментарии '
      +'под постами в группе обсуждения канала.</div>'
      +'<label class="fl">Название</label><input class="f" id="gw_title" value="Неделя ChatGPT"/>'
      +'<label class="fl">Слово в комментарии</label><input class="f" id="gw_kw" value="участвую"/>'
      +'<label class="fl">Ссылка на пост в канале</label><input class="f" id="gw_url" placeholder="https://t.me/AleksandrOii/123"/>'
      +'<label class="fl">Текст кнопки в меню бота</label><input class="f" id="gw_btn" value="🎁 Участвовать в розыгрыше"/>'
      +'<label class="fl">Сколько друзей пригласить</label><input class="f" id="gw_refs" type="number" min="0" max="20" value="2"/>'
      +'<label class="fl">Победителей</label><input class="f" id="gw_win" type="number" min="1" max="100" value="10"/>'
      +'<label class="fl">Резерв</label><input class="f" id="gw_res" type="number" min="0" max="100" value="3"/>'
      +'</div><button class="btn" onclick="_gwSave(0)">➕ Создать розыгрыш</button>'
      +'<div class="note" style="margin-top:10px">⚠️ Перед публикацией поста добавь бота '
      +'в группу обсуждения канала <b>администратором</b> — обычному участнику группы '
      +'чужие сообщения не приходят, и ни одно «Участвую» не засчитается. '
      +'Комментарии, отправленные до вступления бота, он тоже не увидит — '
      +'задним числом их не собрать. Проверить: команда <b>/giveaway_where</b> в боте.</div>';
    return;
  }
  var st=d.stats||{},h='';

  /* Раньше всё шло одной простынёй: счётчики, итоги, участники — и кнопки,
     до которых нужно доскроллить. Теперь сверху только то, ради чего сюда
     заходят (состояние в одну строку + действия), а подробности убраны
     в сворачиваемые разделы. */
  var fin=(g.status==='finished');
  var blocked=(st.unchecked||0)>0||(st.total||0)===0;

  h+='<div class="block"><h4>'+esc(g.title||'Розыгрыш')+(fin?' <span class="neg">(завершён)</span>':'')+'</h4>'
    +'<div class="sub" style="margin-top:4px">'
    +'<b>'+(st.total||0)+'</b> участн. &nbsp;·&nbsp; проходят <b class="pos">'+(st.ok||0)+'</b>'
    +'&nbsp;·&nbsp; проверка <span'+_gwAgeCls(d)+'>'+_gwAgeTxt(d)+'</span></div>'
    +(fin?'<div class="sub" style="margin-top:6px">Приём закрыт — новые комментарии не засчитываются. Проверять участников и подводить итоги можно.</div>':'')
    +(st.unchecked?'<div class="sub neg" style="margin-top:6px">⚠️ Не проверены: '+st.unchecked+' — нажми «Проверить участников».</div>':'')
    +(st.susp?'<div class="sub neg" style="margin-top:4px">⚠️ Подозрительных: '+st.susp+' (смотри в списке участников)</div>':'')
    +'</div>';

  /* Действия — до всех подробностей, чтобы за ними не приходилось скроллить. */
  h+='<div class="btns2">'
    +'<button class="btn row2 sec" onclick="_gwRefresh()">'+(d.refreshing?'⏳ Идёт проверка…':'🔄 Проверить участников')+'</button>'
    +'<button class="btn row2 sec" onclick="_gwEdit()">⚙️ Настройки</button></div>';
  if(d.refreshing)h+='<div class="note">Бот опрашивает Telegram по каждому участнику и его друзьям. Это занимает время — экран обновится сам.</div>';

  h+='<button class="btn'+(blocked?' sec':'')+'" style="margin-top:10px" onclick="_gwDraw()">🎲 Разыграть ('+(st.ok||0)+' участников)</button>'
    +(blocked?'<div class="note neg">Сначала нажми «Проверить участников» — иначе розыгрыш не запустится.</div>':'');

  /* Напоминание — только пока приём открыт: после завершения звать приводить
     друзей уже некуда. */
  if(!fin){
    h+='<button class="btn sec" style="margin-top:10px" onclick="_gwRemind()">📣 Напомнить участникам</button>'
      +'<div class="note">Каждому уйдёт его личное: чего не хватает и сколько ещё друзей привести. Тем, кто уже всё выполнил, не пишем.</div>';
  }

  /* Завершённый розыгрыш: «Новый» и «Возобновить» видны сразу, а не только
     внутри «Настроек» — именно их ищут, закончив предыдущий. */
  if(fin){
    h+='<div class="btns2" style="margin-top:10px">'
      +'<button class="btn row2 sec" onclick="_gwReopen('+(g.id||0)+')">↩️ Возобновить приём</button>'
      +'<button class="btn row2 danger" onclick="_gwNew()">➕ Новый розыгрыш</button></div>';
  }

  /* ── Итоги ───────────────────────────────────────────────────────────── */
  if(d.winners&&d.winners.length){
    var wi='<div class="block">';
    d.winners.forEach(function(w){
      wi+='<div class="kv"><span class="k">'+(w.reserve?'резерв ':'')+w.place+'. '+esc(w.user)+'</span>'
        +'<span'+(w.reserve?'':' class="pos"')+'>'+(w.reserve?'запасной':'победитель')+'</span></div>';
    });
    wi+='<button class="btn sec" style="margin-top:10px" onclick="_gwText()">📋 Текст для канала</button></div>';
    h+=_gwBox('win','🏆 Итоги',d.winners.length+' ',wi,true);
  }

  /* ── Подробности ─────────────────────────────────────────────────────── */
  var si='<div class="block">'
    +'<div class="kv"><span class="k">Участников (с комментарием)</span><span>'+(st.total||0)+'</span></div>'
    +'<div class="kv"><span class="k">Выполнили все условия</span><span class="pos">'+(st.ok||0)+'</span></div>'
    +(st.susp?'<div class="kv"><span class="k">⚠️ Подозрительных</span><span class="neg">'+st.susp+'</span></div>':'')
    +(st.unchecked?'<div class="kv"><span class="k">Ещё не проверены</span><span class="neg">'+st.unchecked+'</span></div>':'')
    +'<div class="kv"><span class="k">Последняя проверка</span><span'+(_gwAgeCls(d)+'>'+_gwAgeTxt(d))+'</span></div>'
    +'<div class="kv"><span class="k">Кнопка в меню бота</span><span'+(g.postUrl?' class="pos">показана':' class="neg">нет ссылки')+'</span></div>'
    +'<div class="sub" style="margin-top:8px">Условия: подписка на канал + '+g.needRefs
    +' приглашённых + слово «'+esc(g.keyword)+'» в комментарии</div></div>'
    +'<div class="note">Победители выбираются случайно среди тех, кто выполнил все условия. '
    +'Можно перезапустить до публикации — итоги перезапишутся.</div>';
  h+=_gwBox('sum','📊 Подробности','',si,false);

  /* ── Участники ───────────────────────────────────────────────────────── */
  /* Наверх — то, что требует решения: подозрительные, затем не прошедшие.
     Прошедшие в самом низу: с ними всё и так ясно. */
  var people=(d.people||[]).slice().sort(function(a,b){
    var sa=a.susp?0:1, sb=b.susp?0:1;
    if(sa!==sb)return sa-sb;
    if(a.ok!==b.ok)return a.ok?1:-1;
    return (b.refs||0)-(a.refs||0);
  });
  /* Рисуем не всех: на паре сотен участников страница из одних только
     строк списка весит сотни килобайт, и мини-апп на телефоне встаёт.
     Сортировка уже подняла наверх тех, к кому есть вопросы. */
  var LIM=window._gwShowAll?100000:100;
  var shown=people.slice(0,LIM),hidden=people.length-shown.length,pi='';
  if(!people.length){
    pi+='<div class="note">Пока никто не прокомментировал. Как только под постом появится '
      +'«'+esc(g.keyword)+'», человек появится здесь.</div>';
  }
  if(hidden>0)pi+='<div class="sub" style="margin:4px 0">Показаны '+shown.length+' из '+people.length+'</div>';
  shown.forEach(function(p){
    var mark=function(v){return v?'✅':'⬜️';};
    pi+='<div class="block" style="'+(p.excluded?'opacity:.5;':'')+(p.susp?'border-left:3px solid '+C.red+';':'')+'">'
      +'<div style="font-size:13px;font-weight:700">'+esc(p.user)+(p.ok?' <span class="pos">— проходит</span>':'')+'</div>'
      +'<div class="sub" style="margin-top:4px">'
      +mark(p.sub)+' подписка &nbsp; '+mark(p.refs>=g.needRefs)+' друзья: '+p.refs+'/'+g.needRefs
      +((p.refsSub!=null&&p.refsSub<p.refs)?(' <span style="opacity:.6">(подписаны на канал: '+p.refsSub+')</span>'):'')
      +' &nbsp; ✅ комментарий'
      +(p.checked?'':' <span class="neg">— не проверен</span>')
      +'</div>'
      +(p.susp?'<div class="sub neg" style="margin-top:4px">⚠️ '+esc(p.susp)+'</div>':'')
      +'<button class="btn sec" style="margin-top:8px;padding:7px 10px;font-size:12px;width:auto" '
      +'onclick="_gwExclude('+p.id+','+(p.excluded?'false':'true')+')">'
      +(p.excluded?'Вернуть в розыгрыш':'Исключить')+'</button>'
      +'</div>';
  });
  if(hidden>0){
    pi+='<button class="btn sec" onclick="window._gwShowAll=1;_gwRender()">Показать все ('+people.length+')</button>'
      +'<div class="note">Наверху те, к кому есть вопросы: не прошедшие и подозрительные. '
      +'На розыгрыш это не влияет — он считает всех.</div>';
  } else if(window._gwShowAll&&people.length>100){
    pi+='<button class="btn sec" onclick="window._gwShowAll=0;_gwRender()">Свернуть список</button>';
  }
  h+=_gwBox('ppl','👥 Участники',(people.length||0)+' ',pi,false);

  el.innerHTML=h;
}

/* Сворачиваемый раздел. Состояние держим в window, а не в DOM: _gwRender
   перерисовывает экран целиком, и любая «открытость», записанная в разметку,
   схлопывалась бы при каждом обновлении. */
function _gwFold(k){
  window._gwOpen=window._gwOpen||{};
  window._gwOpen[k]=!window._gwOpen[k];
  _gwRender();
}

function _gwBox(k,title,badge,inner,dflt){
  window._gwOpen=window._gwOpen||{};
  var o=window._gwOpen;
  if(!(k in o))o[k]=!!dflt;
  var open=o[k];
  return '<div class="block" style="cursor:pointer;margin-top:12px" onclick="_gwFold(&quot;'+k+'&quot;)">'
    +'<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">'
    +'<span style="font-size:13px;font-weight:700">'+title+'</span>'
    +'<span class="sub">'+(badge||'')+(open?'▾':'▸')+'</span></div></div>'
    +(open?inner:'');
}

/* Возраст последней проверки: по нему решаем, можно ли разыгрывать.
   Данные часовой давности — это уже не про «кто подписан сейчас». */
/* Двойное подтверждение для необратимого в разделе розыгрыша.
   Второй вопрос НАМЕРЕННО другой: два одинаковых окна подряд пролистываются
   на автомате, и защита превращается в две лишние кнопки. */
/* Подтверждение в два шага СВОИМ окном, а не window.confirm.

   В Telegram-вебвью нативный confirm часто недоступен или молча не
   показывается. Прежний код на этот случай писал `if(!window.confirm)return
   true` — то есть при отсутствии диалога ПРОПУСКАЛ действие без вопроса.
   Для розыгрыша это значит: одно случайное касание — и победители выбраны,
   а прежних не восстановить.

   Здесь два разных экрана с разными кнопками: на первом «Дальше», на втором
   «Да, <действие>». Случайно пройти оба подряд нельзя. Второй шаг открывается
   не сразу, а через полсекунды — чтобы палец, уже летящий вниз, не попал по
   нему по инерции. */
/* Окно ввода вместо window.prompt / window.alert. Во встроенном браузере
   Telegram системные окна ненадёжны (то же было с confirm): ввод мог не
   появиться вовсе, а у «Отметить выплату» это деньги партнёра. 06.10.2026
   fields: [{label, value, ph, num}] → cb([значения]). Отмена — ничего. */
function _askForm(title,hint,fields,okText,cb){
  var prev=document.getElementById('gwcfm'); if(prev)prev.remove();
  var ov=document.createElement('div'); ov.id='gwcfm';
  ov.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto';
  var h='<div style="background:var(--surface);border-radius:16px;padding:20px;max-width:360px;width:100%">'
    +'<div style="font-weight:700;font-size:16px;margin-bottom:8px">'+esc(title)+'</div>'
    +(hint?'<div class="sub" style="white-space:pre-wrap;margin-bottom:6px">'+esc(hint)+'</div>':'');
  fields.forEach(function(f,i){
    h+='<label class="fl">'+esc(f.label)+'</label><input class="f" id="askf_'+i+'" value="'+esc(f.value==null?'':f.value)+'" placeholder="'+esc(f.ph||'')+'"'+(f.num?' inputmode="decimal"':'')+'/>';
  });
  h+='<div style="display:flex;gap:10px;margin-top:16px"><button class="btn sec" style="flex:1;margin-top:0" id="askno">Отмена</button>'
    +'<button class="btn" style="flex:1;margin-top:0" id="askok">'+esc(okText||'Сохранить')+'</button></div></div>';
  ov.innerHTML=h;document.body.appendChild(ov);
  function close(){try{ov.remove();}catch(e){}}
  document.getElementById('askno').onclick=close;
  document.getElementById('askok').onclick=function(){
    var v=fields.map(function(f,i){var e=document.getElementById('askf_'+i);return e?String(e.value).trim():'';});
    close();try{cb(v);}catch(e){}
  };
  var f0=document.getElementById('askf_0');if(f0)setTimeout(function(){try{f0.focus()}catch(e){}},50);
}
function _infoBox(title,text){
  var prev=document.getElementById('gwcfm'); if(prev)prev.remove();
  var ov=document.createElement('div'); ov.id='gwcfm';
  ov.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML='<div style="background:var(--surface);border-radius:16px;padding:20px;max-width:360px;width:100%"><div style="font-weight:700;font-size:16px;margin-bottom:8px">'+esc(title)+'</div>'
    +'<div class="sub" style="white-space:pre-wrap">'+esc(text)+'</div><button class="btn" id="infok">Понятно</button></div>';
  document.body.appendChild(ov);document.getElementById('infok').onclick=function(){try{ov.remove();}catch(e){}};
}
function _gwConfirm2(title, text, okText, cb){
  var prev=document.getElementById('gwcfm'); if(prev)prev.remove();
  var ov=document.createElement('div'); ov.id='gwcfm';
  ov.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.88);'
    +'display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px';
  function close(){ try{ov.remove();}catch(e){} }
  function step2(){
    ov.innerHTML='<div style="background:var(--surface);border-radius:16px;padding:20px;max-width:340px;width:100%">'
      +'<div style="font-weight:700;font-size:16px;margin-bottom:10px">Ещё раз: точно?</div>'
      +'<div class="sub" style="white-space:pre-wrap">'+esc(text)+'</div>'
      +'<div style="display:flex;gap:10px;margin-top:16px">'
      +'<button class="btn sec" style="flex:1" id="gwcfmno2">Отмена</button>'
      +'<button class="btn" style="flex:1" id="gwcfmyes" disabled>'+esc(okText)+'</button>'
      +'</div></div>';
    document.getElementById('gwcfmno2').onclick=close;
    var y=document.getElementById('gwcfmyes');
    /* Пауза перед разблокировкой: защита от «протыкивания» вслепую. */
    setTimeout(function(){ if(y){ y.disabled=false; } }, 500);
    y.onclick=function(){ close(); try{cb();}catch(e){} };
  }
  ov.innerHTML='<div style="background:var(--surface);border-radius:16px;padding:20px;max-width:340px;width:100%">'
    +'<div style="font-weight:700;font-size:16px;margin-bottom:10px">'+esc(title)+'</div>'
    +'<div class="sub" style="white-space:pre-wrap">'+esc(text)+'</div>'
    +'<div style="display:flex;gap:10px;margin-top:16px">'
    +'<button class="btn sec" style="flex:1" id="gwcfmno">Отмена</button>'
    +'<button class="btn" style="flex:1" id="gwcfmnext">Дальше</button>'
    +'</div></div>';
  document.body.appendChild(ov);
  document.getElementById('gwcfmno').onclick=close;
  document.getElementById('gwcfmnext').onclick=step2;
}



function _gwAgeMin(d){
  var t=parseInt((d&&d.checkedAt)||'0',10);
  if(!t)return -1;
  return Math.floor((Date.now()/1000-t)/60);
}
function _gwAgeTxt(d){
  var m=_gwAgeMin(d);
  if(m<0)return 'не проводилась';
  if(m<1)return 'только что';
  if(m<60)return m+' мин назад';
  return Math.floor(m/60)+' ч назад';
}
function _gwAgeCls(d){var m=_gwAgeMin(d);return (m<0||m>60)?' class="neg"':' class="pos"';}

function _gwSave(id){
  var v=function(i,dflt){var e=document.getElementById(i);return e?e.value:dflt;};
  var pl={action:'save',id:id||0,title:v('gw_title','Розыгрыш'),keyword:v('gw_kw','участвую'),
          postUrl:v('gw_url',''),btnText:v('gw_btn',''),
          needRefs:parseInt(v('gw_refs',2),10),winnersCount:parseInt(v('gw_win',10),10),
          reserveCount:parseInt(v('gw_res',3),10)};
  toast('Сохраняю…');
  api('/api/admin/giveaway-action',pl).then(function(d){
    if(d&&d.ok){toast('Готово ✅');_gwLoad();}else toast((d&&d.msg)||'Ошибка');});
}

function _gwEdit(){
  var g=(window._gw||{}).giveaway||{};
  var el=document.getElementById('gwbody');if(!el)return;
  el.innerHTML='<div class="block"><h4>Настройки розыгрыша</h4>'
    +'<label class="fl">Название</label><input class="f" id="gw_title" value="'+esc(g.title||'')+'"/>'
    +'<label class="fl">Слово в комментарии</label><input class="f" id="gw_kw" value="'+esc(g.keyword||'участвую')+'"/>'
    +'<label class="fl">Ссылка на пост в канале</label><input class="f" id="gw_url" placeholder="https://t.me/AleksandrOii/123" value="'+esc(g.postUrl||'')+'"/>'
    +'<div class="sub">Пока ссылка пустая — кнопки розыгрыша в меню бота нет. Вставь её после публикации поста.</div>'
    +'<label class="fl">Текст кнопки в меню бота</label><input class="f" id="gw_btn" value="'+esc(g.btnText||'🎁 Участвовать в розыгрыше')+'"/>'
    +'<label class="fl">Сколько друзей пригласить</label><input class="f" id="gw_refs" type="number" min="0" max="20" value="'+(g.needRefs||2)+'"/>'
    +'<label class="fl">Победителей</label><input class="f" id="gw_win" type="number" min="1" max="100" value="'+(g.winnersCount||10)+'"/>'
    +'<label class="fl">Резерв</label><input class="f" id="gw_res" type="number" min="0" max="100" value="'+(g.reserveCount||0)+'"/>'
    +'</div><div class="btns2"><button class="btn row2" onclick="_gwSave('+(g.id||0)+')">💾 Сохранить</button>'
    +'<button class="btn row2 sec" onclick="_gwLoad()">Отмена</button></div>'
    +(g.status==='finished'

function _gwExclude(uid,on){

     человек в Telegram, и кавычка в нём сломала бы всю разметку списка. */
  var who='id'+uid,pp=(window._gw||{}).people||[];
  for(var i=0;i<pp.length;i++){if(pp[i].id===uid){who=pp[i].user;break;}}
  function _go(){
    api('/api/admin/giveaway-action',{action:'exclude',id:g.id,userId:uid,on:on}).then(function(d){
      if(d&&d.ok){toast(on?'Исключён':'Возвращён');_gwLoad();}else toast('Ошибка');});
  }
  /* Возврат участника обратно безобиден — спрашиваем только про исключение. */
  if(!on){ _go(); return; }
  _gwConfirm2('Исключить из розыгрыша?', who+' не попадёт в число победителей.\n\nВернуть можно тем же способом.',

/* Напоминание участникам. Сначала спрашиваем у сервера, СКОЛЬКО получат —
   чтобы в подтверждении стояло настоящее число, а не обещание. */
function _gwRemind(){
  var g=(window._gw||{}).giveaway||{};
  toast('Считаю…');
  api('/api/admin/giveaway-action',{action:'remind',id:g.id,dry:true}).then(function(d){
    if(!d||!d.ok){toast((d&&d.msg)||'Ошибка');return;}
    var n=d.todo||0;
    if(!n){toast('Напоминать некому — все всё выполнили');return;}
    _gwConfirm2('Напомнить участникам?',
      'Сообщение получат '+n+' из '+(d.total||0)+' участников — те, у кого что-то не закрыто.\n\n'
      +'Каждому уйдёт его личный список: подписка, сколько друзей осталось, его ссылка.\n\n'
      +'Отправленное не отозвать.',
      'Да, отправить', function(){ _gwRemindGo(false); });
  });
}
var _gwRemindBusy=false;
/* Рассылка уходит фоном, поэтому ответ приходит сразу. Кнопку всё равно
   блокируем: повторный тап 20.09.2026 присылал людям напоминание по три раза. */
function _gwRemindGo(force){
  var g=(window._gw||{}).giveaway||{};
  if(_gwRemindBusy){toast('Уже отправляю — второй раз не шлю');return;}
  _gwRemindBusy=true;
  toast('Отправляю…');
  api('/api/admin/giveaway-action',{action:'remind',id:g.id,force:!!force}).then(function(d){
    if(d&&!d.ok&&d.stale){
      _gwRemindBusy=false;
      _gwConfirm2('Слишком часто', d.msg||'', 'Всё равно отправить',
                  function(){ _gwRemindGo(true); });
      return;
    }
    if(!d||!d.ok){_gwRemindBusy=false;toast((d&&d.msg)||'Ошибка');return;}
    toast(d.msg||('Отправляю '+(d.todo||0)+' участникам. Отчёт придёт в бот.'));
  });
}

function _gwDrawGo(){
  var g=(window._gw||{}).giveaway||{};
  toast('Разыгрываю…');
  api('/api/admin/giveaway-action',{action:'draw',id:g.id}).then(function(d){
    if(d&&!d.ok&&d.stale){
      /* Данные устарели — предлагаем перепроверить, а не разыгрывать вслепую.
         Тем же окном, а не window.confirm: в вебвью он не работает. */
      _gwConfirm2('Данные устарели', (d.msg||'')+'\n\nРазыграть всё равно по старым данным?',
                  'Да, по старым', function(){
        api('/api/admin/giveaway-action',{action:'draw',id:g.id,force:true}).then(function(d2){
          if(!d2||!d2.ok){toast((d2&&d2.msg)||'Ошибка');return;}
          toast('Готово 🎉');_gwLoad();setTimeout(function(){_gwShowText(d2.text||'');},400);});
      });
      return;
    }
    if(!d||!d.ok){toast((d&&d.msg)||'Ошибка');return;}
    toast('Готово 🎉');window._gwText=d.text||'';_gwLoad();
    setTimeout(function(){_gwShowText(d.text||'');},400);
  });
}

function loadPending(svc){

           +'Раньше их тут не было видно вовсе.</div>';

        h+='<div class="block"><div style="font-size:12.5px;font-weight:600">'+esc(c.user)
          +(c.uid?' <span class="sub">('+c.uid+')</span>':'')+' · '+esc(c.date)+'</div>'+
           '<div class="sub" style="margin-top:4px">🔑 '+esc(c.code)+' · '+planLabel(svc,c.plan)
          +(c.planName?' · '+esc(c.planName):'')
          +'<br><span'+(c.warn?' class="neg"':' class="pos"')+'>● '+esc(c.state||'')+'</span>'
          +(c.left?' · '+esc(c.left):'')
          +(c.order?'<br>🆔 '+esc(c.order):'')
          +(c.org?'<br>🏢 '+esc(c.org):'')+'</div>'+
           (c.started?'<div class="note neg" style="margin-top:6px">⚠️ Активация уже уходила поставщику — код мог быть потрачен.</div>':'')+
           '<div class="btns2" style="margin-top:8px"><button class="btn row2 sec" onclick="claudeCodeAction(\''+esc(c.code)+'\',\'release\',\''+svc+'\','+(c.started?1:0)+')">↩️ В пул</button>'+
           '<button class="btn row2 danger" onclick="claudeCodeAction(\''+esc(c.code)+'\',\'delete\',\''+svc+'\','+(c.started?1:0)+')">🗑 Удалить</button></div></div>';
      });
    });
    el.innerHTML=h;
  });

/* Было window.confirm. Во встроенном браузере Telegram он не работает
   (пометка об этом есть в коде розыгрыша), и возврат кода в пул мог пройти
   без подтверждения. Теперь то же двухшаговое окно, что у розыгрыша, и честный
   ответ сервера: «Возвращён в пул» — только если код реально нашёлся.
   06.10.2026 */
function claudeCodeAction(code,action,svc,started){
  var t,ok;
  if(action==='release'){
    t='Вернуть код '+code+' в пул?\n\nРезерв клиента снимется, код станет доступен следующему покупателю.';
    if(started)t+='\n\n⚠️ Активация по этому коду уже уходила поставщику. Если она прошла, код потрачен — и следующий клиент получит пустой код. Проверь у поставщика перед возвратом.';
    ok='Да, вернуть в пул';
  }else{
    t='Удалить код '+code+' безвозвратно?\n\nКод исчезнет из пула и из резерва клиента.';
    ok='Да, удалить';
  }
  _gwConfirm2(action==='release'?'Вернуть в пул?':'Удалить код?',t,ok,function(){
    api('/api/admin/claude-code-action',{code:code,action:action,service:svc}).then(function(d){
      if(d&&d.ok){toast(action==='release'?'Возвращён в пул':'Удалён');loadPending(svc);}
      else toast((d&&d.msg)||'Ошибка — ничего не изменено');});
  });
}

    function poolRow(c){
      var _rt=(svc==='chatgpt')?({ios:' · 📱 iOS',ph:' · 🇵🇭 Филиппины'}[c.route||'']||' · ⚠️ без маршрута'):'';

          var byr={};arr.forEach(function(c){var r=c.route||'';(byr[r]=byr[r]||[]).push(c)});
          Object.keys(byr).sort().forEach(function(rk){

            Object.keys(bypr).sort().forEach(function(pl){

        Object.keys(byp).sort().forEach(function(pl){
          h+='<div class="sub" style="margin:6px 0 4px 2px">'+planLabel(svc,pl)+' · '+byp[pl].length+' шт</div>';
          byp[pl].forEach(function(c){h+=poolRow(c);});

      Object.keys(byp2).sort().forEach(function(pl){
        h+='<div class="glabel">🟢 '+planLabel(svc,pl)+' ('+byp2[pl].length+')</div>';
        byp2[pl].forEach(function(c){h+=poolRow(c);});

/* Цвет сервиса закреплён за сервисом, а не за местом в рейтинге: ChatGPT
   всегда одного цвета, сколько бы сервисов ни было на экране. Набор проверен
   на различимость (в т.ч. при дальтонизме) на тёмном фоне панели. */
var SVC_COL={chatgpt:'#199e70',claude:'#d95926',perplexity:'#3987e5',appstore:'#9085e9',credits:'#c98500'};
var SVC_EXTRA=['#d55181','#008300','#e66767'];
function svcColor(k){
  if(SVC_COL[k])return SVC_COL[k];
  var h=0;k=''+(k||'');for(var i=0;i<k.length;i++){h=(h*31+k.charCodeAt(i))>>>0;}
  return SVC_EXTRA[h%SVC_EXTRA.length];
}
function rub(n){return nf(Math.round(n||0))+' ₽';}
function sgn(n){return (n>0?'+':'')+nf(Math.round(n||0));}

/* Подсказка-«пузырь» для столбиков: показываем точное значение по нажатию. */
function _tipShow(el,txt){
  var t=document.getElementById('vtip');
  if(!t){t=document.createElement('div');t.id='vtip';t.className='vtip';document.body.appendChild(t);}
  t.innerHTML=txt;t.style.display='block';
  var r=el.getBoundingClientRect();
  var x=r.left+r.width/2, y=r.top-8;
  t.style.left=Math.max(8,Math.min(window.innerWidth-t.offsetWidth-8,x-t.offsetWidth/2))+'px';
  t.style.top=Math.max(8,y-t.offsetHeight)+'px';
  clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},4000);
}
function _tipHide(){var t=document.getElementById('vtip');if(t){t.style.display='none';clearTimeout(t._h);}}

/* Анимации: числа «досчитываются», полосы и столбики вырастают. Всё это
   отключается, если на телефоне включено «уменьшить движение». */
var _RM=false;try{_RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
function fxRun(root){
  root=root||document;
  var cus=root.querySelectorAll('.cu[data-v]');
  cus.forEach(function(el){
    var v=parseFloat(el.getAttribute('data-v'))||0, suf=el.getAttribute('data-suf')||'', pre=el.getAttribute('data-pre')||'';
    if(_RM||Math.abs(v)<2){el.textContent=pre+nf(Math.round(v))+suf;return;}
    var t0=null,dur=650;
    function step(ts){if(!t0)t0=ts;var p=Math.min(1,(ts-t0)/dur);var e=1-Math.pow(1-p,3);
      el.textContent=pre+nf(Math.round(v*e))+suf;if(p<1)requestAnimationFrame(step);}
    requestAnimationFrame(step);
  });
  var ws=root.querySelectorAll('[data-w]');
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    ws.forEach(function(el){el.style.width=el.getAttribute('data-w');});
    root.querySelectorAll('[data-h]').forEach(function(el){el.style.height=el.getAttribute('data-h');});
  });});
}

/* Изменение к прошлому периоду. Если в прошлом было 0 — процент не считаем
   (деление на ноль дало бы «+∞%»), пишем как есть. */
function deltaHtml(cur,prev,lab,money){
  cur=cur||0;prev=prev||0;
  if(!prev&&!cur)return '<div class="delta muted">'+esc(lab)+': тоже 0</div>';
  if(!prev)return '<div class="delta pos">▲ было 0 · '+esc(lab)+'</div>';
  /* От отрицательной базы процент бессмыслен (рост с −30 до 773 — это не
     «+2677%»): пишем, сколько было. */
  if(prev<0)return '<div class="delta '+(cur>=prev?'pos':'neg')+'">'+(cur>=prev?'▲':'▼')+' было '+(money?rub(prev):nf(prev))+' · '+esc(lab)+'</div>';
  var p=Math.round((cur-prev)/Math.abs(prev)*100);
  var up=cur>=prev;
  return '<div class="delta '+(cur===prev?'muted':(up?'pos':'neg'))+'" title="'+esc(lab)+'">'
    +(cur===prev?'= ':(up?'▲ ':'▼ '))+Math.abs(p)+'% · '+(money?rub(prev):nf(prev))+' '+esc(lab)+'</div>';
}
function kpiCard(lab,val,suf,deltaH,cls,sub){
  return '<div class="mcard fx"><div class="mlab">'+esc(lab)+'</div>'
    +'<div class="mval '+(cls||'')+'"><span class="cu" data-v="'+(val||0)+'" data-suf="'+(suf||'')+'">'+nf(Math.round(val||0))+(suf||'')+'</span></div>'
    +(sub?'<div class="delta muted">'+sub+'</div>':'')+(deltaH||'')+'</div>';
}
function skel(n,h){var s='';for(var i=0;i<(n||3);i++)s+='<div class="sk" style="height:'+(h||64)+'px;margin-bottom:10px"></div>';return s;}
function errBox(retry){return '<div class="block"><div class="sub neg">⚠️ Не загрузилось — это сбой связи или сервера, а не «пусто». Цифры намеренно не показаны.</div>'
  +(retry?'<button class="btn sec" style="margin-top:10px" onclick="'+retry+'">🔄 Повторить</button>':'')+'</div>';}

/* Вертикальные столбики (SVG не нужен): выручка по часам/дням. Нажатие —
   точное значение; у дней — переход в «Деньги» за этот день. */
function vbars(points,key,opts){
  opts=opts||{};
  if(!points||!points.length)return '<div class="note">Нет данных за период.</div>';
  window._vtips=window._vtips||[];
  var mx=Math.max.apply(0,points.map(function(p){return p[key]||0;}))||1;
  var n=points.length, showEvery=n>10?Math.ceil(n/7):1;
  var h='<div class="vbars" style="height:'+(opts.h||120)+'px">';
  points.forEach(function(p,i){
    var v=p[key]||0, pct=Math.max(v>0?4:1.5,Math.round(v/mx*100));
    var tip=esc(p.label+(p.wd?(' '+p.wd):''))+': <b>'+(opts.money?rub(v):nf(v))+'</b>'
      +(p.orders!=null?('<br>заказов: '+p.orders):'')
      +(p.profit!=null&&opts.money?('<br>прибыль: '+sgn(p.profit)+' ₽'):'');
    if(opts.dayClick&&p.key&&p.key.length===10){
      tip+='<br><a class="vtip-a" onclick="window._mP=\'date\';window._mDate=\''+p.key+'\';document.getElementById(\'vtip\').style.display=\'none\';open2(\'Деньги\')">Открыть этот день ›</a>';
    }
    var ti=window._vtips.push(tip)-1;
    h+='<div class="vb'+(opts.hi&&p.key===opts.hi?' hi':'')+'" onclick="event.stopPropagation();_tipShow(this,window._vtips['+ti+'])">'
      +'<i style="height:0" data-h="'+pct+'%"></i>'
      +'<em>'+((i%showEvery===0)?esc(p.label):'')+'</em></div>';
  });
  return h+'</div>';
}
/* Горизонтальные полосы с подписями: сервисы, источники. */
function hbars2(items,fmt){
  if(!items.length)return '<div class="note">Нет данных.</div>';
  var mx=Math.max.apply(0,items.map(function(i){return Math.abs(i.val)}))||1;
  return items.map(function(i){
    return '<div class="hb"'+(i.onclick?' style="cursor:pointer" onclick="'+i.onclick+'"':'')+'><div class="hb-l"><span style="color:var(--txt)"><span class="dot" style="display:inline-block;margin-right:6px;background:'+(i.color||'var(--acc)')+'"></span>'+esc(i.label)+'</span><span>'+(fmt?fmt(i):nf(i.val))+'</span></div>'
      +'<div class="hb-t"><div class="hb-f" style="width:0;background:'+(i.color||'var(--acc)')+'" data-w="'+Math.max(2,Math.round(Math.abs(i.val)/mx*100))+'%"></div></div>'
      +(i.sub?'<div class="sub" style="margin-top:3px">'+i.sub+'</div>':'')+'</div>';
  }).join('');
}

  document.querySelectorAll('.tabbar a').forEach(function(a){a.classList.toggle('on',a.getAttribute('data-s')===t);});
}

function denied(){app.innerHTML='<div style="padding:70px 24px;text-align:center"><div style="font-size:48px">🔒</div><h1 style="font-size:18px;margin:10px 0 4px">Доступ только для администратора</h1><p style="color:var(--txt2);font-size:13px">Открой панель из своего аккаунта в боте.</p></div>';}
function boot(){
  var tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){try{tg.ready();tg.expand();tg.setHeaderColor&&tg.setHeaderColor('#0d0e12');}catch(e){}}
  if(tg&&tg.BackButton){try{tg.BackButton.onClick(function(){back()});}catch(e){}}
  var initData=tg?tg.initData:"";
  go(home);
  window._ovInit=initData;
  ovReload();
}

/* Загрузка сводки дашборда. Вынесена из boot(), чтобы кнопка «Повторить»
   вызывала ровно то же самое. Пустого .catch больше нет: любой сбой переводит
   экран в состояние «не загрузилось», а не оставляет его с чем попало. */
/* silent=true — данные уже на экране: не показываем скелетон и не дёргаем
   прокрутку, просто подменяем числа, когда придёт ответ. */
function _homeRedraw(){
  if(stack.length<=1&&window._cur===home){app.innerHTML=home();try{syncTabs();fxRun(app)}catch(e){}}
}
function ovReload(silent){
  if(!(silent&&OV_STATE==='ok')){ OV_STATE='load'; ATT_STATE='load'; if(stack.length<=1)go(home,false); }
  var seq=(window._ovSeq=(window._ovSeq||0)+1);
  fetch('/api/admin/fin',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({initData:window._ovInit||'',period:window._hP||'today'})})
   .then(function(r){return r.json().then(function(d){return {s:r.status,d:d}},
                                          function(){return {s:r.status,d:null}})})
   .then(function(x){
     if(seq!==window._ovSeq)return;            // пока грузили, выбрали другой период
     if(x.s===403){ denied(); return; }
     if(!x.d||!x.d.ok||!x.d.totals){ if(!(silent&&OV_STATE==='ok'))OV_STATE='err'; }
     else { OVERVIEW=x.d; OV_STATE='ok'; }
     _homeRedraw();
   })
   .catch(function(){ if(seq!==window._ovSeq)return; if(!(silent&&OV_STATE==='ok'))OV_STATE='err'; _homeRedraw(); });
  api('/api/admin/attention',{}).then(function(a){
    if(seq!==window._ovSeq)return;
    if(a&&a.ok){ATT=a;ATT_STATE='ok';}else if(!(silent&&ATT_STATE==='ok')){ATT_STATE='err';}
    _homeRedraw();
  });
}
boot();
</script>
<script>
/* ── Стрелка «свернуть клавиатуру» ──────────────────────────────────────────
   В Telegram-мини-аппе нет системной панели над клавиатурой (её рисует сам
   браузер, WebView Telegram её не даёт), поэтому кнопку делаем свою.
   Появляется только пока фокус в поле ввода, лежит прямо над клавиатурой.
   Позицию берём из visualViewport: на iOS layout-вьюпорт при открытии
   клавиатуры НЕ уменьшается, и обычный bottom:0 уехал бы под клавиатуру. */
(function(){
  if (window.__kbHideReady) return;
  window.__kbHideReady = true;

  var btn = null, hideTimer = null;

  function isField(el){
    if (!el) return false;
    var t = (el.tagName || '').toUpperCase();
    if (t === 'TEXTAREA') return true;
    if (t !== 'INPUT') return !!el.isContentEditable;
    var ty = (el.type || 'text').toLowerCase();
    return ['text','search','tel','url','email','number','password',''].indexOf(ty) >= 0;
  }

  function make(){
    if (btn) return btn;
    btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('aria-label', 'Свернуть клавиатуру');
    btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" '
      + 'stroke="currentColor" stroke-width="2.4" stroke-linecap="round" '
      + 'stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
    btn.style.cssText = [
      'position:fixed','right:12px','z-index:2147483000','display:none',
      'width:38px','height:38px','padding:0','border:0','border-radius:50%',
      'align-items:center','justify-content:center',
      'color:#fff','background:rgba(30,32,38,.86)',
      '-webkit-backdrop-filter:blur(8px)','backdrop-filter:blur(8px)',
      'box-shadow:0 3px 12px rgba(0,0,0,.4)','cursor:pointer',
      '-webkit-tap-highlight-color:transparent','touch-action:manipulation',
      'opacity:.92'
    ].join(';');
    // pointerdown + preventDefault: иначе поле теряет фокус ДО клика,
    // кнопка успевает скрыться, и нажатие уходит в пустоту.
    btn.addEventListener('pointerdown', function(e){
      e.preventDefault();
      var a = document.activeElement;
      if (a && a.blur) { try { a.blur(); } catch (_e) {} }
      hide();
    });
    document.body.appendChild(btn);
    return btn;
  }

  function place(){
    if (!btn) return;
    var vv = window.visualViewport, gap = 10;
    if (vv) {
      var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      btn.style.bottom = (kb + gap) + 'px';
    } else {
      btn.style.bottom = gap + 'px';
    }
  }

  function show(){
    if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; }
    make().style.display = 'flex';
    place();
  }
  function hide(){ if (btn) btn.style.display = 'none'; }

  document.addEventListener('focusin', function(e){
    if (isField(e.target)) show();
  }, true);
  document.addEventListener('focusout', function(){
    // Небольшая пауза: при переходе между полями focusout приходит раньше
    // focusin, и кнопка иначе моргала бы на каждом переключении.
    if (hideTimer) clearTimeout(hideTimer);
    hideTimer = setTimeout(function(){
      if (!isField(document.activeElement)) hide();
    }, 120);
  }, true);

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', place);
    window.visualViewport.addEventListener('scroll', place);
  }
  window.addEventListener('resize', place);

  // Enter в однострочном поле тоже убирает клавиатуру.
  document.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target && (e.target.tagName || '').toUpperCase() === 'INPUT') {
      try { e.target.blur(); } catch (_e) {}
      hide();
    }
  }, true);
})();

</script>
</body>
