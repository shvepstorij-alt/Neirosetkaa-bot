<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
<title>Neirosetka — Админ-панель</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.7.0/tabler-icons.min.css"/>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#0d0e12; --surface:#14161c; --card:#1a1d25; --card2:#23262f;
  --txt:#eceef2; --txt2:#9aa0ad; --txt3:#6b6f7a;
  --acc:#e24a82; --acc2:#8b7be0; --acc-soft:rgba(226,74,130,.15);
  --green:#37c98a; --red:#f0617a; --amber:#f0b429; --blue:#4a9be2; --teal:#2dd4bf;
  --line:rgba(255,255,255,.08); --r:14px; --r2:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.phone{max-width:430px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden}
.wrap{padding:14px 14px 96px}
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px}
.brand{font-size:18px;font-weight:600;letter-spacing:.4px}.brand span{color:var(--acc)}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:15px}
.hero{text-align:center;margin:6px 0 4px}
.hero .hi{width:58px;height:58px;border-radius:18px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:28px;margin:0 auto 8px}
.hero h1{font-size:19px;font-weight:600;margin:0}.hero p{font-size:12.5px;color:var(--txt2);margin:4px 0 0}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 4px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:10px 8px;text-align:center}
.chip .v{font-size:15px;font-weight:600}.chip .l{font-size:10px;color:var(--txt2);margin-top:2px}
.chip .d{font-size:10px;margin-top:2px}
.glabel{font-size:12.5px;font-weight:600;color:var(--acc);margin:20px 4px 10px;display:flex;align-items:center;gap:7px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 12px;display:flex;align-items:center;gap:11px;cursor:pointer;transition:.12s}
.card:active{transform:scale(.97);border-color:var(--acc)}.card.full{grid-column:1/-1}
.ic{width:36px;height:36px;border-radius:11px;background:var(--acc-soft);color:var(--acc);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.lbl{font-size:13px;line-height:1.25}
.hdr{display:flex;align-items:center;gap:10px;padding:14px 14px 8px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.back{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--txt);cursor:pointer;font-size:18px;flex-shrink:0}
.back:active{transform:scale(.94)}.htitle{font-size:16px;font-weight:600}.hsub{font-size:11.5px;color:var(--txt2);margin-top:1px}
.row{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;display:flex;align-items:center;gap:12px;margin-bottom:9px;cursor:pointer;transition:.12s}
.row:active{transform:scale(.985);border-color:var(--acc)}.row .lbl2{font-size:13.5px}.row .sub{font-size:11.5px;color:var(--txt2);margin-top:2px}
.chev{margin-left:auto;color:var(--txt3);font-size:18px}
.tag{font-size:10.5px;padding:2px 8px;border-radius:20px;font-weight:600}
.tag.g{background:rgba(55,201,138,.16);color:var(--green)}.tag.r{background:rgba(240,97,122,.16);color:var(--red)}
.tag.a{background:rgba(240,180,41,.16);color:var(--amber)}.tag.n{background:var(--card2);color:var(--txt2)}.tag.b{background:rgba(74,155,226,.16);color:var(--blue)}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.mcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:12px}
.mlab{font-size:11.5px;color:var(--txt2)}.mval{font-size:20px;font-weight:700;margin-top:3px}
.delta{font-size:11px;margin-top:3px}.pos{color:var(--green)}.neg{color:var(--red)}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:14px;gap:2px}
.seg button{flex:1;border:0;background:transparent;color:var(--txt2);font-size:12.5px;padding:8px 4px;border-radius:8px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--acc);color:#fff}
label.fl{display:block;font-size:12px;color:var(--txt2);margin:12px 2px 6px}
input.f,textarea.f,select.f{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);color:var(--txt);font-size:14px;padding:11px 12px;outline:none}
input.f:focus,textarea.f:focus{border-color:var(--acc)}textarea.f{min-height:96px;resize:vertical;font-family:inherit}
.btn{width:100%;background:var(--acc);color:#fff;border:0;border-radius:var(--r2);padding:13px;font-size:14px;font-weight:600;cursor:pointer;margin-top:14px}
.btn:active{transform:scale(.99)}.btn.sec{background:var(--card);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:rgba(240,97,122,.16);color:var(--red)}.btn.row2{margin-top:0}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btns3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.sw{width:46px;height:27px;border-radius:14px;background:#3a3d47;position:relative;flex-shrink:0;cursor:pointer;transition:.15s;margin-left:auto}
.sw.on{background:var(--acc)}.sw b{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.15s}.sw.on b{left:22px}
.note{font-size:12px;color:var(--txt2);background:var(--card2);border-radius:var(--r2);padding:11px 12px;line-height:1.55;margin-top:12px}
.block{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.block h4{margin:0 0 10px;font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-top:1px solid var(--line)}
.kv:first-of-type{border-top:0}.kv .k{color:var(--txt2)}.muted{color:var(--txt2)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;margin:8px 2px 22px}
.bars .b{flex:1;background:rgba(226,74,130,.18);border-radius:6px 6px 0 0;position:relative;min-height:3px}
.bars .b i{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:9.5px;color:var(--txt3);font-style:normal}
.bars .b span{position:absolute;top:-15px;left:0;right:0;text-align:center;font-size:9px;color:var(--txt2)}
.bars .b.hi{background:var(--acc)}
/* donut */
.donutwrap{display:flex;align-items:center;gap:18px}
.donut{width:118px;height:118px;border-radius:50%;flex-shrink:0;position:relative}
.dhole{position:absolute;inset:17px;background:var(--card);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dhole span{font-size:15px;font-weight:700;line-height:1}.dhole i{font-size:9.5px;color:var(--txt2);font-style:normal;margin-top:2px}
.legend{flex:1;min-width:0}.lg{font-size:12px;display:flex;align-items:center;gap:7px;padding:3px 0;color:var(--txt2)}
.lg b{margin-left:auto;color:var(--txt);font-weight:600}.dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
/* hbars */
.hb{margin-bottom:12px}.hb-l{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.hb-l span{color:var(--txt2)}
.hb-t{height:9px;background:var(--card2);border-radius:6px;overflow:hidden}.hb-f{height:100%;border-radius:6px;background:var(--acc)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;font-size:13px;font-weight:600;padding:10px 18px;border-radius:24px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
.toast.show{opacity:1;bottom:34px}
.tabbar{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;text-align:center;color:var(--txt3);font-size:10px;text-decoration:none;cursor:pointer}
.tabbar a i{display:block;font-size:20px;margin-bottom:3px}.tabbar a.on{color:var(--acc)}
/* Пока открыта клавиатура, нижняя панель разделов не нужна: она всплывает
   прямо над клавиатурой и закрывает поле, в которое печатаешь. Прячем её на
   время ввода и возвращаем, как только фокус ушёл. */
body.kb-open .tabbar{display:none}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:9px 12px;margin-bottom:12px}
.search input{flex:1;background:transparent;border:0;outline:none;color:var(--txt);font-size:13.5px}
/* Живой поиск по странице. Появляется сам там, где есть что искать, — списки
   в панели доходят до сотни строк (89 кодов в пуле), и прокручивать их,
   чтобы найти один, невозможно. */
.psbar{display:none;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:8px 11px;margin:0 14px 10px}
.psbar.on{display:flex}
.psbar input{flex:1;background:transparent;border:0;outline:none;color:var(--txt);font-size:13.5px}
.psbar .psn{font-size:11.5px;color:var(--txt2);white-space:nowrap}
.psbar .psx{cursor:pointer;color:var(--txt2);font-size:15px;padding:0 2px}
.pshit{background:rgba(240,180,41,.28);border-radius:3px}
/* ── Объединённые разделы: анимации, фильтры, уровни состояния ── */
.sub{font-size:11.5px;color:var(--txt2);line-height:1.45}.lbl2{font-size:13.5px;line-height:1.3}
.hb .sub{margin-top:3px}.row .tag,.block .tag{display:inline-block;line-height:1.45;white-space:normal}.kv{gap:10px}.kv>span{min-width:0;overflow-wrap:anywhere}.kv>span.k{flex-shrink:1}.hsub,.htitle{overflow-wrap:anywhere}.hdr>div:last-child{min-width:0}.lbl2,.sub{overflow-wrap:anywhere}#gwcfm .sub{font-size:13px;line-height:1.5}
.fx{animation:fxIn .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes fxIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#app>.wrap,#app .wrap{animation:fxIn .22s ease both}
.sk{background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:skM 1.15s linear infinite;border-radius:12px}
@keyframes skM{from{background-position:200% 0}to{background-position:-200% 0}}
.hb-f{transition:width .7s cubic-bezier(.2,.8,.2,1)}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-bottom:10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.fchip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--txt2);font-size:12px;font-weight:600;padding:7px 11px;border-radius:20px;cursor:pointer;white-space:nowrap;transition:.15s}
.fchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.fchip b{margin-left:6px;font-weight:700}.fchip.on b{color:#fff}
.lvl-act{border-left:3px solid var(--red)!important}.lvl-wait{border-left:3px solid var(--amber)!important}
.lvl-done{border-left:3px solid var(--green)!important}.lvl-manual{border-left:3px solid var(--amber)!important}.lvl-off{border-left:3px solid var(--txt3)!important;opacity:.8}
.att{display:flex;align-items:center;gap:10px;padding:10px;margin-top:8px;background:var(--card2);border-radius:var(--r2);cursor:pointer;transition:.12s}
.att:active{transform:scale(.985)}.att .ic{width:32px;height:32px;font-size:17px}
.vbars{display:flex;align-items:flex-end;gap:3px;margin:6px 0 20px;position:relative}
.vbars .vb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;position:relative;cursor:pointer}
.vbars .vb i{display:block;background:#3987e5;border-radius:4px 4px 0 0;min-height:2px;transition:height .6s cubic-bezier(.2,.8,.2,1)}
.vbars .vb.hi i{background:var(--acc)}.vbars .vb:active i{filter:brightness(1.3)}
.vbars .vb em{position:absolute;bottom:-17px;left:-6px;right:-6px;text-align:center;font-size:9.5px;color:var(--txt3);font-style:normal;white-space:nowrap}
.vtip{position:fixed;z-index:200;background:#fff;color:#111;font-size:12px;line-height:1.45;padding:7px 10px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.45);display:none;max-width:240px}
.vtip-a{display:inline-block;margin-top:4px;color:#c2185b;font-weight:700;cursor:pointer}
.mval .cu{font-variant-numeric:tabular-nums}
.tabbar a{transition:color .15s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div id="app"></div>
  <div class="tabbar">
    <a class="on" data-s="home" onclick="tabGo('home')"><i class="ti ti-layout-dashboard"></i>Сводка</a>
    <a data-s="Деньги" onclick="tabGo('Деньги')"><i class="ti ti-coin"></i>Деньги</a>
    <a data-s="Заказы" onclick="tabGo('Заказы')"><i class="ti ti-receipt"></i>Заказы</a>
    <a data-s="Выдача" onclick="tabGo('Выдача')"><i class="ti ti-package"></i>Выдача</a>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
/* ── Клавиатура и нижняя панель ─────────────────────────────────────────
   Панель разделов приклеена к низу экрана (position:fixed). Когда на
   телефоне открывается клавиатура, она остаётся видимой и наезжает на поле
   ввода — 29.09.2026 Александр прислал ровно такой экран. Снимаем её, пока
   идёт ввод.

   Считаем по фокусу, а не по высоте экрана: изменение высоты на разных
   телефонах и в Telegram WebApp срабатывает по-разному, а фокус в поле —
   признак однозначный. visualViewport оставлен запасным сигналом: если
   клавиатуру закрыли жестом, фокус может остаться в поле, и панель иначе
   не вернулась бы. */
(function(){
  var _kb = false;
  function _isField(el){
    if (!el) return false;
    var t = (el.tagName || '').toUpperCase();
    return t === 'INPUT' || t === 'TEXTAREA' || el.isContentEditable === true;
  }
  function _set(on){
    on = !!on;
    if (on === _kb) return;
    _kb = on;
    try { document.body.classList.toggle('kb-open', on); } catch (e) {}
  }
  document.addEventListener('focusin', function(e){
    if (_isField(e.target)) _set(true);
  }, true);
  document.addEventListener('focusout', function(){
    // Небольшая пауза: при переходе между двумя полями фокус на миг пустой,
    // и панель успевала мигнуть.
    setTimeout(function(){ if (!_isField(document.activeElement)) _set(false); }, 80);
  }, true);
  if (window.visualViewport){
    var _base = window.visualViewport.height;
    window.visualViewport.addEventListener('resize', function(){
      var h = window.visualViewport.height;
      if (h > _base) _base = h;            // экран вырос — это новая норма
      // Клавиатура съедает заметную часть экрана. Вернулась высота —
      // значит клавиатуры нет, даже если фокус остался в поле.
      if (_base - h < 100) _set(false);
      else if (_isField(document.activeElement)) _set(true);
    });
  }
})();
/* ===== mock state ===== */
var S={toggles:{Suno:1,Kling:1,HeyGen:0,Higgsfield:1,Zoom:1,Krea:1,YouTube:0,
  "ChatGPT Mini App":1,"Claude Mini App":1,"Perplexity Mini App":1,Техработы:0,"Авто-исправление":1,
  "Plus ручная выдача":0,"Новый аккаунт ручная выдача":1},
  models:{"GPT Image 2":1,"Nano Banana":1,"Flux Pro":1,"Ideogram V3":1,"Recraft V3":0,
   "Veo 3.1":1,"Kling Turbo":1,"Seedance 1.5 Pro":1,"Kling Pro":0,"Nano Banana edit":1,"Flux Kontext":1,"Kling Motion":1,"Higgsfield Anim":0}};
var stack=[],app=document.getElementById('app');
var OVERVIEW=null;
/* Состояние загрузки дашборда. Раньше его не было, и home() при пустом
   OVERVIEW подставлял ЗАШИТЫЕ демо-числа (22 заказа, 78 140 ₽, 9 юзеров,
   выдуманная неделя и разбивка по сервисам). Их видно было и в первую
   секунду до ответа сервера, и — навсегда — если запрос падал: .catch был
   пустой. Пустой экран честен, а такой — нет: по этим числам можно было
   принять решение. Теперь три состояния: грузим / получили / не смогли. */
var OV_STATE='load';
var C={pink:"#e24a82",purple:"#8b7be0",teal:"#2dd4bf",amber:"#f0b429",blue:"#4a9be2",green:"#37c98a",red:"#f0617a",gray:"#5a5e6b"};

function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove('show')},1400)}
/* esc экранировал только & и < . Этого хватает для текста, но НЕ для
   атрибутов: кавычка в названии обрывала value="…" — поле просто теряло
   часть текста, и выглядело это как «панель съела название». В соседнем
   экране (NS Gifts) это уже чинили своим nsgEsc — приводим общий esc к
   тому же. Проверено: esc нигде не применяется дважды и никуда, кроме
   разметки, не уходит. */
function esc(s){return(''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
/* Ссылка приходит ОТ КЛИЕНТА и раньше вставлялась в href как есть. Кавычка
   в пути закрывала атрибут, и дальше можно было дописать обработчик события —
   он выполнялся уже в админке владельца, где доступны initData и вызовы api.
   Нашёл внешний аудит 29.09.2026.
   Два рубежа: пускаем только http/https (иначе javascript: и data: сработали
   бы даже без кавычки) и экранируем значение. Чужая схема показывается
   текстом, а не ссылкой — информацию не теряем. */
function safeHref(u){ u=(''+(u||'')).trim(); return /^https?:\/\//i.test(u) ? u : ''; }
function linkRow(label,u){
  var su=safeHref(u);
  return '<div class="kv"><span class="k">'+label+'</span><span style="word-break:break-all">'
    + (su ? '<a href="'+esc(su)+'" target="_blank" rel="noopener noreferrer" style="color:var(--acc);text-decoration:underline">Открыть ссылку ↗</a>'
          : esc(u))
    + '</span></div>';
}
function nf(n){n=Number(n);return (isFinite(n)?n:0).toLocaleString('ru')}
function go(fn,push){if(window._apiStale)return;window._navN++;if(push!==false)stack.push(fn);window._cur=fn;try{_tipHide();window._vtips=[];}catch(e){}window.scrollTo(0,0);app.innerHTML=fn();syncBack();psInit();try{syncTabs()}catch(e){}}

/* ── Живой поиск по странице ───────────────────────────────────────────────
   Фильтрует то, что уже нарисовано, — без запросов к серверу. Ищем по
   «листьям»: блокам и строкам, внутри которых нет других таких же. Иначе
   пришлось бы прятать целую секцию из-за одного несовпадения.
   Заголовок группы прячется, только если под ним не осталось ни одной
   видимой строки — иначе в списке висели бы пустые подписи. */
function _psItems(){
  var out=[],all=document.querySelectorAll('#app .block, #app .row');
  for(var i=0;i<all.length;i++){
    var e=all[i];
    if(e.querySelector && e.querySelector('.block, .row'))continue;  // не лист

function psInit(){

  var check=function(){

    if(_psItems().length>=8){b.classList.add('on');}else{b.classList.remove('on');}
    if(window._psQ){var q=document.getElementById('psq');if(q){q.value=window._psQ;psApply(window._psQ);}}

function psApply(v){
  window._psQ=v||'';
  var q=(v||'').trim().toLowerCase().replace(/ё/g,'е');
  var items=_psItems(),shown=0;
  for(var i=0;i<items.length;i++){
    var e=items[i];
    if(!q){e.style.display='';shown++;continue;}
    var t=(e.textContent||'').toLowerCase().replace(/ё/g,'е');
    var ok=t.indexOf(q)>=0;
    e.style.display=ok?'':'none';
    if(ok)shown++;
  }
  /* Контейнеры (блок, внутри которого лежат строки) листьями не считаются и
     сами не фильтруются. Если этого не сделать, от них остаётся пустая
     карточка с одним заголовком, а подпись группы над ней так и висит —
     именно это и показал тест. Прячем контейнер, когда внутри не осталось
     ни одной видимой строки. */
  var conts=document.querySelectorAll('#app .block, #app .row');
  for(var k=0;k<conts.length;k++){
    var c=conts[k];
    if(!c.querySelector||!c.querySelector('.block, .row'))continue;   // это лист
    if(!q){c.style.display='';continue;}
    var kids=c.querySelectorAll('.block, .row'),alive=false;
    for(var m=0;m<kids.length;m++){
      if(kids[m].querySelector&&kids[m].querySelector('.block, .row'))continue;
      if(kids[m].style.display!=='none'){alive=true;break;}
    }
    c.style.display=alive?'':'none';
  }
  /* Подписи групп: прячем те, под которыми не осталось ничего видимого. */
  var labs=document.querySelectorAll('#app .glabel');
  for(var j=0;j<labs.length;j++){
    var lab=labs[j],n=lab.nextElementSibling,any=!q;
    while(n&&!(n.classList&&n.classList.contains('glabel'))){
      if(n.classList&&(n.classList.contains('block')||n.classList.contains('row'))
         &&n.style.display!=='none'){any=true;break;}
      n=n.nextElementSibling;
    }
    lab.style.display=any?'':'none';
  }
  var n1=document.getElementById('psn');
  if(n1)n1.textContent=q?(shown+' из '+items.length):'';
}

var SCREENS={};

/* Ответ сервера может прийти, когда ты уже ушёл с экрана. Многие действия
   после успеха делают back() — и опоздавший ответ «выкидывал» с того экрана,
   куда ты успел перейти. Поэтому каждый ответ знает, был ли переход после
   запроса (window._apiStale), и back() в таком ответе ничего не делает.
   Ревью 06.10.2026. */
window._navN=0;window._apiStale=false;
/* Действия, которые МЕНЯЮТ данные. Повторный тап, пока первый запрос ещё
   идёт, раньше отправлял второй такой же запрос: «Добавить тариф» трижды —
   три одинаковых тарифа, «Начислить» дважды — двойное начисление, «Записать
   выплату» дважды — две выплаты. Теперь такой же запрос, пока первый не
   вернулся, не отправляется. Чтения (загрузка экранов) не трогаем.
   Ревью 06.10.2026. */
var _MUT_RE=/\/api\/admin\/(promo-create|promo-deactivate|plan-add|plan-delete|service-add|service-delete|balance|block|referral-set|feed-order-action|order-action|order-delete|shop-order-action|add-codes|release-codes|code-delete|claude-code-action|broadcast|prices-save|recs-save|shopcats-save|shopdisplay-save|catsmeta-save|logo-save|logo-del|banners-save|banner-media|packs-save|model-price|setting-save|svc-save|claude-provider|nsg-product|nsg-bulk|giveaway-action|fin-settings)$/;
var _MUT_PARTNER=['add','remove','payout','promo_set','fee_set','rate_set','bcstart'];
var _inflight={};
function _isMut(path,body){
  /* Переключатели (вкл/выкл) не блокируем: экран переключается сразу, и
     заблокированный запрос оставил бы вид и сервер в разных положениях. */
  if(body&&(typeof body.on==='boolean'||typeof body.off==='boolean'||typeof body.enabled==='boolean'))return false;
  if(_MUT_RE.test(path))return true;
  if(path==='/api/admin/partner-set')return _MUT_PARTNER.indexOf(body.action)>=0;
  return !!(body&&(body.save||body.reset));
}
function api(path,body){var tg=window.Telegram&&window.Telegram.WebApp;body=body||{};
  var mkey=null;
  if(_isMut(path,body)){
    try{mkey=path+'|'+JSON.stringify(body);}catch(e){mkey=null;}
    if(mkey&&_inflight[mkey]){
      try{toast('Уже отправляю — дождись ответа');}catch(e){}
      return {then:function(){return new Promise(function(){});}};
    }
    if(mkey)_inflight[mkey]=1;
  }
  body.initData=tg?tg.initData:"";
  var n0=window._navN;
  var P=fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().catch(function(){return{ok:false}})}).catch(function(){return{ok:false}})
    .then(function(d){if(mkey)delete _inflight[mkey];return d;});
  return {then:function(f,g){return P.then(function(d){
    var prev=window._apiStale;window._apiStale=(window._navN!==n0);
    try{return f?f(d):d;}finally{window._apiStale=prev;}
  },g);}};
}

function _refLoad(){

function _refSet(k,v){window._ref=window._ref||{};window._ref[k]=v;
  if(k!=='page')window._ref.page=0;_refLoad();}

function _refRender(){
  var el=document.getElementById('refbody');if(!el)return;
  var d=window._refD||{},st=window._ref||{},h='';
  var share=d.usersTotal?Math.round(d.invitedTotal/d.usersTotal*100):0;

    +'<div class="kv"><span class="k">Всего клиентов в боте</span><span>'+nf(d.usersTotal||0)+'</span></div>'
    +'<div class="kv"><span class="k">Доля приглашённых</span><span>'+share+'%</span></div>'
    +'<div class="kv"><span class="k">Приглашающих</span><span>'+nf(d.total||0)+'</span></div></div>';

    +'<input placeholder="@ник, имя или ID" value="'+esc(st.q||'')+'" '
    +'onchange="_refSet(\'q\',this.value)"/></div>';

  var rows=d.rows||[];
  if(!rows.length){
    h+='<div class="note">'+(st.q?'По запросу «'+esc(st.q)+'» никого.'
        :'Пока никто никого не привёл.')+'</div>';
  }
  rows.forEach(function(r,i){
    h+='<div class="row" onclick="_refKids('+r.id+')">'
      +'<div><div class="lbl2">'+((d.page||0)*40+i+1)+'. '+esc(r.user)+'</div>'
      +'<div class="sub">ID '+r.id+'</div></div>'
      +'<div style="margin-left:auto;text-align:right">'
      +'<div style="font-size:13px;font-weight:600">'+r.refs+'</div>'
      +'<span class="tag '+(r.refsPaid?'g':'n')+'">'
      +(r.refsPaid?('купили '+r.refsPaid):'без покупок')+'</span></div></div>';
  });
  if((d.pages||1)>1){
    h+='<div class="btns2" style="margin-top:10px">'
      +'<button class="btn row2 sec"'+((d.page||0)<=0?' disabled':'')+' onclick="_refSet(\'page\','+((d.page||0)-1)+')">← Назад</button>'
      +'<button class="btn row2 sec"'+((d.page||0)>=(d.pages-1)?' disabled':'')+' onclick="_refSet(\'page\','+((d.page||0)+1)+')">Вперёд →</button></div>'
      +'<div class="note">Стр. '+((d.page||0)+1)+' из '+d.pages+' · нажми на строку, чтобы увидеть, КОГО именно привёл</div>';
  } else if(rows.length){
    h+='<div class="note">Нажми на строку, чтобы увидеть, кого именно человек привёл.</div>';
  }
  el.innerHTML=h;
}

/* Кого именно привёл конкретный человек. Открывается и из списка рефералов,
   и из карточки клиента — экран один. */
function _refKids(uid){
  /* Имя НЕ передаём через разметку. esc() в этой панели экранирует только & и <,
     кавычки не трогает: имя в Telegram задаёт посторонний человек, и двойная
     кавычка оборвала бы атрибут onclick, а обратный слэш — JS-строку. Имя берём
     из данных, которые и так лежат в памяти. */
  var who='';
  var _rows=((window._refD||{}).rows)||[];
  for(var _i=0;_i<_rows.length;_i++){ if(_rows[_i].id===uid){ who=_rows[_i].user; break; } }
  if(!who&&window._curUser&&window._curUser.id===uid){
    who=window._curUser.username?('@'+window._curUser.username):(window._curUser.name||'');
  }
  leaf(function(){
    setTimeout(function(){
      api('/api/admin/referrals',{action:'kids',userId:uid}).then(function(d){
        var el=document.getElementById('kidsbody');if(!el)return;
        if(!d||!d.ok){el.innerHTML='<div class="note neg">⚠️ Не удалось загрузить.</div>';return;}
        var ks=d.kids||[],h='';
        if(!ks.length){h='<div class="note">Никого не привёл.</div>';}
        var bought=ks.filter(function(k){return k.orders>0;}).length;
        var rub=ks.reduce(function(a,k){return a+(k.rub||0);},0);
        if(ks.length){
          h+='<div class="block"><div class="kv"><span class="k">Приглашено</span><span>'+ks.length+'</span></div>'
            +'<div class="kv"><span class="k">Из них купили</span><span'+(bought?' class="pos"':'')+'>'+bought+'</span></div>'
            +'<div class="kv"><span class="k">Всего оплатили</span><span>'+nf(rub)+' ₽</span></div></div>';
        }
        ks.forEach(function(k){
          h+='<div class="row"><div><div class="lbl2">'+esc(k.user)+'</div>'
            +'<div class="sub">ID '+k.id+(k.when?(' · пришёл '+_payWhen(k.when)):'')+'</div></div>'
            +'<div style="margin-left:auto;text-align:right">'
            +(k.orders?('<div style="font-size:13px;font-weight:600">'+nf(k.rub)+' ₽</div>'
                        +'<span class="tag g">покупок '+k.orders+'</span>')
                      :'<span class="tag n">не покупал</span>')
            +'</div></div>';
        });
        el.innerHTML=h;
      });
    },30);
    return hdr("Кого привёл "+(who||('ID '+uid)))
      +'<div class="wrap"><div id="kidsbody"><div class="note">Загружаю…</div></div></div>';
  });
}

function _copyOld(t){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(_){}document.body.removeChild(ta);toast(ok?'Скопировано ✓':'Не скопировалось — выдели и скопируй вручную: '+t);}

function copyText(t){t=''+t;try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast('Скопировано ✓')},function(){_copyOld(t)});return;}}catch(e){}_copyOld(t);}

function _shCropClamp(){var st=window._shcrop;var w=st.w0*st.scale,h=st.h0*st.scale;st.offx=Math.min(0,Math.max(st.VW-w,st.offx));st.offy=Math.min(0,Math.max(st.VH-h,st.offy));}

    '<div id="lgbody" style="margin-top:12px"><div class="note">Загружаю…</div></div></div>';};
function _loadLogos(){api('/api/admin/logos').then(function(d){var b=document.getElementById('lgbody');if(!b)return;if(!d||!d.ok){b.innerHTML='<div class="note">Ошибка</div>';return;}
  b.innerHTML=(d.services||[]).map(function(s){
    return '<div class="row"><div style="flex:1"><div class="lbl2">'+esc(s.name)+'</div><div class="sub">'+(s.custom?'свой логотип':'по умолчанию')+'</div></div>'
      +'<label class="tag g" style="cursor:pointer;padding:6px 10px">Загрузить<input type="file" accept="image/*" style="display:none" onchange="_logoPick(\''+s.key+'\',this)"></label>'
      +(s.custom?'<span class="tag r" style="cursor:pointer;margin-left:6px;padding:6px 10px" onclick="_logoDel(\''+s.key+'\')">✕</span>':'')+'</div>';
  }).join('');});}
function _logoPick(key,input){
  var f=input.files&&input.files[0]; if(!f)return;
  var r=new FileReader();
  r.onload=function(){ _openCropper(r.result, key); };
  r.readAsDataURL(f);
}
function _openCropper(src, key){
  var V=280;
  var ov=document.createElement('div'); ov.id='cropov';
  ov.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML='<div style="color:#fff;font-weight:700;margin-bottom:12px">Выбери область логотипа</div>'
    +'<div id="cropvp" style="width:'+V+'px;height:'+V+'px;overflow:hidden;border-radius:22px;position:relative;background:#fff;touch-action:none;box-shadow:0 0 0 2px rgba(255,255,255,.3)">'
    +'<img id="cropimg" style="position:absolute;left:0;top:0;-webkit-user-drag:none;pointer-events:none" src="'+src+'"></div>'
    +'<input id="cropzoom" type="range" min="100" max="300" value="100" style="width:'+V+'px;margin:16px 0">'
    +'<div style="display:flex;gap:10px;width:'+V+'px"><button class="btn sec" style="flex:1" onclick="_cropCancel()">Отмена</button><button class="btn" style="flex:1" onclick="_cropSave()">Сохранить</button></div>';
  document.body.appendChild(ov);
  window._crop={V:V,key:key,offx:0,offy:0,scale:1,base:1,w0:0,h0:0};
  var img=document.getElementById('cropimg');
  function _ready(){
    var st=window._crop; st.w0=img.naturalWidth||1; st.h0=img.naturalHeight||1;
    st.base=V/Math.min(st.w0,st.h0); st.scale=st.base;
    st.offx=(V-st.w0*st.scale)/2; st.offy=(V-st.h0*st.scale)/2;
    _cropClamp(); _cropRender();
  }
  img.onload=_ready;
  if(img.complete && img.naturalWidth) _ready();
  _cropBindDrag();
}
function _cropClamp(){var st=window._crop;var w=st.w0*st.scale,h=st.h0*st.scale;
  st.offx=Math.min(0,Math.max(st.V-w,st.offx)); st.offy=Math.min(0,Math.max(st.V-h,st.offy));}
function _cropRender(){var st=window._crop;var img=document.getElementById('cropimg');if(!img)return;
  img.style.width=(st.w0*st.scale)+'px';img.style.height=(st.h0*st.scale)+'px';
  img.style.left=st.offx+'px';img.style.top=st.offy+'px';}
function _cropZoom(z){var st=window._crop;if(!st)return;
  var cx=(st.V/2-st.offx)/st.scale, cy=(st.V/2-st.offy)/st.scale;
  st.scale=st.base*z; st.offx=st.V/2-cx*st.scale; st.offy=st.V/2-cy*st.scale;
  _cropClamp(); _cropRender();}
function _cropBindDrag(){var vp=document.getElementById('cropvp');if(!vp)return;var st=window._crop;var drag=false,px=0,py=0;
  vp.addEventListener('pointerdown',function(e){drag=true;px=e.clientX;py=e.clientY;try{vp.setPointerCapture(e.pointerId);}catch(x){}});
  vp.addEventListener('pointermove',function(e){if(!drag)return;st.offx+=e.clientX-px;st.offy+=e.clientY-py;px=e.clientX;py=e.clientY;_cropClamp();_cropRender();});
  vp.addEventListener('pointerup',function(){drag=false;});
  vp.addEventListener('pointercancel',function(){drag=false;});
  var z=document.getElementById('cropzoom'); if(z) z.addEventListener('input',function(){_cropZoom(this.value/100);});
}
function _cropCancel(){var o=document.getElementById('cropov');if(o)o.remove();window._crop=null;}
function _cropSave(){var st=window._crop;if(!st)return;var img=document.getElementById('cropimg');
  var sSize=st.V/st.scale, sx=-st.offx/st.scale, sy=-st.offy/st.scale;
  // жёстко держим область внутри картинки — чтобы не было белых полосок по краю
  sSize=Math.min(sSize, st.w0, st.h0);
  sx=Math.max(0, Math.min(sx, st.w0 - sSize));
  sy=Math.max(0, Math.min(sy, st.h0 - sSize));
  var c=document.createElement('canvas');c.width=96;c.height=96;var ctx=c.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,96,96);
  try{ ctx.drawImage(img, sx,sy,sSize,sSize, 0,0,96,96); }catch(e){}
  var uri=c.toDataURL('image/png'); var key=st.key; _cropCancel();
  toast('Загружаю…');
  api('/api/admin/logo-save',{key:key,dataUri:uri}).then(function(d){toast(d&&d.ok?'Готово ✅':'Ошибка');open2('Логотипы сервисов');});
}
function _logoDel(key){toast('Удаляю…');api('/api/admin/logo-del',{key:key}).then(function(d){toast(d&&d.ok?'Сброшено ✅':'Ошибка');open2('Логотипы сервисов');});}

  var bgstyle = (b.img||b.med) ? '' : ('background:'+(b.bg||'linear-gradient(135deg,#10a37f,#0c7d61)')+';');
  host.style.cssText='position:relative;width:100%;aspect-ratio:'+ar.w+'/'+ar.h+';border-radius:16px;overflow:hidden;color:'+tc+';margin-top:6px;'+bgstyle;

    ? '<video src="'+b.med+'" autoplay muted loop playsinline style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></video><div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.05))"></div>'
    : (b.med
       ? '<div style="position:absolute;inset:0;background-size:cover;background-position:center;background-image:url(\''+b.med+'\')"></div><div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.05))"></div>'
       : '');

    +'<div id="bp-emoji" style="position:absolute;z-index:3;left:'+ex+'%;top:'+ey+'%;font-size:34px;cursor:move;touch-action:none">'+(b.emoji||'')+'</div>'

  _bnDrag('bp-emoji', function(x,y){b.ex=x;b.ey=y;});

function _bnDrag(id,setxy){
  var host=document.getElementById('bprev'); var el=document.getElementById(id); if(!host||!el) return;
  var drag=false;
  el.addEventListener('pointerdown',function(e){drag=true;try{el.setPointerCapture(e.pointerId);}catch(x){}e.preventDefault();});
  el.addEventListener('pointermove',function(e){if(!drag)return;var r=host.getBoundingClientRect();
    var x=Math.max(0,Math.min(96,(e.clientX-r.left)/r.width*100));
    var y=Math.max(0,Math.min(85,(e.clientY-r.top)/r.height*100));
    el.style.left=x+'%';el.style.top=y+'%';setxy(Math.round(x),Math.round(y));});
  el.addEventListener('pointerup',function(){drag=false;});
  el.addEventListener('pointercancel',function(){drag=false;});
}
function _bnToggle(i){window._bnList[i].on=!window._bnList[i].on;_bnRender();}
function _bnMove(i,d){var L=window._bnList;var j=i+d;if(j<0||j>=L.length)return;var t=L[i];L[i]=L[j];L[j]=t;_bnRender();}
function _bnDel(i){window._bnList.splice(i,1);if(window._bnEditIdx!==null)window._bnEditIdx=null;_bnRender();}
function _bnAdd(){window._bnList.push({id:_bnNewId(),on:true,title:'Новый баннер',sub:'',emoji:'🔥',bg:'linear-gradient(135deg,#10a37f,#0c7d61)',img:'',act:'url',val:''});window._bnEditIdx=window._bnList.length-1;_bnRender();}
function _bnNewId(){return 'b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
/* Видео и гифки НЕ гоняем через кадрировщик: он перерисовывает файл в canvas,
   и от анимации остаётся один кадр. Грузим как есть, кадр подбирается
   соотношением сторон. Файл уходит на сервер и живёт в БД, в баннере — ссылка. */
function _bnMed(i,input){
  var f=input.files&&input.files[0]; if(!f) return;
  var b=window._bnList[i]; if(!b) return;
  if(!b.id) b.id=_bnNewId();
  var isVid=/^video\//.test(f.type||'');
  var lim=isVid?12:8;
  if(f.size>lim*1024*1024){
    toast('Файл '+(f.size/1024/1024).toFixed(1)+' МБ — максимум '+lim+' МБ'); input.value=''; return;
  }
  if(isVid && ['video/mp4','video/webm'].indexOf(f.type)<0){
    toast('Нужен MP4 или WebM'); input.value=''; return;
  }
  toast('Загружаю…');
  var r=new FileReader();
  r.onload=function(){
    api('/api/admin/banner-media',{id:b.id,data:r.result}).then(function(d){
      if(!d||!d.ok){ toast((d&&d.msg)||'Ошибка загрузки'); return; }
      b.med=d.med; b.mtype=d.mtype; b.img='';
      toast((d.mtype==='video'?'Видео':'GIF')+' загружено ('+(d.size/1024/1024).toFixed(1)+' МБ)');
      _bnRender();
    });
  };
  r.readAsDataURL(f);
  input.value='';
}
function _bnMedClear(i){
  var b=window._bnList[i]; if(!b) return;
  api('/api/admin/banner-media',{id:b.id,clear:1}).then(function(){
    b.med=''; b.mtype=''; toast('Убрано'); _bnRender();
  });
}
function _bnImg(i,input){var f=input.files&&input.files[0];if(!f)return;var r=new FileReader();r.onload=function(){_openBannerCropper(r.result,i);};r.readAsDataURL(f);}
function _bnAspect(b){
  var a=(b&&b.ar&&/^\d+:\d+$/.test(b.ar))?b.ar.split(':'):null;
  if(a) return {w:+a[0], h:+a[1]};
  return {w:340, h:(b&&b.h?b.h:110)};   // запас для старых баннеров
}
function _openBannerCropper(src,i){
  var b=window._bnList[i]; var ar=_bnAspect(b);
  var Vw=300, Vh=Math.round(Vw*ar.h/ar.w);
  if(Vh>380){ Vh=380; Vw=Math.round(Vh*ar.w/ar.h); }   // не выше экрана
  var ov=document.createElement('div');ov.id='bcropov';
  ov.style.cssText='position:fixed;inset:0;z-index:100000;background:rgba(0,0,0,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px';
  ov.innerHTML='<div style="color:#fff;font-weight:700;margin-bottom:12px">Выбери область баннера</div>'
    +'<div id="bcvp" style="width:'+Vw+'px;height:'+Vh+'px;overflow:hidden;border-radius:14px;position:relative;background:#fff;touch-action:none;box-shadow:0 0 0 2px rgba(255,255,255,.3)"><img id="bcimg" style="position:absolute;left:0;top:0;pointer-events:none;-webkit-user-drag:none" src="'+src+'"></div>'
    +'<input id="bczoom" type="range" min="100" max="300" value="100" style="width:'+Vw+'px;margin:16px 0">'
    +'<div style="display:flex;gap:10px;width:'+Vw+'px"><button class="btn sec" style="flex:1" onclick="_bcCancel()">Отмена</button><button class="btn" style="flex:1" onclick="_bcSave()">Готово</button></div>';
  document.body.appendChild(ov);
  window._bcrop={Vw:Vw,Vh:Vh,i:i,offx:0,offy:0,scale:1,base:1,w0:0,h0:0};
  var img=document.getElementById('bcimg');
  function ready(){var st=window._bcrop;st.w0=img.naturalWidth||1;st.h0=img.naturalHeight||1;
    st.base=Math.max(Vw/st.w0,Vh/st.h0);st.scale=st.base;
    st.offx=(Vw-st.w0*st.scale)/2;st.offy=(Vh-st.h0*st.scale)/2;_bcClamp();_bcRender();}
  img.onload=ready; if(img.complete&&img.naturalWidth) ready();
  _bcDrag();
}
function _bcClamp(){var st=window._bcrop;var w=st.w0*st.scale,h=st.h0*st.scale;st.offx=Math.min(0,Math.max(st.Vw-w,st.offx));st.offy=Math.min(0,Math.max(st.Vh-h,st.offy));}
function _bcRender(){var st=window._bcrop;var img=document.getElementById('bcimg');if(!img)return;img.style.width=(st.w0*st.scale)+'px';img.style.height=(st.h0*st.scale)+'px';img.style.left=st.offx+'px';img.style.top=st.offy+'px';}
function _bcZoom(z){var st=window._bcrop;var cx=(st.Vw/2-st.offx)/st.scale,cy=(st.Vh/2-st.offy)/st.scale;st.scale=st.base*z;st.offx=st.Vw/2-cx*st.scale;st.offy=st.Vh/2-cy*st.scale;_bcClamp();_bcRender();}
function _bcDrag(){var vp=document.getElementById('bcvp');if(!vp)return;var st=window._bcrop;var d=false,px=0,py=0;
  vp.addEventListener('pointerdown',function(e){d=true;px=e.clientX;py=e.clientY;try{vp.setPointerCapture(e.pointerId);}catch(x){}});
  vp.addEventListener('pointermove',function(e){if(!d)return;st.offx+=e.clientX-px;st.offy+=e.clientY-py;px=e.clientX;py=e.clientY;_bcClamp();_bcRender();});
  vp.addEventListener('pointerup',function(){d=false;});vp.addEventListener('pointercancel',function(){d=false;});
  var z=document.getElementById('bczoom');if(z)z.addEventListener('input',function(){_bcZoom(this.value/100);});}
function _bcCancel(){var o=document.getElementById('bcropov');if(o)o.remove();window._bcrop=null;}
function _bcSave(){var st=window._bcrop;if(!st)return;var img=document.getElementById('bcimg');
  var sSizeX=st.Vw/st.scale,sSizeY=st.Vh/st.scale,sx=-st.offx/st.scale,sy=-st.offy/st.scale;
  sSizeX=Math.min(sSizeX,st.w0);sSizeY=Math.min(sSizeY,st.h0);
  sx=Math.max(0,Math.min(sx,st.w0-sSizeX));sy=Math.max(0,Math.min(sy,st.h0-sSizeY));
  var outW=680,outH=Math.round(outW*st.Vh/st.Vw);
  var c=document.createElement('canvas');c.width=outW;c.height=outH;var ctx=c.getContext('2d');
  try{ctx.drawImage(img,sx,sy,sSizeX,sSizeY,0,0,outW,outH);}catch(e){}
  var i=st.i;var uri=c.toDataURL('image/jpeg',0.85);_bcCancel();
  window._bnList[i].img=uri;toast('Картинка обрезана');_bnRender();}
function _bnSave(){toast('Сохраняю…');api('/api/admin/banners-save',{banners:window._bnList||[]}).then(function(d){toast(d&&d.ok?'Сохранено ✅':'Ошибка');});}

function bulkAll(){var d=window._pricesData||{services:[]};var keys=d.services.map(function(s){return s.key});var allOn=keys.length&&keys.every(function(k){return window._bulkSel[k]});window._bulkSel={};if(!allOn)keys.forEach(function(k){window._bulkSel[k]=true;});app.innerHTML=priceBulk();}
function bulkStats(){
  var d=window._pricesData||{services:[]};
  var rate=parseFloat(window._bulkRate!==undefined?window._bulkRate:d.rate)||0;
  var mk=parseFloat((''+(window._bulkMk||'')).replace(',','.'));
  var svc=0,tar=0;
  d.services.forEach(function(s){if(window._bulkSel[s.key]){svc++;s.plans.forEach(function(p){if((p.costUsd||0)>0)tar++;});}});
  return {svc:svc,tar:tar,rate:rate,mk:mk};
}
function bulkPrev(){var el=document.getElementById('bulk_prev');if(!el)return;var st=bulkStats();if(isNaN(st.mk)||!(st.rate>0)){el.innerHTML='Выбрано сервисов: '+st.svc+' · впиши курс и наценку';return;}el.innerHTML='Будет пересчитано: <b>'+st.svc+'</b> сервис(ов), <b>'+st.tar+'</b> тариф(ов) — наценка '+st.mk+'%, курс '+st.rate;}

function nicePrice(usd,rate,mk,mode){
  var rub=usd*rate*(1+mk/100);
  if((mode==='90'||mode==='99')&&rub>=90){
    var end=mode==='90'?90:99;var c=Math.floor(rub/100)*100+end;if(c<rub)c+=100;return c;
  }
  var step=rub<1000?10:(rub<5000?50:100);
  return Math.max(step,Math.ceil(rub/step)*step);
}
function roundSegInner(cur,fn){
  return [['round','Ровно'],['90','…90'],['99','…99']].map(function(x){
    return '<button class="'+(x[0]===cur?'on':'')+'" onclick="'+fn+'(\''+x[0]+'\')">'+x[1]+'</button>';
  }).join('');
}
function peRound(m){window._niceMode=m;var k=window._peKey;var el=document.getElementById('pe_round_'+k);if(el)el.innerHTML=roundSegInner(m,'peRound');mkPreview(k);}
function mkPreview(key){
  var d=window._pricesData||{services:[]};var s=d.services.filter(function(x){return x.key===key})[0];
  var el=document.getElementById('pe_prev_'+key); if(!s||!el)return;
  var rate=parseFloat((document.getElementById('pe_rate_'+key)||{}).value)||0;
  var mk=parseFloat(((document.getElementById('pe_mk_'+key)||{}).value||'').replace(',','.'));
  if(isNaN(mk)||!(rate>0)){el.innerHTML='<div class="note">Впиши курс и наценку — покажу будущие цены вживую.</div>';return;}
  var h='';
  s.plans.forEach(function(p){
    var cost=p.costUsd||0;
    if(!(cost>0)){h+='<div class="kv"><span class="k">'+p.name+'</span><span class="muted" style="font-size:11px">нет закупа $</span></div>';return;}
    var np=nicePrice(cost,rate,mk,window._niceMode||'round'),cur=p.price||0;
    var marg=np>0?Math.round((np-cost*rate)/np*100):0;
    var arrow=np>cur?'▲':(np<cur?'▼':'=');var col=np>cur?'pos':(np<cur?'neg':'muted');
    h+='<div class="kv"><span class="k">'+p.name+'</span><span>'+nf(cur)+' → <b>'+nf(np)+' ₽</b> <span class="'+col+'" style="font-size:11px">'+arrow+'</span> <span class="muted" style="font-size:11px">маржа '+marg+'%</span></span></div>';
  });
  el.innerHTML=h||'<div class="note">У тарифов не задан «Закуп $».</div>';
}
function applyMarkup(key){
  var rate=parseFloat((document.getElementById('pe_rate_'+key)||{}).value)||((window._pricesData||{}).rate||0);
  var mk=parseFloat(((document.getElementById('pe_mk_'+key)||{}).value||'').replace(',','.'));
  if(isNaN(mk)){toast('Введи наценку %');return;}
  if(!(rate>0)){toast('Введи курс');return;}
  var n=0,miss=0;
  document.querySelectorAll('#app [data-key="'+key+'"]').forEach(function(b){
    var cost=parseFloat((b.querySelector('.pe-cost').value||'').replace(',','.'))||0;
    if(cost>0){b.querySelector('.pe-price').value=nicePrice(cost,rate,mk,window._niceMode||'round');n++;}else{miss++;}
  });
  api('/api/admin/prices-save',{rate:rate,items:[]});
  toast(n?('Пересчитано: '+n+(miss?(' · без закупа: '+miss):'')+' — проверь и «Сохрани»'):'Заполни «Закуп $» у тарифов');
}

/* Пакеты кредитов — НАСТОЯЩИЕ, из bot_credit_packs.
   Раньше здесь было шесть строк, зашитых в HTML, и кнопка «Сохранить», которая
   показывала «Сохранено» и не отправляла ничего. Цены при этом давно живут в
   базе и подхватываются ботом при старте — не хватало только записи. */
function pricePacks(){setTimeout(_pkLoad,30);
  return hdr("Пакеты кредитов","то, что клиент видит в боте")
    +'<div class="wrap"><div id="pkbody"><div class="note">Загружаю…</div></div></div>';}

function _pkLoad(){
  api('/api/admin/packs',{}).then(function(d){
    var el=document.getElementById('pkbody');if(!el)return;
    if(!d||!d.ok){el.innerHTML='<div class="block"><div class="sub neg">⚠️ Не удалось загрузить пакеты.</div>'
      +'<button class="btn sec" style="margin-top:10px" onclick="_pkLoad()">🔄 Повторить</button></div>';return;}
    window._pk=d;_pkRender();
  });
}

function _pkRender(){
  var el=document.getElementById('pkbody');if(!el)return;
  var ps=(window._pk||{}).packs||[],h='';
  if(!ps.length){
    h+='<div class="note">Пакетов в базе нет. Бот запишет туда значения из кода '
      +'при следующем запуске — или добавь пакет вручную ниже.</div>';
  }
  ps.forEach(function(p,i){
    /* Цена за кредит — то, ради чего сюда и заходят: видно, какой пакет выгоднее
       клиенту, а какой нам. Считаем, а не заставляем делить в уме. */
    var per=p.credits?(p.price/p.credits):0;
    h+='<div class="block"'+(p.enabled?'':' style="opacity:.5"')+'>'
      +'<div style="font-size:13px;font-weight:700">'+esc(p.name||p.key)
      +(p.enabled?'':' <span class="neg">— скрыт</span>')+'</div>'
      +'<div class="sub" style="margin-top:2px">ключ <code>'+esc(p.key)+'</code>'
      +' · '+(per?('≈ '+per.toFixed(2)+' ₽ за кредит'):'кредитов не задано')+'</div>'
      +'<label class="fl">Название</label><input class="f" id="pk_n'+i+'" value="'+esc(p.name)+'"/>'
      +'<label class="fl">Кредитов</label><input class="f" id="pk_c'+i+'" type="number" min="1" value="'+p.credits+'"/>'
      +'<label class="fl">Цена, ₽</label><input class="f" id="pk_p'+i+'" type="number" min="1" value="'+p.price+'"/>'
      +'<label class="fl">Звёзды Telegram (0 — не продаём за звёзды)</label>'
      +'<input class="f" id="pk_s'+i+'" type="number" min="0" value="'+p.stars+'"/>'
      +'<label class="fl">Подпись (необязательно)</label><input class="f" id="pk_d'+i+'" value="'+esc(p.desc)+'"/>'
      +'<label class="fl">Бейдж (например «выгодно»)</label><input class="f" id="pk_b'+i+'" value="'+esc(p.badge)+'"/>'
      +'<div class="btns2" style="margin-top:10px">'
      +'<button class="btn row2" onclick="_pkSave('+i+')">💾 Сохранить</button>'
      +'<button class="btn row2 sec" onclick="_pkToggle(\''+esc(p.key)+'\','+(p.enabled?'false':'true')+')">'
      +(p.enabled?'Скрыть из бота':'Показать в боте')+'</button></div></div>';
  });
  h+='<div class="block"><h4>➕ Новый пакет</h4>'
    +'<div class="note">Ключ менять потом нельзя — по нему считаются прошлые заказы.</div>'
    +'<label class="fl">Ключ (латиницей, например pack_500)</label><input class="f" id="pk_nk" placeholder="pack_500"/>'
    +'<label class="fl">Название</label><input class="f" id="pk_nn" placeholder="500 кредитов"/>'
    +'<label class="fl">Кредитов</label><input class="f" id="pk_nc" type="number" min="1"/>'
    +'<label class="fl">Цена, ₽</label><input class="f" id="pk_np" type="number" min="1"/>'
    +'<button class="btn" style="margin-top:10px" onclick="_pkNew()">Добавить</button></div>'
    +'<div class="note">Удаления здесь нет намеренно: пакет, за который уже платили, '
    +'лучше скрыть — он пропадёт из бота, но останется в истории заказов.</div>';
  el.innerHTML=h;
}

function _pkSave(i){
  var p=((window._pk||{}).packs||[])[i];if(!p)return;
  var v=function(id){var e=document.getElementById(id);return e?e.value:'';};
  toast('Сохраняю…');
  api('/api/admin/packs-save',{action:'save',key:p.key,name:v('pk_n'+i),
      credits:v('pk_c'+i),price:v('pk_p'+i),stars:v('pk_s'+i),
      desc:v('pk_d'+i),badge:v('pk_b'+i),sort:p.sort})
   .then(function(d){ if(d&&d.ok){toast('Сохранено ✅');_pkLoad();}
                      else toast((d&&d.msg)||'Не сохранилось'); });
}

function _pkToggle(key,on){
  api('/api/admin/packs-save',{action:'toggle',key:key,enabled:on}).then(function(d){
    if(d&&d.ok){toast(on?'Показан в боте':'Скрыт из бота');_pkLoad();}
    else toast((d&&d.msg)||'Не вышло');});
}

function _pkNew(){
  var v=function(id){var e=document.getElementById(id);return e?e.value.trim():'';};
  if(!v('pk_nk')||!v('pk_nn')){toast('Нужны ключ и название');return;}
  api('/api/admin/packs-save',{action:'save',key:v('pk_nk'),name:v('pk_nn'),
      credits:v('pk_nc'),price:v('pk_np'),stars:0,sort:99})
   .then(function(d){ if(d&&d.ok){toast('Добавлен ✅');_pkLoad();}
                      else toast((d&&d.msg)||'Не добавился'); });
}

function _gpLoad(){
  api('/api/admin/models',{}).then(function(d){

      +'<button class="btn sec" style="margin-top:10px" onclick="_gpLoad()">🔄 Повторить</button></div>';return;}

function _gpRender(){

  secs.forEach(function(sc){
    h+='<div class="glabel" style="margin-top:14px">'+esc(sc.title)+' — '+sc.models.length+' шт</div>';
    sc.models.forEach(function(m,i){
      var id='gp_'+sc.section+'_'+i;
      h+='<div class="block"'+(m.enabled?'':' style="opacity:.5"')+'>'
        +'<div style="font-size:13px;font-weight:700">'+esc(m.name)
        +(m.enabled?'':' <span class="neg">— выключена</span>')+'</div>'
        +'<div class="sub" style="margin-top:2px">сейчас <b>'+m.credits+'</b> кр.</div>'

        +'<span class="muted">кр.</span>'
        +'<button class="btn row2" style="width:auto;margin:0;padding:6px 12px;font-size:11px" '
        +'onclick="_gpSave(\''+esc(sc.section)+'\',\''+esc(m.key)+'\',\''+id+'\')">Сохранить</button>'
        +'</div></div>';
    });
  });
  el.innerHTML=h;
}

function _gpSave(section,key,inputId){
  var e=document.getElementById(inputId);if(!e)return;
  toast('Сохраняю…');
  api('/api/admin/model-price',{section:section,key:key,credits:e.value})
   .then(function(d){ if(d&&d.ok){toast('Сохранено ✅');_gpLoad();}
                      else toast((d&&d.msg)||'Не сохранилось'); });
}

function pEditBase(id,d0,m0,promo){
  /* Наценка и скидка перемножаются — подсказываем готовые значения,
     иначе «30 минус 15» читается как +15%, а на деле +10.5%. */
  var hint='Наценка, % для его клиентов:';
  var pr=Number(promo||0);
  if(pr>0){
    var t=[]; for(var i=0;i<5;i++){ var n=10+i*5;
      t.push('+'+n+'% → '+Math.round(((1+n/100)/(1-pr/100)-1)*100)+'%'); }
    hint='Наценка, % для его клиентов.\n\nПри скидке '+pr+'% проценты перемножаются.\n'
      +'Чтобы итог к рознице был:\n'+t.join('\n');
  }
  if(pr>0) hint+='\n\nИли задай сразу нужный итог: напиши =15 — наценку подберёт бот.';
  _askForm('Общие % партнёра',hint,[{label:'Уступка, % (твоя доля ниже розницы)',value:d0,num:1},{label:'Наценка, % (или =итог)',value:m0}],'Сохранить',function(v){
  var d=v[0],m=v[1]; if(d===''||m===''){toast('Заполни оба поля — ничего не сохранено');return;}
  /* «=15» или «итог 15» — это желаемый ИТОГ, наценку считает сервер:
     формулу в JS не дублируем, иначе разойдётся с ботом. */
  var raw=String(m).trim().toLowerCase().replace(/\s+/g,'');
  var body={action:'add',uid:id,discount:d,markup:m};
  var mt=raw.match(/^(?:=|итог)\+?([0-9.,]+)$/);
  if(mt){ body={action:'add',uid:id,discount:d,markup:0,target:mt[1].replace(',','.')}; }
  api('/api/admin/partner-set',body).then(function(r){
    toast(r.ok?('Сохранено'+(mt?(' · наценка '+fpct(r.markup)+'%'):'')):(r.error||'Ошибка'));
    if(r.ok) pLoadOne(id); });
  });
}

/* Удаление партнёра — двойное подтверждение: первое с последствиями,
   второе короткое. Действие не удаляет историю, но сразу меняет цены
   у всех его клиентов, поэтому случайный тап недопустим. */
function pRemove(id,nick,clients,balance){
  var who=nick?('@'+nick):('ID '+id);
  var msg='Убрать из партнёров '+who+'?\n\n'
    +'• его '+(clients||0)+' клиент(ов) сразу перейдут на обычные цены\n'
    +'• начисления по новым заказам прекратятся\n'
    +'• история заказов и выплат сохранится\n'
    +'• привязка клиентов останется — вернёшь в партнёры, всё заработает как раньше';
  if(balance>0) msg+='\n\n⚠️ За тобой долг '+Math.round(balance)+' ₽ — сначала отметь выплату.';
  _gwConfirm2('Подтверди действие',msg+'\n\n'+'Последнее подтверждение: убрать '+who+' из партнёров?','Да, убрать',function(){
  api('/api/admin/partner-set',{action:'remove',uid:id}).then(function(r){
    toast(r.ok?'Убран':'Ошибка'); if(r.ok) back(); });
});}
/* Итог к рознице: (1+наценка)*(1-скидка)-1. Только для показа —
   цены считает сервер, здесь формулу не дублируем. */
/* Процент без лишних нулей: 35 → «35», 35.29 → «35.29». */
function fpct(v){
  var n=Math.round((Number(v)||0)*100)/100;
  return (Math.abs(n-Math.round(n))<0.005) ? String(Math.round(n))
       : String(n).replace(/0+$/,'').replace(/\.$/,'');
}
function pNetTxt(markup, promo){
  var n=((1+(markup||0)/100)*(1-(promo||0)/100)-1)*100;
  return (n>=0?'+':'')+n.toFixed(1)+'%';
}
function pPromoTxt(p){
  if(!p.promo || p.promoMode==='off') return 'выключена';
  if(p.promoMode==='first') return Math.round(p.promo)+'% на первую покупку';
  return Math.round(p.promo)+'% первые '+(p.promoDays||0)+' дн. после перехода';
}
/* После смены скидки наценка остаётся прежней — значит итог для клиента
   уехал. Ничего не меняем сами, только показываем, как вернуть. */
function pNetMoved(id,r){
  if(!r||r.netBefore==null||r.netAfter==null)return;
  var b=Number(r.netBefore), a=Number(r.netAfter);
  if(Math.abs(b-a)<0.1)return;
  var t=(Math.abs(b-Math.round(b))<0.15)?Math.round(b):Math.round(b*100)/100;
  _infoBox('Итог для клиента изменился',
    'Итог для клиента был '+(b>=0?'+':'')+b.toFixed(1)+'%, стал '+(a>=0?'+':'')+a.toFixed(1)+'%.\n'
    +'Наценку я не трогал.\n\nЧтобы вернуть прежний итог: «Изменить общие %» → '
    +'в поле «Наценка» введи =' + fpct(t));
}
function pPromoEdit(id,cur,mode,days,max){
  _askForm('Скидка для клиентов партнёра','Максимум '+max+'%. Пусто или 0 — выключить скидку.\nУсловие: число дней после перехода или слово «первая» — только на первый заказ.',
    [{label:'Скидка, %',value:cur||'',num:1},{label:'Условие: дней или «первая»',value:(mode==='first'?'первая':(days||7))}],'Сохранить',function(v){
  var t=v[0],m=v[1];
  if(t===''||Number(t)<=0){
    api('/api/admin/partner-set',{action:'promo_set',uid:id,pct:0,mode:'off'}).then(function(r){
      toast(r.ok?'Скидка убрана':'Ошибка'); if(r.ok){ pNetMoved(id,r); pLoadOne(id); } });
    return;
  }
  if(m===''){toast('Укажи условие: дней или «первая» — ничего не сохранено');return;}
  var mm=String(m).trim().toLowerCase();
  var body={action:'promo_set',uid:id,pct:t};
  if(mm.indexOf('перв')===0||mm==='first'){ body.mode='first'; }
  else { body.mode='days'; body.days=mm; }
  api('/api/admin/partner-set',body).then(function(r){
    toast(r.ok?'Сохранено ✓':(r.error||'Ошибка')); if(r.ok){ pNetMoved(id,r); pLoadOne(id); } });
  });
}

/* Переключатель НЕ перерисовывает экран: иначе набранный текст рассылки
   пропадал бы при каждом нажатии. Меняем только подсветку кнопок, а список
   партнёров рисуем в отдельный контейнер под ними. */
function bcSetAud(a,el){
  _bcAud=a;
  if(a!=='partner_clients'){_bcPid=0;_bcPtag='';}
  var p=el&&el.parentNode;
  if(p){var b=p.getElementsByTagName('button');
        for(var i=0;i<b.length;i++) b[i].className='';
        el.className='on';}
  bcRenderPicker();
}
function bcRenderPicker(){
  var box=document.getElementById('bc_pick'); if(!box) return;
  if(_bcAud!=='partner_clients'){ box.innerHTML=''; return; }
  /* Список кэшируем: без кэша каждый тап по партнёру дёргал бы сервер
     ещё раз только ради его имени. */
  if(window._bcPartners){ bcDrawPicker(box, window._bcPartners); return; }
  box.innerHTML='<div class="note">Загружаю партнёров…</div>';
  api('/api/admin/partners',{}).then(function(d){
    if(!d||!d.ok){box.innerHTML='<div class="pm-err">Не удалось загрузить партнёров.</div>';return;}
    window._bcPartners=d.partners||[];
    bcDrawPicker(box, window._bcPartners);
  });
}
function bcDrawPicker(box, partners){
    /* Партнёров без клиентов не показываем: выбрать такого — значит
       запустить рассылку в пустоту, сервер её всё равно отклонит. */
    var ps=(partners||[]).filter(function(x){return (x.clients||0)>0;});
    if(!ps.length){box.innerHTML='<div class="pm-err">Нет партнёров с клиентами.</div>';return;}
    box.innerHTML='<label class="fl">Чьим клиентам</label>'+ps.map(function(x){
      var nm=x.username?('@'+x.username):(x.name||('ID '+x.id));
      var on=(x.id===_bcPid);
      return '<div class="plan-buy" style="margin:6px 0;text-align:left;'
        +(on?'border:1px solid var(--accent);color:var(--accent)':'')+'" '
        +'onclick="bcPickPartner('+x.id+')">'+(on?'✅ ':'')+esc(nm)+' · '+(x.clients||0)+' клиентов</div>';
    }).join('');
}
function bcPickPartner(id){
  _bcPid=id; _bcPtag='ID '+id;
  (window._bcPartners||[]).forEach(function(x){
    if(x.id===id) _bcPtag=x.username?('@'+x.username):(x.name||('ID '+x.id));
  });
  bcRenderPicker();
  toast('Выбран '+_bcPtag);
}

function loadMiniApp(svc){
  api('/api/admin/settings',{}).then(function(d){
    var el=document.getElementById('ma_'+svc); if(!el)return;
    if(!d.ok){el.innerHTML='<div class="note">Нет доступа или ошибка.</div>';return;}
    /* Если сервиса нет в ответе — это НЕ «ноль кодов», это отсутствие данных.
       Подставлять codes:0 значило показывать пустой пул там, где его просто
       не спросили. */
    var _mFound=(d.miniapps||[]).filter(function(x){return x.key===svc})[0];
    var m=_mFound||{enabled:false,codes:null,missing:true};
    var em={chatgpt:'✨',claude:'⚡',perplexity:'🔍'}[svc]||'📱';
    var h='<div class="row" style="cursor:default"><span class="ic">'+em+'</span><div><div class="lbl2">Приложение '+(m.enabled?'включено':'выключено')+'</div><div class="sub">активация у клиентов</div></div><span class="sw'+(m.enabled?' on':'')+'" onclick="toggleMiniApp(this,\''+svc+'\')"><b></b></span></div>';
    /* m.codes === null означает «сервис не пришёл в ответе», а не «кодов ноль».
       Показывать в этом случае «0 шт» и красную полосу — врать про пустой пул. */
    var _cn=(m.codes==null)?null:m.codes;
    h+='<div class="block"><h4>🔑 Запас кодов</h4><div id="codesbk_'+svc+'">'
      +(_cn==null
        ? '<div class="note neg">⚠️ Данные по пулу не пришли — это сбой загрузки, а не пустой пул.</div>'
        : '<div class="kv" style="border:0;padding-bottom:6px"><span class="k">В пуле</span><span>'+_cn+' шт</span></div>'
          +prog(Math.min(100,_cn*2),_cn<10?C.red:C.green))
      +'</div></div>';
    h+='<div class="btns2"><button class="btn row2 sec" onclick="leaf(function(){return addCodes(\''+svc+'\')})">➕ Коды</button><button class="btn row2 sec" onclick="leaf(function(){return codesPool(\''+svc+'\')})">🗂 Пул</button></div>';
    /* «Ждущие коды» — у всех трёх сервисов. У Perplexity раздела не было
       вовсе. Счётчик дописывается, когда придут детали. 06.10.2026 */
    h+='<button class="btn sec" style="margin-top:10px" id="pendbtn_'+svc+'" onclick="leaf(function(){return pendingScreen(\''+svc+'\')})">⏳ Ждущие коды</button>';
    if(svc==='claude'||svc==='chatgpt'){h+='<div id="clprov_'+svc+'" style="margin-top:14px"></div>';}
    h+='<div id="madet_'+svc+'"><div class="note">Загружаю активации…</div></div>';
    el.innerHTML=h;
    api('/api/admin/miniapp-detail',{service:svc,days:(window._miDays&&window._miDays[svc])||0}).then(function(dd){
      var de=document.getElementById('madet_'+svc); if(!de)return;
      /* Раньше при сбое блок просто затирался, и «не загрузилось» было не
         отличить от «активаций нет». Теперь сбой виден как сбой. */
      if(!dd.ok){de.innerHTML='<div class="note neg">⚠️ Не удалось загрузить активации — '
        +'это сбой загрузки, а не пустой список.</div>';return;}
      var byp={};(dd.free||[]).forEach(function(c){byp[c.plan]=(byp[c.plan]||0)+1});
      /* Счётчик на кнопке «Ждущие коды»: сколько всего и сколько требуют внимания. */
      var _pb=document.getElementById('pendbtn_'+svc);
      if(_pb&&dd.pending){var _pw=0;dd.pending.forEach(function(x){if(x.warn)_pw++;});
        _pb.innerHTML='⏳ Ждущие коды · '+dd.pending.length+(_pw?(' · <span class="neg">⚠️ '+_pw+'</span>'):'');}
      var cb=document.getElementById('codesbk_'+svc);
      if(cb){var tot=(typeof dd.freeCount==='number'?dd.freeCount:(dd.free?dd.free.length:0));
        var bh='<div class="kv" style="border:0;padding-bottom:6px"><span class="k">Всего в пуле</span><span>'+tot+' шт</span></div>'+prog(Math.min(100,tot*2),tot<10?C.red:C.green);
        if(dd.providers){
          dd.providers.forEach(function(p){bh+='<div class="kv"><span class="k">'+p.name+(p.key===dd.activeProvider?' ⬅️':'')+'</span><span>'+p.free+' шт</span></div>'});
        } else {
          Object.keys(byp).sort().forEach(function(pl){bh+='<div class="kv"><span class="k">'+planLabel(svc,pl)+'</span><span>'+byp[pl]+' шт</span></div>'});
        }
        /* Сколько кодов на какой тип активации: iOS кладётся на любой аккаунт,
           Филиппины — только на free plan. Считает сервер запросом, а не по
           списку free: тот обрезан лимитом и цифры разошлись бы. */
        if(dd.routes&&dd.routes.length){
          bh+='<div class="glabel" style="margin-top:12px">🧭 По типу активации</div>';
          dd.routes.forEach(function(r){
            var low=(r.free===0);
            bh+='<div class="kv"><span class="k">'+esc(r.label)+' · '+planLabel(svc,r.plan)+'</span>'
              +'<span'+(low?' class="neg"':(r.route?'':' class="neg"'))+'>'+r.free+' шт'
              +(r.waiting?(' · '+r.waiting+' ждут'):'')+'</span></div>';
          });
          bh+='<div class="sub" style="margin-top:6px">iOS — на любой аккаунт (и поверх подписки). '
            +'Филиппины — только на free plan.</div>';
        }
        cb.innerHTML=bh;}
      var _dsel=(window._miDays&&window._miDays[svc])||0;
      var hh='<div class="glabel" style="margin-top:16px">🧾 Активации</div>';
      hh+='<div class="seg" style="margin-bottom:8px">'+[[0,'Последние 15'],[7,'7 дней'],[30,'30 дней']].map(function(x){
        return '<button class="'+(_dsel===x[0]?'on':'')+'" onclick="miDays(\''+svc+'\','+x[0]+')">'+x[1]+'</button>';}).join('')+'</div>';
      if(!dd.recent.length){hh+='<div class="note">За этот период активаций нет.</div>';}
      else{hh+='<div class="sub" style="margin-bottom:6px">Показано: '+dd.recent.length
        +(dd.burned?(' · из них сожжено перебором: <b>'+dd.burned+'</b>'):'')+'</div>';}
      dd.recent.forEach(function(r){
        var _burn=(r.kind==='burn');
        /* У ChatGPT в этом поле почта, у Claude — Organization ID, у
           Perplexity — ID аккаунта Perplexity. Раньше всё подписывалось 📧,
           и UUID выглядел как почта. 06.10.2026 */
        var _accL={chatgpt:'📧 Email: ',claude:'🏢 Organization: ',perplexity:'🆔 Аккаунт Perplexity: '}[svc]||'👤 Аккаунт: ';
        hh+='<div class="block" style="cursor:pointer'+(_burn?';border-left:3px solid '+C.red:'')+'" onclick="copyText(\''+esc(r.code)+'\')"><div style="font-size:12.5px;font-weight:600">'+esc(r.user)+' · '+esc(r.date)+(_burn?' · <span class="neg">сожжён перебором</span>':'')+'</div><div class="sub" style="margin-top:4px">🔑 '+esc(r.code)+' 📋'+(r.acc?'<br>'+_accL+esc(r.acc):'')+(r.order?'<br>🧾 Order: '+esc(r.order):'')+'</div></div>';
      });
      if(dd.burned)hh+='<div class="note" style="margin-top:8px">Красным — коды, помеченные использованными при переборе, без реальной активации. Проверить и вернуть целые: команда <code>/gpt_codes_recover</code> в боте.</div>';
      de.innerHTML=hh;
      if(dd.providers){window._provList[svc]=dd.providers;window._provActive[svc]=dd.activeProvider;renderClProv(dd,svc);}
    });
  });
}
