# Сценарии по ситуации клиента (владелец 17–19.11.2026).
# Модель сначала определяет ситуацию, потом пишет ответ. Если её ответ не содержит
# обязательного (need), помощник дополняет его текстом сценария (add).
# Файл можно править без программиста: меняйте тексты в add, слова в need.
situations:
  buy:
    title: "Хочет купить или оформить подписку, перейти с бесплатной версии на платную"
    rule: "Сразу предложи тарифы сервиса по возрастанию цены с ценами из каталога и как купить. Консультируй, если будут вопросы. Данные для активации (почта и пароль, sessionKey, токен, резервные коды) до оплаты не проси — только скажи, что после оплаты подскажешь следующий шаг. Короткое «гпт над», «нужен клод», «хочу мидж» — это buy."
    need: ['₽|тариф']
    tariffs: true
    add_buy_steps: true
  price:
    title: "Спрашивает цену"
    rule: "Назови цену из каталога. Шаги покупки — только если спросил, как оплатить."
    need: ['₽']
    tariffs: true
  compare_choose:
    title: "Выбирает или сравнивает тарифы и сервисы"
    rule: "Сравни коротко по делу, цены из каталога, по возрастанию. Если клиент спрашивает, какую нейросеть взять для задачи (видео, музыка, код, тексты, презентации), сразу порекомендуй 2–3 сервиса из каталога под эту задачу по service_guide, с ценами; не переспрашивай. Если клиент хочет несколько сервисов сразу — назови цены каждого."
  paid_not_working:
    title: "Оплатил, но подписка не активировалась или не работает, «что с моей оплатой»"
    rule: "Попроси номер заказа и чек из банка, если номера нет. Для ChatGPT скажи, что выдадим повторную активацию."
    need: ['номер заказа|заказ #|заказ №']
    add: 'Подскажите, пожалуйста, номер заказа и пришлите чек об оплате из банка. По ним Александр проверит оплату и, если активация не прошла, выдаст повторную активацию.'
    skip_if_order_known: true
  has_sub_not_showing:
    title: "Подписка оплачена или активирована, но в аккаунте не отображается"
    rule: "Попроси перезайти в аккаунт через 10–15 минут, VPN одной страны; если не помогло — номер заказа и скриншот."
    need: ['перезайд|10–15|10-15']
    add: 'Попробуйте, пожалуйста, выйти из аккаунта и зайти снова через 10–15 минут, с VPN одной и той же страны. Если подписка так и не появится, пришлите номер заказа и скриншот экрана, Александр проверит.'
  activation_step:
    title: "Вопрос по шагам активации (токен, кнопка «Активировать», ссылка)"
    rule: "Дай шаги по правилам владельца для этого сервиса."
  account_login:
    title: "Вход в аккаунт, почта, пароль, новый аккаунт"
    rule: "Уточни, куда именно входит клиент, и попроси скриншот ошибки."
  blocked:
    title: "Аккаунт заблокирован, апелляция отклонена"
    rule: "Честно: восстановить нельзя. Предложи новый аккаунт и аналоги на выбор, предложи сравнить."
  off_catalog_or_app:
    title: "Сервиса или приложения нет в каталоге"
    rule: "Для мобильного приложения — пополнение App Store / iCloud, регион Apple ID и цена в приложении. Для сервиса — тема off_catalog."
  vpn_access:
    title: "VPN — нужен ли, какой посоветовать"
    rule: "Ответ владельца про VPN."
  howto_usage:
    title: "Как пользоваться, установить, настроить сервис"
    rule: "Короткая инструкция по делу."
  thanks_only:
    title: "Только благодарность или приветствие, без вопроса"
    rule: "Коротко поблагодари. Если в сообщении есть вопрос — это НЕ thanks_only."
  refund_complaint:
    title: "Требует возврат или жалуется на списание"
    rule: "Передай Александру."
  owner_step:
    title: "Продолжает шаг, который начал Александр или помощник (почта, ID, «готово», «да»)"
    rule: "Продолжи именно этот шаг."
  other:
    title: "Другое"
    rule: "Ответь по сути."
