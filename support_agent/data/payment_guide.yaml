# Как клиент платит в магазине и что нужно уже после оплаты.
# Кнопки оплаты сняты с кода бота. Способ оформления после оплаты — из ответов владельца.
# Кнопку «Я оплатил - написать Александру» клиенту не называть.

entry:
  webapp:
    menu_button: "Каталог"
    pay_buttons: ["СБП", "Картой"]
    go_button: "Перейти к оплате"
    check_button: "Проверить оплату"
  chat:
    menu_button: "Магазин"
    confirm_button: "Оплатить"
    pay_buttons: ["Оплатить через СБП", "Оплатить картой"]
    promo_button: "Применить промокод"
    coins_buttons: ["Оплатить монетками", "Применить монетками + СБП", "Оплатить СБП без монеток"]

timing:
  shop: "Активация занимает 5-30 минут."
  auto: "Автоактивация занимает 2-5 минут."

modes:
  link_pay:
    # Эти сервисы не просят почту и пароль. Z.ai сюда не входит: у него два способа.
    services: [genspark, elevenlabs, heygen, higgsfield, kimi, kling, lovable, make, manus, runway]
    timing: shop
    after: "После оплаты в магазине зайдите в свой аккаунт, выберите тариф и откройте страницу оплаты сервиса. Сами там не платите. Скопируйте ссылку и пришлите её сюда. Почта и пароль для этого не нужны."
  zai:
    services: [zai]
    timing: shop
    choose: "Для Z.ai можно прислать почту и пароль от аккаунта или ссылку на оплату. Напишите, какой способ удобнее. Оба сразу не нужны."
    link_after: "После оплаты зайдите в свой аккаунт Z.ai, выберите тариф и откройте страницу оплаты. Сами там не платите. Скопируйте ссылку и пришлите её сюда."
    email_after: "После оплаты пришлите сюда почту и пароль от аккаунта Z.ai. Ссылку отдельно присылать не нужно."
  suno:
    services: [suno]
    timing: shop
    after: "После оплаты пришлите сюда почту и пароль от аккаунта Suno. Если входите в Suno через Google, нужен пароль от этой почты Google. Ссылку на оплату для Suno не присылайте."
  telegram_premium:
    services: [telegram_premium]
    timing: shop
    names: [telegram]
    # Владелец 12.11.2026: нужен username, помощник подсказывает, где его взять.
    after: "После оплаты пришлите сюда username аккаунта, которому оформить Telegram Premium (вида @name). Где его взять: Telegram → «Настройки» → строка «Имя пользователя». Если имени пользователя нет, задайте его там же. Пароль и коды Telegram не нужны."
  capcut:
    services: [capcut]
    timing: shop
    names: [capcut, кап кат, капкат]
    after: "После оплаты Александр выдаст новый готовый аккаунт CapCut с подпиской Pro на месяц и пришлёт его почту и пароль. Данные вашего текущего аккаунта не нужны. Продлить на своём или том же аккаунте нельзя: каждый месяц выдаётся новый аккаунт. В Pro входит: 1 200 ИИ-кредитов в месяц, ИИ-функции, все премиум-шаблоны и функции Pro, 1 ТБ облака."
  credentials:
    # Владелец 29.10 и 04.11.2026: оформление по почте и паролю аккаунта клиента.
    services: [zoom, spotify, youtube, gemini, grok, supergrok, midjourney, github, krea, gamma, freepik, notion, motion]
    names: [zoom, spotify, youtube, gemini, grok, midjourney, github, krea, gamma, freepik, notion, motion]
    timing: shop
    # Владелец 12.11.2026: вход через Google — нужен пароль от этой почты Google.
    after: "После оплаты пришлите сюда почту и пароль от аккаунта {name}. Если входите в {name} через Google, нужен пароль от этой почты Google."
  credentials_email_code:
    # OpenRouter: можно войти просто по коду с почты (владелец 12.11.2026).
    services: [openrouter]
    names: [openrouter]
    timing: shop
    after: "После оплаты пришлите сюда почту и пароль от аккаунта {name}. Если входите только по коду с почты, достаточно почты."
  email_only:
    services: [canva, cursor]
    names: [canva, cursor]
    timing: shop
    after: "После оплаты пришлите сюда почту от аккаунта {name}. Пароль не нужен."
  chatgpt_credits:
    # Товар «Пополнение кредитов ChatGPT»: вход в аккаунт клиента.
    timing: shop
    after: "После оплаты пришлите сюда почту и пароль от аккаунта ChatGPT. Если входите только по коду с почты, достаточно почты."
  chatgpt_auto:
    services: [chatgpt]
    plans: [plus, go]
    timing: auto
    button: "Активировать подписку"
    page: "chatgpt.com/api/auth/session"
    where: "В окно активации в боте, по кнопке. В эту переписку токен не вставляется."
  chatgpt_new_account:
    services: [chatgpt]
    timing: shop
    after: "Кнопки «Активировать» у этого тарифа нет. Она есть только у Go и Plus."
    collect:
      - id: setup_email
        ask: "почту, которую поставить на новый ящик"
      - id: setup_password
        ask: "пароль для этого ящика"
      - id: setup_recovery
        ask: "вашу настоящую почту для восстановления"
  chatgpt_manual:
    services: [chatgpt]
    timing: shop
    after: "Тарифы ChatGPT от Pro 5× и выше активирует Александр. Кнопки самостоятельной активации нет. Пришлите сюда токен аккаунта со страницы chatgpt.com/api/auth/session. Пароль аккаунта для этого тарифа не нужен."
  claude_auto:
    services: [claude]
    timing: auto
    button: "Активировать Claude"
    page: "claude.ai/settings/account"
    client_provides: "Organization ID"
    where: "В мини-приложение по кнопке, не в эту переписку."
  claude_manual:
    services: [claude]
    timing: shop
    after: "Максимальный тариф Claude активирует Александр. Пришлите сюда почту и пароль от аккаунта Claude."
  perplexity:
    services: [perplexity]
    timing: auto
    button: "Активировать Perplexity"
    page: "perplexity.ai/api/auth/session"
    client_provides: "Perplexity User ID, поле id со страницы сессии"
    where: "В мини-приложение по кнопке, не в эту переписку."
  appstore:
    services: [appstore]
    names: [app store, appstore, icloud, apple]
    timing: ""
  shop:
    timing: shop
    after: "Дальше активация идёт в боте магазина."

appstore:
  menu_name: "App Store / iCloud"
  pay_button: "Оплатить"
  check_button: "Проверить оплату"
  after: "Код приходит в чат бота автоматически. Отдельно для активации ничего присылать не нужно.\n\nКак активировать код на iPhone:\n1. Откройте App Store и нажмите на свой аватар вверху.\n2. «Погасить подарочную карту или код».\n3. «Ввести код вручную», вставьте код и подтвердите.\nКод работает только для Apple ID того региона, для которого куплен."
