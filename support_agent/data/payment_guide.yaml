# Как клиент платит в магазине и что нужно уже после оплаты.
# Тексты кнопок и порядок сняты с кода бота. Пустой шаг и пункт todo клиенту не говорить.
# Срок оформления подписки берётся из faq.yaml (delivery_time), не из этой карточки.

entry:
  webapp:
    # keyboards.py: нижняя кнопка «Каталог», если задан WEBAPP_BASE_URL.
    # shop_webapp.html: способы на карточке и экран после создания ссылки.
    menu_button: "Каталог"
    pay_buttons: ["СБП", "Картой"]
    coins_note: "Если на балансе есть монетки, на карточке есть оплата монетками или часть монетками и остаток по СБП."
    go_button: "Перейти к оплате"
    check_button: "Проверить оплату"
  chat:
    # handlers_shop.py: меню «Магазин», экран «Подтверждение заказа», экран «Оплата».
    menu_button: "Магазин"
    confirm_button: "Оплатить"
    pay_buttons: ["Оплатить через СБП", "Оплатить картой"]
    promo_button: "Применить промокод"
    coins_buttons: ["Оплатить монетками", "Применить монетками + СБП", "Оплатить СБП без монеток"]
    paid_button: "Я оплатил - написать Александру"

appstore:
  # handlers_nsgifts.py nsg_start / nsg_cat / nsg_svc и shop_webapp.html openAppstore.
  menu_name: "App Store / iCloud"
  region_prompt: "Выбери регион пополнения"
  webapp_buy: "Оформить за"
  pay_button: "Оплатить"
  check_button: "Проверить оплату"
  after: "Код приходит в чат бота автоматически. Отдельно для активации ничего присылать не нужно."
  # handlers_nsgifts.py: «Код придёт автоматически сразу после оплаты», «Получаем код — займёт пару секунд».

after:
  chatgpt_auto:
    # config.py GPT_AUTO_PLANS = plus, go. common.py и shop_webapp.html.
    plans: ["plus", "go"]
    button: "Активировать подписку"
    button_alt: "Активировать ChatGPT"
    page: "chatgpt.com/api/auth/session"
    client_provides: "весь текст со страницы сессии"
    where: "в окно активации в боте, по кнопке. В эту переписку токен не вставляется."
  chatgpt_new_account:
    # SERVICE_RULES.md и activation_guidance.py. Отдельный товар, не обычный Plus.
    button: ""
    client_provides: "токен сессии нового аккаунта присылается сюда, в эту переписку. Кнопки самостоятельной активации нет. Почту согласуем до оплаты."
  chatgpt_manual:
    # common.py _is_manual_plan: тариф ChatGPT вне GPT_AUTO_PLANS. _send_manual_order.
    button: "Написать Александру"
    client_provides: "номер заказа и чек об оплате"
  claude:
    # common.py _send_claude_webapp_to_user и shop_webapp.html.
    button: "Активировать Claude"
    page: "claude.ai/settings/account"
    client_provides: "Organization ID"
    where: "в мини-приложение по кнопке, не в эту переписку."
  perplexity:
    # common.py _send_perplexity_webapp_to_user.
    button: "Активировать Perplexity"
    page: "perplexity.ai/api/auth/session"
    client_provides: "Perplexity User ID, поле id со страницы сессии"
    where: "в мини-приложение по кнопке, не в эту переписку."
  appstore:
    client_provides: ""
  other:
    # common.py: если нет отдельной автоактивации, бот пишет, что Александр выполнит заказ.
    # Номер заказа показывается на экране оплаты.
    client_provides: "номер заказа будет в сообщении бота. Если бот попросит чек, его присылают сюда."

# Эти пункты помощник не произносит, пока владелец их не заполнит.
todos:
  - "Срок в поддержке берётся из faq: 30–60 минут. В коде другие формулировки: меню магазина «Активация в течение 5-30 минут», обычная выдача «в течение часа», автоактивация ChatGPT и Perplexity «1–2 минуты», Claude «1–5 минут». Подтвердите, что клиенту в переписке оставляем 30–60."
  - "App Store: бот обещает код «сразу» и «пару секунд». В ответ поддержки для пополнения Apple 30–60 минут не подставляются. Подтвердите эту формулировку."
  - "Какие сервисы сейчас включены как link-pay (кнопка «Отправить ссылку на оплату», настройка linkpay:enabled). Списка в коде нет, клиенту этот шаг не говорим."
  - "Какие сервисы сейчас просят email и пароль (кнопка «Отправить данные аккаунта», настройка creds:enabled). Списка в коде нет, клиенту этот шаг не говорим."
  - "Какие тарифы стоят на ручной выдаче тумблером manual:{сервис}:{номер} в админке. Из кода видно только правило ChatGPT: сами активируются Plus и Go, остальные тарифы ChatGPT уходят Александру."
  - "«Новый аккаунт с подпиской Plus» описан в правилах и catalog_descriptions, в SHOP_CATALOG config.py его нет. Цена в живом каталоге в код не зашита. Подтвердите, что после оплаты токен идёт в эту переписку, а не в кнопку «Активировать»."
  - "Кнопка «Я оплатил - написать Александру» есть на экране оплаты в чате. В короткую инструкцию каталога она не входит. Напишите, если её нужно называть."
  - "Если автодоставка Apple не запустилась, бот пишет @neirosetkaalex и «в течение 15 минут». Это аварийный текст, в обычный ответ он не входит. Подтвердите, что так и оставляем."
  - "Новые оплаты звёздами отключены: кнопка shop_pay_stars отвечает «Оплата звёздами отключена». В инструкцию Stars не входят."
