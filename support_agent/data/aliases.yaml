# Разговорные названия для модели.
# Это словарь, а не маршрутизатор: код не выбирает сервис по совпадению слова.
# Как править: у нужного сервиса допишите строку в aliases. id должен совпадать
# с ключом товара в каталоге магазина. После правки нужен новый выкат помощника.
# Одинаковое слово нельзя вешать на два сервиса.

