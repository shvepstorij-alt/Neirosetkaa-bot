phrases:
  - phrase: чат гпт плюс
    service: chatgpt
    tariff: Plus

tariff_words:
  - words: [годовая, годовой, годовое, на год]
    meaning: годовой тариф, если у сервиса есть и месяц, и год
  - words: [месячная, месячный, месячное, на месяц]
    meaning: месячный тариф; тариф «на год» по этим словам не выбирать
  - words: [про, pro]
    meaning: тариф Pro; без слова про год это месяц, если есть и месяц, и год
  - words: [плюс, plus]
    meaning: тариф Plus, если он есть у этого сервиса
  - words: [бизнес, business]
    meaning: тариф Business
  - words: [прем, премиум, premium]
    meaning: тариф Premium
