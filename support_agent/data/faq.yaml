    answer: "В каталоге бота @neirosetkaa_bot есть два варианта Claude Pro:\n• Claude Pro — подписку активирует Александр, а верификацию личности вы проходите сами. Для неё лучше подходят иностранные документы, из российских — только загранпаспорт РФ; проходит примерно в половине случаев, гарантий нет.\n• Claude Pro + прохождение верификации личности — 6990 ₽: верификацию проходим мы за вас, не по российским документам.\n\nВерификацию нужно проходить при каждом продлении. Гарантии на Claude нет: Claude может заблокировать аккаунт, при блокировке деньги не возвращаются."
  - id: midjourney_how
    title: Как оформить Midjourney — что нужно от клиента после оплаты
    verbatim: true
    answer: "Midjourney оформляется в нашем боте @neirosetkaa_bot: «Каталог» → Midjourney → тариф. После оплаты понадобится ссылка на оплату тарифа:\n1. Включите VPN, откройте сайт Midjourney и войдите в свой аккаунт.\n2. Выберите нужный тариф и нажмите кнопку оплаты.\n3. На странице оплаты ничего не вводите и не оплачивайте, только скопируйте ссылку из адресной строки целиком и пришлите сюда. Цена на странице должна быть в долларах.\n\nЕсли получить ссылку не получается, после оплаты можно прислать почту и пароль от аккаунта Midjourney."
