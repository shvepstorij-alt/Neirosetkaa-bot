    verbatim: true
    answer: "К сожалению, многие сервисы не принимают российские почты. Зарегистрируйтесь, пожалуйста, на почту gmail.com. Если такой нет, мы поможем создать новую почту outlook.com. Тогда напишите:\n1. Какой адрес дать новой почте.\n2. Какой пароль поставить на неё.\n3. Какую вашу почту привязать как резервную."
  - id: what_next
    title: Клиент только что оплатил заказ в боте и спрашивает, что делать дальше, а в переписке нет других шагов (Александр ещё не ведёт оформление, не просил код, данные, номер или настройку)
    verbatim: true
    answer: "Если вы уже оплатили, откройте бота @neirosetkaa_bot: после оплаты туда приходит сообщение с инструкцией и кнопкой «Активировать подписку». Пришла ли инструкция? Если нет или что-то не получается, напишите, какой сервис оформляете, и пришлите номер заказа — подскажу следующий шаг."
  # Проверка на настоящих диалогах 16.11.2026.
  - id: thanks
    title: Клиент благодарит, прощается или пишет, что всё получилось, без нового вопроса
    verbatim: true
    answer: "Рад помочь, обращайтесь!"
  - id: claude_activation
    title: Как оформить или активировать Claude Pro — что нужно от клиента, кнопка «Активировать Claude» не работает
    verbatim: true
    answer: "Подписку Claude сейчас активирует Александр вручную. Для этого нужны две вещи:\n\n1. Ваше согласие с рисками: гарантии на Claude нет, Claude может заблокировать аккаунт, при блокировке деньги не возвращаются. Напишите, пожалуйста, что согласны.\n\n2. sessionKey вашего аккаунта Claude:\n1️⃣ Установите расширение Cookie-Editor (https://chromewebstore.google.com/detail/cookie-editor/hlkenndednhfkekhgcdicdfddnkalmdm) в браузер (Chrome / Edge / Firefox).\n2️⃣ Откройте claude.ai и войдите в свой аккаунт.\n3️⃣ Нажмите на иконку Cookie-Editor в правом верхнем углу → найдите cookie с именем sessionKey.\n4️⃣ Скопируйте его значение (Value, начинается на sk-ant-sid02-...) и отправьте сюда.\n\nПосле этого Александр активирует подписку и пришлёт ссылку на прохождение верификации."
  - id: claude_max_login
    title: Как оформить Claude Max или Ultra — что нужно от клиента
    verbatim: true
    answer: "Тарифы Claude Max и Ultra оплачиваем с нашей иностранной карты. После оплаты в боте пришлите, пожалуйста, сюда почту от аккаунта Claude — пароль не нужен. Александр запросит код для входа, он придёт вам на эту почту — пришлите его сюда. Затем нужно пройти верификацию личности: лучше подходят иностранные документы, из российских — только загранпаспорт РФ; проходит примерно в половине случаев, гарантировать успех не можем.\n\nИ напишите, пожалуйста, что согласны с рисками: гарантии на Claude нет, Claude может заблокировать аккаунт, при блокировке деньги не возвращаются."
  - id: org_id_sent_here
    title: Клиент прислал сюда Organization ID Claude
    verbatim: true
    answer: "Спасибо! Сейчас вместо Organization ID нужно другое. Подписку Claude сейчас активирует Александр вручную. Для этого нужны две вещи:\n\n1. Ваше согласие с рисками: гарантии на Claude нет, Claude может заблокировать аккаунт, при блокировке деньги не возвращаются. Напишите, пожалуйста, что согласны.\n\n2. sessionKey вашего аккаунта Claude:\n1️⃣ Установите расширение Cookie-Editor (https://chromewebstore.google.com/detail/cookie-editor/hlkenndednhfkekhgcdicdfddnkalmdm) в браузер (Chrome / Edge / Firefox).\n2️⃣ Откройте claude.ai и войдите в свой аккаунт.\n3️⃣ Нажмите на иконку Cookie-Editor в правом верхнем углу → найдите cookie с именем sessionKey.\n4️⃣ Скопируйте его значение (Value, начинается на sk-ant-sid02-...) и отправьте сюда.\n\nПосле этого Александр активирует подписку и пришлёт ссылку на прохождение верификации."
  - id: renewal_token
    title: Нужно ли заново присылать токен при продлении или повторной оплате ChatGPT
    verbatim: true
    answer: "Да, для продления нужен новый токен. Полностью выйдите из аккаунта ChatGPT и войдите заново, затем в адресной строке того же браузера введите chatgpt.com/api/auth/session, нажмите Enter и скопируйте весь текст страницы — это и есть новый токен. После оплаты вставьте его в окно активации в боте по кнопке «Активировать подписку». Если не вышло, пришлите токен сюда одним текстовым файлом — Александр активирует сам; если и так не пройдёт, можно прислать вместо него почту и пароль от аккаунта."
  - id: gmail_confirmed
    title: Клиент подтвердил, что у него есть почта gmail.com, или прислал адрес gmail для регистрации
    verbatim: true
    answer: "Отлично! Зарегистрируйтесь на эту почту на сайте сервиса (для ChatGPT — chatgpt.com), и дальше оформим подписку."
  - id: chatgpt_token_after_register
    title: Клиент зарегистрировался на ChatGPT по нашей просьбе и спрашивает, что дальше, а подписку ещё не активировали
    verbatim: true
    answer: "Отлично! Теперь нужен токен аккаунта:\n1. Откройте chatgpt.com в браузере и войдите в аккаунт.\n2. В адресной строке того же браузера введите chatgpt.com/api/auth/session и нажмите Enter.\n3. Выделите весь текст (Ctrl+A) и скопируйте (Ctrl+C).\n4. Пришлите этот текст сюда одним текстовым файлом — Александр активирует подписку."

