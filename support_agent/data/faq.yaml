  - id: activation_button_fails
    title: Мини-приложение или окно не открывается по кнопке «Активировать подписку»
    verbatim: true
    answer: "Поставьте другой регион в VPN и ещё раз откройте активацию по кнопке «Активировать подписку». Если не получится, пришлите токен сюда: весь текст одним текстовым файлом, а не несколькими сообщениями. Александр активирует сам."
  - id: activate_for_me
    title: Клиент просит активировать подписку за него или не справляется с активацией сам
    verbatim: true
    answer: "Да, поможем. Если не получается активировать самостоятельно, пришлите почту и пароль от аккаунта или токен для активации: весь текст одним текстовым файлом. Александр активирует сам. Если нужна инструкция, как получить токен, напишите — подскажу."
  - id: course_subscriptions
    title: Какие подписки нужны для обучения на курсе
    verbatim: true
    answer: "Точного набора нет: на курсе бонусом оформляют один из двух сервисов — ChatGPT или Claude. Какой именно, подскажут на курсе."
