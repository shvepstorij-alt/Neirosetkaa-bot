# Ответы владельца. Пустой answer и без collect: бот не выдумывает и зовёт Александра.
# Не добавляйте сроки и условия, которых здесь нет.

topics:
  - id: guarantee
    title: Гарантия
    answer: "Гарантия есть на все сервисы, кроме Claude."
  - id: account_ban
    title: Блокировка аккаунта
    answer: "Claude может заблокировать аккаунт, гарантии на Claude нет, при блокировке деньги не возвращаются. На остальные сервисы блокировка входит в гарантию."
  - id: delivery_time
    title: Срок оформления подписки
    answer: "Активация занимает 5–30 минут. У сервисов с автоактивацией — 2–5 минут."
  - id: refund_terms
    title: Возврат
    answer: ""
    collect: [order_number, service, reason]
  - id: off_catalog
    title: Сервис, которого нет в текущем каталоге
    answer: "Можно оформить и сервис, которого нет в каталоге. Пришлите название или ссылку на сайт сервиса и нужный тариф с его ценой на сайте."
  - id: region_policy
    title: Официальная доступность сервиса в стране, кроме уже записанных правил
    answer: ""
  # Ниже — правила, утверждённые владельцем 11.11.2026 по разбору переписок за 28.07–28.10.2026.
  - id: card_payment
    title: Оплата картой не проходит или клиент спрашивает про карту
    answer: "По карте оплата часто не проходит, но попробовать можно. Если не прошла, пропишите в боте /start и начните новый заказ, лучше по СБП."
  - id: bot_stuck
    title: Бот магазина завис, не грузится или не даёт оплатить
    answer: "Пропишите в боте /start и выберите нужный раздел в главном меню."
  - id: renewal
    title: Продление подписки, автосписания, когда продлевать
    answer: "Продление оформляется как новая покупка в боте. Подписка всегда на месяц, автосписаний нет. Продлевать лучше, когда подписка закончилась и аккаунт перешёл на бесплатный тариф."
  - id: cancel_notice
    title: Письмо или надпись об отмене подписки после активации, как проверить подписку
    answer: "Подписка активна, отключено только автопродление. Проверить можно так: перезайдите в аккаунт и откройте настройки, раздел оплаты."
  - id: transfer
    title: Перенос подписки или оплаты на другой аккаунт
    answer: "После активации подписку нельзя перенести на другой аккаунт, возврат за активированную подписку не оформляется."
  - id: foreign_payment
    title: Оплата через PayPal или иностранной картой
    answer: "Оплаты через PayPal и иностранными картами нет."
  - id: for_other_person
    title: Покупка подписки для другого человека
    answer: "Подписку можно оформить для другого человека самостоятельно через бота. После активации перенести её на другой аккаунт нельзя."
  - id: receipt
    title: Нужно ли отправлять чек после оплаты
    answer: "Чек не обязателен. Если по заказу возникнут вопросы, понадобятся чек из банка и номер заказа FreeKassa."
  # Активация и типовые ошибки. Утверждено владельцем 11.11.2026.
  - id: activation_where
    title: Клиент УЖЕ оплатил ChatGPT, Claude или Perplexity и спрашивает, где кнопка активации (не для вопросов «как купить» и «как оформить»)
    answer: "Кнопка «Активировать подписку» находится в боте, в сообщении после оплаты. Нажмите её, инструкция откроется там. Кнопка действует 2 часа."
  - id: activation_expired
    title: Время активации истекло, нужна повторная активация
    answer: "Повторную активацию выдаёт Александр. Пришлите номер заказа из бота."
    collect: [order_number]
  - id: activation_failed
    title: Ошибка при активации или активация не завершилась
    answer: "Пришлите скрин ошибки и номер заказа из бота."
    collect: [order_number]
  - id: subscription_ended_early
    title: Подписка слетела раньше срока или аккаунт снова на бесплатном тарифе
    answer: "Пришлите скрин раздела оплаты из настроек аккаунта и номер заказа из бота. Причину проверит Александр."
    collect: [order_number]
  - id: token_copy
    title: Что именно копировать со страницы с токеном
    answer: "Скопируйте весь текст страницы целиком, с начала и до конца, со всеми скобками."
  - id: token_expired
    title: Токен недействителен или истёк
    answer: "Закрыть и открыть сайт недостаточно. Выйдите из аккаунта через настройки и войдите заново, затем откройте страницу с токеном и активируйте с новым токеном через бота."
  - id: must_be_free
    title: Бот пишет, что аккаунт должен быть на бесплатном тарифе, или подписка ещё активна
    answer: "Активировать можно, когда текущая подписка закончится и аккаунт перейдёт на бесплатный тариф. Оплата сохраняется, активируйте позже через бота."
  - id: still_free_after_activation
    title: После активации тариф не обновился или показывает Free
    answer: "Выйдите из аккаунта через настройки и войдите заново через 10–15 минут. Подписка видна в настройках, раздел оплаты. Если тариф не обновился, пришлите номер заказа и скрин настроек."
  - id: page_not_opening
    title: Сайт или страница с токеном не открывается
    answer: "Откройте сайт в другом браузере: Google, Chrome, Safari, Opera или Яндекс, лучше всего Google. Если не помогло, выключите и включите VPN."
  - id: wrong_account
    title: Подписка активирована не на тот аккаунт
    answer: "Активация проходит на тот аккаунт, чей токен или ID был введён. После активации подписку нельзя перенести, возврат не оформляется."
  - id: claude_org_id
    title: В Claude не видно Organization ID
    answer: "Organization ID появляется после завершения регистрации: выберите бесплатный план и закончите регистрацию. Искать его нужно на сайте claude.ai, в настройках аккаунта."
  - id: plan_upgrade
    title: Повышение тарифа, пока подписка активна
    answer: "ChatGPT: тариф можно повысить, даже если сейчас активен Plus. Claude: повысить тариф на том же аккаунте нельзя, только оформить на другой аккаунт."
  - id: limits_exhausted
    title: Закончились лимиты, где их посмотреть
    answer: "Лимиты ChatGPT можно пополнить через нас: товар «Пополнение кредитов ChatGPT» в каталоге бота. Для остальных сервисов можно дождаться сброса или оформить тариф выше. Расход лимитов виден в настройках, раздел Usage."
  - id: google_login_notice
    title: Клиент даёт данные для входа через Google (ручное оформление)
    answer: "На телефон придёт уведомление о входе в почту. Нужно подтвердить вход и выбрать число, какое именно — напишет Александр. На iPhone уведомление может прийти в Gmail или YouTube."
  - id: token_as_file
    title: Как прислать токен для тарифа, который активирует Александр
    answer: "Для тарифов, которые активирует Александр, пришлите весь текст токена одним текстовым файлом."
  - id: vpn_help
    title: Клиент просит помочь с VPN, настроить его или посоветовать конкретный VPN
    answer: "С VPN, к сожалению, помочь не можем и конкретный сервис не советуем."
