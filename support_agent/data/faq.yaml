topics:
  - id: guarantee
    title: Гарантия
    answer: "Гарантия есть на все сервисы, кроме Claude."
  - id: account_ban
    title: Блокировка аккаунта
    answer: "Claude может заблокировать аккаунт, гарантии на Claude нет, при блокировке деньги не возвращаются. На остальные сервисы блокировка входит в гарантию."
  - id: delivery_time
    title: Срок оформления подписки
    answer: "Активация занимает 5–30 минут. У сервисов с автоактивацией — 2–5 минут."
  - id: refund_terms
    title: Возврат
    answer: ""
    collect: [order_number, service, reason]
  - id: off_catalog
    title: Сервис, которого нет в текущем каталоге
    answer: "Можно оформить и сервис, которого нет в каталоге. Пришлите название или ссылку на сайт сервиса и нужный тариф с его ценой на сайте."
  - id: region_policy
    title: Официальная доступность сервиса в стране, кроме уже записанных правил
    answer: ""
  # Ниже — правила, утверждённые владельцем 11.11.2026 по разбору переписок за 28.07–28.10.2026.
  - id: card_payment
    title: Оплата картой не проходит или клиент спрашивает про карту
    answer: "По карте оплата часто не проходит, но попробовать можно. Если не прошла, пропишите в боте /start и начните новый заказ, лучше по СБП."
  - id: bot_stuck
    title: Бот магазина завис, не грузится или не даёт оплатить
    answer: "Пропишите в боте /start и выберите нужный раздел в главном меню."
  - id: renewal
    title: Продление подписки, автосписания, когда продлевать
    answer: "Продление оформляется как новая покупка в боте. Подписка всегда на месяц, автосписаний нет. Продлевать лучше, когда подписка закончилась и аккаунт перешёл на бесплатный тариф."
  - id: cancel_notice
    title: Письмо или надпись об отмене подписки после активации, как проверить подписку
    answer: "Подписка активна, отключено только автопродление. Проверить можно так: перезайдите в аккаунт и откройте настройки, раздел оплаты."
  - id: transfer
    title: Перенос подписки или оплаты на другой аккаунт
    answer: "После активации подписку нельзя перенести на другой аккаунт."
  - id: foreign_payment
    title: Оплата через PayPal или иностранной картой
    answer: "Оплаты через PayPal и иностранными картами нет."
  - id: for_other_person
    title: Покупка подписки для другого человека
    answer: "Подписку можно оформить для другого человека самостоятельно через бота. После активации перенести её на другой аккаунт нельзя."
  - id: receipt
    title: Нужно ли отправлять чек после оплаты
    answer: "Чек не обязателен. Если по заказу возникнут вопросы, понадобятся чек из банка и номер заказа FreeKassa."
