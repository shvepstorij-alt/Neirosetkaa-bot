# Ответы владельца. Пустой answer и без collect: бот не выдумывает и зовёт Александра.
# Не добавляйте сроки и условия, которых здесь нет.

topics:
  - id: guarantee
    title: Гарантия
    answer: "Гарантия действует на весь срок подписки на все сервисы, кроме Claude: если подписка слетит, восстановим. На Claude гарантии нет — Claude может заблокировать аккаунт, и при блокировке деньги не возвращаются."
  - id: account_ban
    title: Блокировка аккаунта
    answer: "Claude может заблокировать аккаунт, гарантии на Claude нет, при блокировке деньги не возвращаются. На остальные сервисы блокировка входит в гарантию."
  - id: delivery_time
    title: Сколько обычно занимает оформление подписки — общий вопрос до покупки или сразу после оплаты (не вопрос о статусе заказа, который уже оформляет Александр)
    answer: "Активация занимает 5–30 минут. У сервисов с автоактивацией — 2–5 минут."
  - id: refund_terms
    title: Возврат
    answer: ""
    collect: [order_number, service, reason]
  - id: off_catalog
    title: Сервис, которого нет в текущем каталоге, или оплата зарубежного курса или сервиса по ссылке (не игры и не приложения)
    answer: "Да, можем помочь с оплатой. Пришлите, пожалуйста, ссылку на оплату или напишите, какой сервис, какой тариф нужен и какой регион у вашего аккаунта — Александр посчитает стоимость и подскажет, как оплатить."
    collect: [service, reason]
  - id: games_consoles
    title: Подписки и баланс PlayStation, Xbox, Nintendo, Steam — PS Plus, Game Pass, пополнение, гифт-карты, Roblox
    answer: "Это есть в нашем боте @neirosetkaa_bot: Магазин → «🎁 Гифт-карты и игры» → бренд → регион вашего аккаунта → номинал, код придёт в чат сразу после оплаты. Регион карты должен совпадать с регионом аккаунта."
  - id: course_bonus_start
    title: Клиента направили сюда за бонусной подпиской с курса («подписка на нейросеть вам доступна, напишите Александру»)
    verbatim: true
    answer: "Здравствуйте! Да, всё верно, вы пишете Александру 🙂 По бонусной подписке с курса оформим ChatGPT на 1 месяц. Для этого пришлите, пожалуйста:\n1. Почту, с которой вы зарегистрированы на курсе.\n2. Токен вашего аккаунта ChatGPT:\n• откройте chatgpt.com в браузере и войдите в аккаунт;\n• в адресной строке того же браузера введите chatgpt.com/api/auth/session и нажмите Enter;\n• выделите весь текст (Ctrl+A), скопируйте (Ctrl+C), сохраните в текстовый файл и пришлите сюда одним файлом.\n\nЕсли на аккаунте ещё активна подписка, нужно дождаться её окончания, чтобы аккаунт перешёл на бесплатный тариф."
  - id: course_bonus_claude
    title: Бонусная подписка с курса — клиент сам попросил Claude вместо ChatGPT
    verbatim: true
    answer: "Хорошо, оформим Claude. Сначала важно: гарантии на Claude нет — Claude может заблокировать аккаунт, и в случае неудачи бонус с курса сгорит. Напишите, пожалуйста, что согласны.\n\nДальше понадобится sessionKey вашего аккаунта Claude:\n1️⃣ Установите расширение Cookie-Editor (https://chromewebstore.google.com/detail/cookie-editor/hlkenndednhfkekhgcdicdfddnkalmdm) в браузер (Chrome / Edge / Firefox).\n2️⃣ Откройте claude.ai и войдите в свой аккаунт.\n3️⃣ Нажмите на иконку Cookie-Editor в правом верхнем углу → найдите cookie с именем sessionKey.\n4️⃣ Скопируйте его значение (Value, начинается на sk-ant-sid02-...) и отправьте сюда.\n\nПосле этого Александр активирует подписку и пришлёт ссылку на прохождение верификации личности."
  - id: games_buy
    title: Покупка конкретной игры для PlayStation или Xbox (GTA, EA FC и др.)
    answer: "Игры покупаем со входом в ваш аккаунт. Напишите, какая игра, какое издание и для какой консоли, — Александр посчитает стоимость в $. Оплатить её можно в нашем боте @neirosetkaa_bot: «Каталог» → «Другой сервис» → тариф на эту сумму в $.\n\nПосле оплаты понадобятся почта, пароль и резервные коды от аккаунта:\n• PlayStation: на сайте Sony (вход в аккаунт) → «Безопасность» → «Двухэтапная аутентификация» → «Резервные коды». Если на аккаунте включён ключ доступа (passkey), его нужно отключить, включить вход по паролю и двухэтапную аутентификацию, а затем прислать актуальные данные.\n• Xbox: account.microsoft.com → «Безопасность» → «Дополнительные параметры безопасности» → «Код восстановления»."
  - id: chatgpt_credits
    title: Пополнение кредитов ChatGPT (для Codex и других функций сверх лимита)
    answer: "Кредиты ChatGPT можно пополнить в нашем боте @neirosetkaa_bot: «Каталог» → «пополнение кредитов ChatGPT» → нужный пакет. Пакеты и цены — там же."
  - id: appstore_region
    title: Как сменить регион (страну) Apple ID
    answer: "В нашем боте @neirosetkaa_bot есть подробная инструкция: «Каталог» → «App Store / iCloud» → «🌍 Как сменить регион Apple ID». Коротко: Настройки → ваше имя → «Медиаматериалы и покупки» → «Просмотреть» → «Страна или регион». Перед сменой нужно потратить остаток баланса и отменить активные подписки."
  - id: forgot_password
    title: Клиент забыл пароль от аккаунта (ChatGPT, Claude и др.)
    answer: "На странице входа нажмите «Забыли пароль?» (Forgot password), введите почту аккаунта и откройте письмо для сброса — проверьте и папку «Спам». Если вход через Google, пароль не нужен: нажмите «Продолжить с Google». Если не получается — пришлите скриншот, подскажу."
  - id: off_catalog_app
    title: Оплата мобильного приложения, которого нет в каталоге — через пополнение App Store / iCloud
    verbatim: true
    answer: "Да, можно оплатить через пополнение баланса App Store / iCloud: вы пополняете баланс Apple ID в нашем боте, а затем оплачиваете подписку в приложении с этого баланса.\n\nПодскажите, пожалуйста:\n1. Какой регион у вашего Apple ID (страна аккаунта).\n2. Сколько стоит нужная подписка в приложении.\n\nКак узнать цену: откройте приложение и зайдите в раздел подписки (Premium, Pro) — там указана цена. Ещё её видно в App Store на странице приложения, в блоке «Встроенные покупки».\n\nПополнить баланс можно в боте @neirosetkaa_bot: «Каталог» → «App Store / iCloud» → регион → номинал."
  - id: region_policy
    title: Официальная доступность сервиса в стране, кроме уже записанных правил
    answer: ""
  # Ниже — правила, утверждённые владельцем 11.11.2026 по разбору переписок за 28.07–28.10.2026.
  - id: card_payment
    title: Оплата российской картой не проходит или клиент спрашивает про российскую карту
    answer: "Оплатить можно по СБП или картой «Мир» (другие карты, в том числе белорусские, не проходят). По СБП оплата без комиссии, а при оплате картой «Мир» есть комиссия платёжной системы, поэтому по СБП выгоднее. Если оплата картой не прошла, пропишите в боте /start и начните новый заказ — лучше по СБП."
  - id: bot_stuck
    title: Бот магазина завис, не грузится или не даёт оплатить
    answer: "Пропишите в боте /start и выберите нужный раздел в главном меню."
  - id: renewal
    title: Общий вопрос, как и когда продлевать подписку, есть ли автосписания (не жалоба, что продление не прошло или не активировалось, и не продолжение оформления у Александра)
    answer: "Да, продление оформляется так же, как новая покупка, в боте @neirosetkaa_bot. Подписка на месяц, автосписаний нет. Продлевать лучше, когда подписка закончилась и аккаунт перешёл на бесплатный тариф. Claude продлить можно только после окончания текущей подписки, и верификацию личности при каждом продлении нужно проходить заново."
  - id: cancel_notice
    title: Пришло письмо или надпись об отмене подписки сразу после активации
    verbatim: true
    answer: "Если пришло письмо об отмене после активации, подписка активна, отключено только автопродление. Проверить можно в настройках аккаунта, в разделе оплаты."
  - id: transfer
    title: Перенос подписки или оплаты на другой аккаунт
    answer: "После активации подписку нельзя перенести на другой аккаунт, возврат за активированную подписку не оформляется."
  - id: foreign_payment
    title: Клиент хочет оплатить заказ в нашем боте из-за границы или не российской картой — PayPal, иностранная карта, Kaspi, белорусская карта (не просьба оплатить за него зарубежный сервис или курс)
    answer: "К сожалению, можем принять оплату только по СБП или картой «Мир». Иностранные и белорусские карты, PayPal не проходят. Если есть возможность, попросите кого-то из России оплатить через нашего бота: заказ оформляется так же."
    verbatim: true
  - id: for_other_person
    title: Покупка подписки для другого человека
    answer: "Подписку можно оформить для другого человека самостоятельно через бота. После активации перенести её на другой аккаунт нельзя."
  - id: receipt
    title: Нужно ли отправлять чек после оплаты
    answer: "Чек не обязателен, присылать его не нужно. Он понадобится, только если возникнет проблема: оплата не прошла, нет номера заказа или подписка не активировалась — тогда пришлите чек из банка и номер заказа FreeKassa, если он есть. Сами мы, к сожалению, не выдаём чек об оплате."
  # Активация и типовые ошибки. Утверждено владельцем 11.11.2026.
  - id: activation_where
    title: Клиент УЖЕ оплатил ChatGPT Go или Plus и спрашивает, где кнопка активации (не для вопросов «как купить» и «как оформить»)
    answer: "Кнопка «Активировать подписку» находится в боте, в сообщении после оплаты. Нажмите её, инструкция откроется там. Кнопка действует 2 часа."
  - id: activation_expired
    title: Время активации истекло, нужна повторная активация
    answer: "Повторную активацию выдаёт Александр. Пришлите номер заказа из бота."
    collect: [order_number]
  - id: activation_failed
    title: Клиент оплатил в боте, но не получается активировать подписку или активация выдаёт ошибку — первое обращение, Александр ещё не ведёт активацию
    verbatim: true
    answer: "Подскажите, пожалуйста, номер заказа из бота и пришлите скриншот того этапа, на котором не получается, или текста ошибки. Если номера заказа нет, пришлите чек об оплате из банка.\n\nЕсли это ChatGPT: найдите в боте сообщение, которое пришло после оплаты, — в нём есть кнопка «Активировать подписку». Если не видите его, пролистайте чат с ботом чуть выше или ниже. Кнопка действует 2 часа; если время вышло, Александр выдаст повторную активацию.\n\nЕсли бот пишет, что токен не тот или недействителен, выйдите из аккаунта ChatGPT, войдите заново, скопируйте новый токен и активируйте ещё раз через бота."
    collect: [order_number]
  - id: subscription_ended_early
    title: Подписка слетела раньше срока или аккаунт снова на бесплатном тарифе
    answer: "Пришлите скрин раздела оплаты из настроек аккаунта и номер заказа из бота. Причину проверит Александр. За неудобство можете использовать промокод на следующую оплату: NAVSEX или CHATIK10."
    verbatim: true
    collect: [order_number]
  - id: token_copy
    title: Что именно копировать со страницы с токеном
    answer: "Скопируйте весь текст страницы целиком, с начала и до конца, со всеми скобками."
  - id: token_expired
    title: Токен недействителен или истёк
    answer: "Закрыть и открыть сайт недостаточно. Выйдите из аккаунта через настройки и войдите заново, затем откройте страницу с токеном и активируйте с новым токеном через бота."
  - id: must_be_free
    title: Бот пишет, что аккаунт должен быть на бесплатном тарифе, или подписка ещё активна
    answer: "Активировать можно, когда текущая подписка закончится и аккаунт перейдёт на бесплатный тариф. Оплата сохраняется, активируйте позже через бота."
  - id: still_free_after_activation
    title: После активации тариф не обновился или показывает Free
    answer: "Выйдите из аккаунта через настройки и войдите заново через 10–15 минут, с VPN одной и той же страны. Подписка видна в настройках, раздел оплаты. Если тариф не обновился, пришлите номер заказа и скрин настроек."
  - id: page_not_opening
    title: Сайт или страница с токеном не открывается
    answer: "Откройте сайт в другом браузере: Google, Chrome, Safari, Opera или Яндекс, лучше всего Google. Если не помогло, выключите и включите VPN."
  - id: wrong_account
    title: Клиент спрашивает или жалуется, что подписка активирована не на тот аккаунт
    answer: "Активация проходит на тот аккаунт, чей токен или ID был введён. После активации подписку нельзя перенести, возврат не оформляется."
  - id: claude_org_id
    title: В Claude не видно Organization ID
    answer: "Organization ID появляется после завершения регистрации: выберите бесплатный план и закончите регистрацию. Искать его нужно на сайте claude.ai, в настройках аккаунта."
  - id: plan_upgrade
    title: Повышение тарифа ChatGPT (например, Plus → Pro), пока подписка активна
    answer: "Да, перейти с Plus на Pro можно сразу: оплатите Pro в боте @neirosetkaa_bot. Остаток Plus при этом сгорит, а новый месяц начнётся с даты активации Pro."
  - id: claude_plan_change
    title: Продление или повышение тарифа Claude (Pro → Max и др.), пока подписка ещё активна
    verbatim: true
    answer: "Продлить или повысить тариф Claude можно только после окончания текущей подписки: нужно дождаться, когда аккаунт перейдёт на бесплатный план. Перейти с Pro на Max можно на том же аккаунте, тоже после окончания текущей подписки. Верификацию личности нужно проходить при каждом продлении."
  - id: limits_exhausted
    title: Закончились лимиты, где их посмотреть
    answer: "Расход лимитов виден в настройках, раздел Usage. Можно дождаться сброса лимитов или оформить тариф выше. Для ChatGPT есть ещё вариант: товар «Пополнение кредитов ChatGPT» в каталоге бота. В Claude пополнить кредиты через нас, к сожалению, нельзя: карты на пополнение там отклоняются."
  - id: google_login_notice
    title: Клиент даёт данные для входа через Google (ручное оформление)
    answer: "На телефон придёт уведомление о входе в почту. Нужно подтвердить вход и выбрать число, какое именно — напишет Александр. На iPhone уведомление может прийти в Gmail или YouTube."
  - id: token_as_file
    title: Клиент спрашивает, как прислать токен ChatGPT (файлом или сообщениями) и ещё не присылал его
    verbatim: true
    answer: "Для ChatGPT Go и Plus сначала вставьте токен сами в окно активации в боте (кнопка «Активировать подписку» в сообщении после оплаты). Если не вышло, а также для тарифов, которые активирует Александр, пришлите весь текст токена сюда одним текстовым файлом, не несколькими сообщениями."
  - id: vpn_help
    title: Клиент просит помочь с VPN, настроить его или посоветовать конкретный VPN
    answer: "Можем порекомендовать такие VPN:\n• @DureVpnBot — https://telegram.me/DureVpnBot?start=YYFpHPog9\n• @v2raytnn_bot — https://t.me/v2raytnn_bot?start=facdaf71-69b8-4155-a3f7-bc245a6135fe\n\nПо настройке и функциям VPN, к сожалению, подсказать не можем. С этим лучше обратиться в поддержку самого VPN."
  - id: new_account_email
    title: Нужен новый аккаунт в сервисе, клиент спрашивает, на какую почту регистрироваться, или у него нет подходящей почты
    answer: "Для регистрации нужна почта gmail.com, на которой раньше не было аккаунта в этом сервисе. Если такая есть, зарегистрируйтесь на неё, и дальше оформим подписку.\n\nЕсли такой почты нет, можем создать для вас новую почту outlook.com и зарегистрировать на неё аккаунт. Тогда напишите:\n1. Какой адрес дать новой почте outlook.com.\n2. Какой пароль поставить на неё.\n3. Какую вашу почту привязать как резервную."
    collect: [setup_email, setup_password, setup_recovery]
  - id: app_download
    title: Как скачать или обновить приложение ChatGPT, Claude или другого сервиса на телефоне, его нет в App Store или Google Play
    answer: "iPhone: подскажите, пожалуйста, есть ли у вас сейчас активные подписки в App Store? Проверить можно в «Настройках» → ваше имя → «Подписки».\n\nЕсли активных подписок нет, можно сменить регион Apple ID на США и установить приложение (так же, если приложение скачано через чужой Apple ID и теперь просит обновиться):\n1. Откройте «Настройки» и нажмите на своё имя.\n2. «Медиаматериалы и покупки», при необходимости «Просмотреть учётную запись».\n3. «Страна или регион» → «Изменить страну или регион».\n4. Выберите США, примите условия и заполните способ оплаты и адрес.\n\nВажно перед сменой:\n• потратьте остаток на балансе Apple ID, с ним регион не сменить;\n• отмените подписки через Apple и дождитесь конца их срока;\n• в «Семейном доступе» сменить регион может не получиться;\n• часть приложений и покупок из старого региона может стать недоступна.\n\nAndroid:\n• ChatGPT: https://chatgpt.ru.uptodown.com/android\n• Claude: https://claude.ru.uptodown.com/android"
  - id: claude_account_blocked
    title: Аккаунт Claude заблокировали
    answer: "К сожалению, восстановить заблокированный аккаунт Claude не получится. Можем оформить подписку на новый аккаунт: для него нужна почта gmail.com, на которой раньше не было Claude. Гарантировать, что блокировки не будет, не можем. Чтобы снизить риск, не меняйте страну VPN во время работы с Claude. Как вариант, можно перейти на другую нейросеть, там блокировок заметно меньше. Аналоги Claude Code на выбор: Codex (входит в подписку ChatGPT), Cursor (в нём доступен и Grok) или Kimi. Подскажите, для каких задач он нужен, и я сравню варианты и помогу выбрать."
  - id: course_bonus
    title: Студент курса спрашивает про бонусную или подарочную подписку от обучения
    answer: "Бонусом с курса оформляем подписку ChatGPT на 1 месяц. Пришлите, пожалуйста, вашу почту, с которой вы зарегистрированы на курсе, и токен аккаунта ChatGPT (как его скопировать, подскажу). Если на аккаунте ещё активна подписка, нужно дождаться её окончания, чтобы аккаунт перешёл на бесплатный тариф."
    collect: [course_email]
  # Пакет «Продажи». Утверждено владельцем 11.11.2026.
  - id: codex
    title: Codex — где взять, сколько стоит, отдельная подписка
    verbatim: true
    answer: "Codex входит в подписку ChatGPT, отдельно его оформлять не нужно. Codex доступен начиная с тарифа Plus; для большого объёма кода лучше Pro."
  - id: claude_ready_account
    title: Клиент просит готовый аккаунт Claude
    answer: "Готовые аккаунты Claude не выдаём, оформляем подписку на ваш аккаунт. Если подходящей почты нет, можем создать для вас новую почту outlook.com, и вы сами зарегистрируете на неё аккаунт Claude. Номер для подтверждения можно купить в нашем боте @neirosetkaa_bot: «Каталог» → «Виртуальные номера». Работайте с Claude через один VPN и одну локацию."
  - id: appstore_redeem
    title: Как активировать код App Store / iCloud, который выдал бот
    answer: "Как активировать код на iPhone:\n1. Откройте App Store и нажмите на свой аватар вверху.\n2. «Погасить подарочную карту или код».\n3. «Ввести код вручную», вставьте код и подтвердите.\n\nКод работает только для Apple ID того региона, для которого куплен."
  - id: subscription_term
    title: Клиент спрашивает, на какой срок оформляется подписка или можно ли оформить на год
    verbatim: true
    answer: "Подписка оформляется на месяц, автопродления нет. ChatGPT можно оформить только на 1 месяц. По другим сервисам на год оформляем, если вы сами хотите оплатить сразу год: напишите, какой сервис нужен."
  - id: claude_block_risk
    title: Как не получить блокировку в Claude, заблокируют ли
    answer: "Чтобы снизить риск блокировки Claude: работайте через один VPN и одну страну в нём, не входите в один аккаунт с разных устройств. Это снижает риск, но гарантировать, что блокировки не будет, не можем."
  - id: claude_verification
    title: Общий вопрос, какие документы подходят для верификации личности в Claude и пройдёт ли она (не когда Александр уже ведёт верификацию или прислал ссылку на неё)
    answer: "Для верификации личности в Claude лучше подходят иностранные документы. Если их нет, из российских подходит только загранпаспорт РФ. Проходит примерно в половине случаев (50/50), гарантировать успех не можем; если верификацию пройти не удастся, деньги не возвращаются. Верификацию нужно проходить при каждом продлении.\n\nЕсли не хотите проходить верификацию сами, в каталоге бота есть тариф «Claude Pro + прохождение верификации личности» — 6990 ₽: верификацию проходим мы за вас, не по российским документам.\n\nРоссийские номера телефона для подтверждения не проходят. Виртуальный номер для подтверждения можно купить в нашем боте @neirosetkaa_bot: «Каталог» → «Виртуальные номера» → сервис (ChatGPT, Claude, Telegram и другие, есть «Любой другой») → страна → оплата по СБП, картой «Мир» или монетками. Номер придёт в чат бота: введите его в сервисе и запросите код, SMS придёт туда же автоматически (кнопка «🔄 Проверить SMS»). Лучше включить VPN той же страны, что и номер. Если номер уже занят или код не пришёл, нажмите в боте «🚫 Номер уже занят» или «⏹ Код не пришёл»: бот бесплатно выдаст новый номер или вернёт деньги монетками."
