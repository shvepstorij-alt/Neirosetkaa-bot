    answer: "Как активировать код на iPhone:\n1. Откройте App Store и нажмите на свой аватар вверху.\n2. «Погасить подарочную карту или код».\n3. «Ввести код вручную», вставьте код и подтвердите.\n\nКод работает только для Apple ID того региона, для которого куплен."
  - id: subscription_term
    title: На какой срок оформляется подписка, можно ли на год
    answer: "Срок зависит от сервиса: смотрите тарифы в каталоге бота. Например, Spotify оформляется только на месяц. Если в каталоге есть тариф на год, его можно оформить."
  - id: claude_block_risk
    title: Как не получить блокировку в Claude, заблокируют ли
