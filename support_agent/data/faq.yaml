  # Владелец 13.11.2026: пошаговые инструкции.
  - id: linkpay_how
    title: Как получить или где взять ссылку на оплату тарифа, что такое ссылка на оплату
    verbatim: true
    answer: "Как получить ссылку на оплату:\n1. Включите VPN, откройте сайт сервиса в браузере и войдите в свой аккаунт.\n2. Откройте раздел с тарифами: обычно это кнопка Upgrade, Pricing или Subscription.\n3. Выберите нужный тариф и нажмите кнопку оплаты.\n4. Откроется страница оплаты с полем для карты. Ничего не вводите и не оплачивайте.\n5. Скопируйте ссылку из адресной строки браузера целиком и пришлите её сюда.\nЦена на странице оплаты должна быть в долларах. Если там другая валюта, поставьте в VPN другую страну и откройте страницу заново."
  - id: chatgpt_token_how
    title: Как скопировать токен ChatGPT для активации, где взять токен или текст сессии
    verbatim: true
    answer: "Как скопировать токен ChatGPT:\n1. Откройте chatgpt.com в браузере и войдите в аккаунт, на который нужна подписка.\n2. В том же браузере откройте новую вкладку с адресом chatgpt.com/api/auth/session\n3. Появится страница с текстом в фигурных скобках. Выделите весь текст: на компьютере Ctrl+A, на телефоне долгое нажатие и «Выбрать всё».\n4. Скопируйте его: на компьютере Ctrl+C, на телефоне «Копировать».\n5. В боте нажмите «Активировать подписку» (кнопка в сообщении после оплаты) и вставьте текст целиком в окно активации.\n6. Если через бота не получилось, сохраните текст в текстовый файл и пришлите сюда одним файлом — Александр активирует сам.\nЕсли на странице пустые скобки {}, вы не вошли в аккаунт в этом браузере: вернитесь к шагу 1."
  # Ответы владельца 13.11.2026 по прогону настоящих вопросов.
  - id: subscription_status
