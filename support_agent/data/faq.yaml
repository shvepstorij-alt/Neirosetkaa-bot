  - id: subscription_ended_early
    title: Подписка слетела раньше срока или аккаунт снова на бесплатном тарифе
    answer: "Пришлите скрин раздела оплаты из настроек аккаунта и номер заказа из бота. Причину проверит Александр. За неудобство можете использовать промокод на следующую оплату: NAVSEX или CHATIK10."
    verbatim: true
    collect: [order_number]
  - id: token_copy
    title: Что именно копировать со страницы с токеном
    answer: "Скопируйте весь текст страницы целиком, с начала и до конца, со всеми скобками."
  - id: token_expired
    title: Токен недействителен или истёк
    answer: "Закрыть и открыть сайт недостаточно. Выйдите из аккаунта через настройки и войдите заново, затем откройте страницу с токеном и активируйте с новым токеном через бота."
  - id: must_be_free
    title: Бот пишет, что аккаунт должен быть на бесплатном тарифе, или подписка ещё активна
    answer: "Активировать можно, когда текущая подписка закончится и аккаунт перейдёт на бесплатный тариф. Оплата сохраняется, активируйте позже через бота."
  - id: still_free_after_activation
    title: После активации тариф не обновился или показывает Free
    answer: "Выйдите из аккаунта через настройки и войдите заново через 10–15 минут. Подписка видна в настройках, раздел оплаты. Если тариф не обновился, пришлите номер заказа и скрин настроек."
  - id: page_not_opening
    title: Сайт или страница с токеном не открывается
    answer: "Откройте сайт в другом браузере: Google, Chrome, Safari, Opera или Яндекс, лучше всего Google. Если не помогло, выключите и включите VPN."
  - id: wrong_account
    title: Подписка активирована не на тот аккаунт
    answer: "Активация проходит на тот аккаунт, чей токен или ID был введён. После активации подписку нельзя перенести, возврат не оформляется."
  - id: claude_org_id
    title: В Claude не видно Organization ID
    answer: "Organization ID появляется после завершения регистрации: выберите бесплатный план и закончите регистрацию. Искать его нужно на сайте claude.ai, в настройках аккаунта."
  - id: plan_upgrade
    title: Повышение тарифа, пока подписка активна
    answer: "ChatGPT: тариф можно повысить, даже если сейчас активен Plus. Claude: повысить тариф на том же аккаунте нельзя, только оформить на другой аккаунт."
  - id: limits_exhausted
    title: Закончились лимиты, где их посмотреть
    answer: "Расход лимитов виден в настройках, раздел Usage. Можно дождаться сброса лимитов или оформить тариф выше. Для ChatGPT есть ещё вариант: товар «Пополнение кредитов ChatGPT» в каталоге бота. В Claude пополнить кредиты через нас, к сожалению, нельзя: карты на пополнение там отклоняются."
  - id: google_login_notice
    title: Клиент даёт данные для входа через Google (ручное оформление)
    answer: "На телефон придёт уведомление о входе в почту. Нужно подтвердить вход и выбрать число, какое именно — напишет Александр. На iPhone уведомление может прийти в Gmail или YouTube."
  - id: token_as_file
    title: Как прислать токен для тарифа, который активирует Александр
    answer: "Для тарифов, которые активирует Александр, пришлите весь текст токена одним текстовым файлом."
  - id: vpn_help
    title: Клиент просит помочь с VPN, настроить его или посоветовать конкретный VPN
    answer: "Можем порекомендовать такие VPN:\n• @DureVpnBot — https://telegram.me/DureVpnBot?start=YYFpHPog9\n• @v2raytnn_bot — https://t.me/v2raytnn_bot?start=facdaf71-69b8-4155-a3f7-bc245a6135fe\n\nПо настройке и функциям VPN, к сожалению, подсказать не можем. С этим лучше обратиться в поддержку самого VPN."
  - id: new_account_email
    title: Нужен новый аккаунт в сервисе, клиент спрашивает, на какую почту регистрироваться, или у него нет подходящей почты
    answer: "Для регистрации нужна почта gmail.com, на которой раньше не было аккаунта в этом сервисе. Если такая есть, зарегистрируйтесь на неё, и дальше оформим подписку.\n\nЕсли такой почты нет, можем создать для вас новую почту outlook.com и зарегистрировать на неё аккаунт. Тогда напишите:\n1. Какой адрес дать новой почте outlook.com.\n2. Какой пароль поставить на неё.\n3. Какую вашу почту привязать как резервную."
    collect: [setup_email, setup_password, setup_recovery]
  - id: app_download
    title: Как скачать или обновить приложение ChatGPT, Claude или другого сервиса на телефоне, его нет в App Store или Google Play
    answer: "iPhone: в российском App Store этих приложений нет. Если приложение скачано через чужой Apple ID и теперь просит обновиться, решение то же. Нужно сменить регион вашего Apple ID:\n1. Откройте «Настройки» и нажмите на своё имя.\n2. «Медиаматериалы и покупки», при необходимости «Просмотреть учётную запись».\n3. «Страна или регион» → «Изменить страну или регион».\n4. Выберите новую страну, например США, примите условия и заполните способ оплаты и адрес.\n\nВажно перед сменой:\n• потратьте остаток на балансе Apple ID, с ним регион не сменить;\n• отмените подписки через Apple и дождитесь конца их срока;\n• в «Семейном доступе» сменить регион может не получиться;\n• часть приложений и покупок из старого региона может стать недоступна.\n\nAndroid:\n• ChatGPT: https://chatgpt.ru.uptodown.com/android\n• Claude: https://claude.ru.uptodown.com/android"
  - id: claude_account_blocked
    title: Аккаунт Claude заблокировали
    answer: "К сожалению, восстановить заблокированный аккаунт Claude не получится. Можем оформить подписку на новый аккаунт: для него нужна почта gmail.com, на которой раньше не было Claude. Гарантировать, что блокировки не будет, не можем. Чтобы снизить риск, не меняйте страну VPN во время работы с Claude. Как вариант, можно перейти на ChatGPT или Codex, там блокировок заметно меньше."
  - id: course_bonus
    title: Студент курса спрашивает про бонусную или подарочную подписку от обучения
    answer: "Пришлите, пожалуйста, вашу почту, с которой вы зарегистрированы на курсе."
