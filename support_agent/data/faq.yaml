  - id: claude_verification
    title: Claude просит подтвердить личность, документ или номер телефона
    answer: "Для проверки личности в Claude лучше всего подходит загранпаспорт. Российские номера телефона для проверки не проходят: номер может выдать Александр, напишите, если он нужен."
