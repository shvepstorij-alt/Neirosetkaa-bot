  # Ниже — правила, утверждённые владельцем 11.11.2026 по разбору переписок за 28.07–28.10.2026.
  - id: card_payment
    title: Оплата российской картой не проходит или клиент спрашивает про российскую карту
    answer: "По карте оплата часто не проходит, но попробовать можно. Если не прошла, пропишите в боте /start и начните новый заказ, лучше по СБП."
  - id: bot_stuck
    title: Бот магазина завис, не грузится или не даёт оплатить
    answer: "Пропишите в боте /start и выберите нужный раздел в главном меню."
  - id: renewal
    title: Продление подписки, автосписания, когда продлевать
    answer: "Продление оформляется как новая покупка в боте. Подписка всегда на месяц, автосписаний нет. Продлевать лучше, когда подписка закончилась и аккаунт перешёл на бесплатный тариф."
  - id: cancel_notice
    title: Письмо или надпись об отмене подписки после активации, как проверить подписку
    answer: "Подписка активна, отключено только автопродление. Проверить можно так: перезайдите в аккаунт и откройте настройки, раздел оплаты."
  - id: transfer
    title: Перенос подписки или оплаты на другой аккаунт
    answer: "После активации подписку нельзя перенести на другой аккаунт, возврат за активированную подписку не оформляется."
  - id: foreign_payment
    title: Оплата из-за границы или не российской картой — PayPal, иностранная карта, Kaspi, белорусская карта, оплата из другой страны
    answer: "К сожалению, можем принять оплату только по СБП или картой «Мир». Иностранные и белорусские карты, PayPal не проходят. Если есть возможность, попросите кого-то из России оплатить через нашего бота: заказ оформляется так же."
    verbatim: true
  - id: for_other_person
    title: Покупка подписки для другого человека
    answer: "Подписку можно оформить для другого человека самостоятельно через бота. После активации перенести её на другой аккаунт нельзя."
  - id: receipt
    title: Нужно ли отправлять чек после оплаты
    answer: "Чек не обязателен. Если по заказу возникнут вопросы, понадобятся чек из банка и номер заказа FreeKassa. Сами мы, к сожалению, не выдаём чек об оплате."
  # Активация и типовые ошибки. Утверждено владельцем 11.11.2026.
  - id: activation_where
    title: Клиент УЖЕ оплатил ChatGPT, Claude или Perplexity и спрашивает, где кнопка активации (не для вопросов «как купить» и «как оформить»)
    answer: "Кнопка «Активировать подписку» находится в боте, в сообщении после оплаты. Нажмите её, инструкция откроется там. Кнопка действует 2 часа."
  - id: activation_expired
    title: Время активации истекло, нужна повторная активация
    answer: "Повторную активацию выдаёт Александр. Пришлите номер заказа из бота."
    collect: [order_number]
  - id: activation_failed
