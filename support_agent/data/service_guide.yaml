# Отличия тарифов для консультации клиента. Только то, что есть на официальных страницах.
# Цены сюда НЕ пишем: цены клиенту — только из каталога бота.
# Версии моделей не пишем: они меняются почти каждый месяц.
# Проверено: 11.11.2026.

checked: "11.11.2026"

choose:
  # Ответ владельца клиентам (чаты #969, #83) и его правила про блокировки.
  chatgpt_vs_claude: "ChatGPT универсальнее: картинки, поиск, файлы, тексты, повседневные задачи. Claude особенно хорош в работе с текстами, документами, кодом и большими объёмами информации. Для программирования подходят оба: Codex входит в подписку ChatGPT, Claude Code — в Claude Pro и выше. В ChatGPT заметно меньше блокировок аккаунтов; с Claude нужно работать через один VPN и одну локацию."

services:
  chatgpt:
    source: "chatgpt.com/pricing"
    plans:
      Go: "Дешевле Plus. Больше сообщений, картинок и памяти, чем в бесплатной версии. Может показывать рекламу. Нет самых сильных моделей и части инструментов, которые есть в Plus."
      Plus: "Продвинутые модели, расширенные лимиты Codex и Deep Research, генерация изображений, в том числе с размышлением, проекты, задачи по расписанию и свои GPT. Ранний доступ к новым функциям."
      Pro: "Максимальные лимиты и самые сильные модели, включая Pro-модель. Codex с более длинными сессиями, максимум Deep Research и памяти, самый быстрый ответ. У OpenAI несколько уровней Pro с разным объёмом использования."
    notes:
      - "Генерации видео в тарифах ChatGPT на странице тарифов нет."
      - "Codex входит в подписку ChatGPT; лимиты Codex растут от Plus к Pro."

  claude:
    source: "claude.com/pricing; support.claude.com, статья про тариф Ultra"
    plans:
      Pro: "Claude Code, модель Opus, Research, проекты, память. Лимиты считаются окнами по 5 часов и за неделю."
      Max: "В 5 раз больше использования, чем Pro, за 5 часов и за неделю. Приоритетный доступ при высокой нагрузке и ранний доступ к новым функциям. Раньше назывался Max 5×."
      Ultra: "Раньше назывался Max 20× (переименован 30.10.2026, цена прежняя). В 10 раз больше использования, чем Pro, в неделю; у подтверждённых аккаунтов нет 5-часового лимита."
    notes:
      - "Сайт, приложения и Claude Code расходуют один общий лимит."
      - "Лимит зависит от модели, длины разговора и размера файлов."

  gemini:
    source: "gemini.google/subscriptions"
    plans:
      AI Plus: "Лимиты в 2 раза больше бесплатных, генерация видео, 400 ГБ хранилища в Gmail, Drive и Фото."
      AI Pro: "Лимиты в 4 раза больше бесплатных, Pro-модель, Deep Research, генерация видео, Gemini в Gmail и Docs, 5 ТБ хранилища."
      AI Ultra: "Всё из AI Pro, лимиты в 5 или 20 раз больше AI Pro, максимальный доступ к моделям и новым функциям, от 20 ТБ хранилища."
    notes:
      - "Лимиты в приложении Gemini обновляются каждые 5 часов до недельного предела."

  perplexity:
    source: "perplexity.ai/help-center, статья о выборе тарифа"
    plans:
      Pro: "Расширенный Pro Search и Research, браузерный агент Comet, создание файлов и приложений, продвинутые модели, генерация изображений и видео, больше загрузок файлов (до 50 файлов на проект). Можно отключить обучение на ваших данных."
      Max: "Всё из Pro, плюс максимальный доступ к продвинутым моделям, самые высокие лимиты поиска, Research и агента, ранний доступ к новым функциям."
    notes:
      - "В бесплатной версии 3 Pro Search в день и 1 Research в месяц."

  cursor:
    source: "cursor.com/pricing; cursor.com/help, тарифы"
    plans:
      Plus: "Базовый объём использования, только модели Grok."
      Premium: "В 4 раза больше использования, чем Plus. Облачные агенты и автоматизации, ревью кода. Сторонние модели (Claude, GPT, Gemini) — по цене API, отдельно."
      Super: "В 15 раз больше, чем Plus, приоритетный доступ к моделям в часы пик."
      Ultra: "В 50 раз больше, чем Plus, самый ранний доступ к новым продуктам и моделям."
    notes:
      - "С октября 2026 года тарифы Cursor изменились. Pro, Pro+ и прежний Ultra стали старыми тарифами: у тех, кто их уже оформил, они продолжают работать."
      - "Лимит обновляется каждую неделю."

  midjourney:
    source: "docs.midjourney.com, сравнение тарифов"
    plans:
      Basic: "Около 3,3 часа быстрой генерации в месяц. Режима Relax нет: когда время кончилось, генерации заканчиваются до следующего месяца."
      Standard: "15 часов быстрой генерации и безлимитные изображения в режиме Relax (медленнее, через очередь)."
      Pro: "30 часов быстрой генерации, безлимитные изображения и SD-видео в Relax, режим Stealth — ваши работы не видны другим."
      Mega: "60 часов быстрой генерации, всё из Pro, больше одновременных задач."
    notes:
      - "Неиспользованное быстрое время не переносится на следующий месяц."

  grok:
    source: "официальная страница grok.com/plans не открылась; по нескольким обзорам, проверенным 11.11.2026"
    plans:
      SuperGrok: "Больше лимитов на всё, режим Expert для сложных задач, генерация изображений и видео, агент Grok Bot."
      SuperGrok Heavy: "Максимальные лимиты и самая мощная конфигурация моделей."
    notes:
      - "У платных тарифов Grok один общий недельный лимит на чат, картинки, голос и Build."

  suno:
    source: "suno.com/pricing"
    plans:
      Pro: "2 500 кредитов в месяц, продвинутые модели, коммерческие права на песни, до 10 генераций одновременно с приоритетом, свои голоса и модели, добавление вокала или инструментала, редактирование, 20 загрузок песен в месяц."
      Premier: "10 000 кредитов в месяц, всё из Pro, плюс Suno Studio, расширенное разделение на дорожки, 60 загрузок песен в месяц."
    notes:
      - "В бесплатной версии 50 кредитов в день, без коммерческих прав."
      - "Кредиты подписки не переносятся на следующий месяц. Докупленные кредиты не сгорают, но тратить их можно только при активной подписке."

  elevenlabs:
    source: "elevenlabs.io/pricing"
    plans:
      Starter: "30 тыс. кредитов в месяц, коммерческая лицензия, быстрое клонирование голоса, дубляж."
      Creator: "121 тыс. кредитов в месяц, всё из Starter, плюс профессиональное клонирование голоса."
      Pro: "600 тыс. кредитов в месяц, всё из Creator, плюс высокое качество звука в API."
    notes:
      - "В бесплатной версии 10 тыс. кредитов, коммерческой лицензии и клонирования голоса нет."

  heygen:
    source: "heygen.com/pricing"
    plans:
      Creator: "600 кредитов, видео до 30 минут, экспорт 1080p, без водяного знака, 700+ готовых аватаров, 175+ языков и диалектов."
      Pro: "1 000 кредитов, всё из Creator, плюс экспорт в 4K, кинематографичные аватары, новые модели раньше, быстрее обработка."
    notes:
      - "В бесплатной версии 3 видео в месяц до 1 минуты и с водяным знаком."

  runway:
    source: "runway.com/pricing"
    plans:
      Standard: "625 кредитов в месяц, без водяных знаков, увеличение до 4K."
      Pro: "2 250 кредитов в месяц, безлимитное увеличение видео до 4K."
      Max: "9 500 кредитов в месяц, безлимитное увеличение видео до 4K."
    notes:
      - "В бесплатной версии 125 кредитов один раз, без ежемесячного пополнения."

  lovable:
    source: "docs.lovable.dev, тарифы и кредиты"
    plans:
      Pro: "Ежедневные кредиты без месячного предела, неиспользованные кредиты тарифа переносятся, пока подписка активна, можно докупать кредиты."
      Business: "Всё из Pro, плюс управление и контроль для команды."
    notes:
      - "В бесплатной версии 5 кредитов в день, не больше 30 в месяц."

  gamma:
    source: "gamma.app/pricing"
    plans:
      Plus: "Безлимитное создание с ИИ, до 20 карточек, без значка Gamma, продвинутая генерация изображений, приоритетная поддержка."
      Pro: "Всё из Plus, до 50 карточек, лучшая генерация изображений, свои домены, аналитика, свои шрифты, защита паролем."
    notes:
      - "В бесплатной версии 400 кредитов при регистрации и до 10 карточек."

  kling:
    source: "официальная страница не открылась; по нескольким обзорам, проверенным 11–12.11.2026"
    plans:
      Standard: "Без водяного знака, коммерческое использование, видео до 1080p."
      Pro: "Больше кредитов, чем в Standard (примерно в 4,5 раза), приоритетная обработка."
      Premier: "Ещё больше кредитов, высокий приоритет обработки."
      Ultra: "Максимум кредитов и самый высокий приоритет."
    notes:
      - "Кредиты подписки действуют месяц и не переносятся."
      - "В бесплатной версии есть водяной знак и запрет на коммерческое использование."

  canva:
    source: "официальная страница не открылась; по нескольким обзорам, проверенным 12.11.2026"
    plans:
      Pro: "Премиальные шаблоны, фото, видео и музыка, удаление фона, Magic Resize, брендбук, больше ИИ-функций и места в облаке."
      Teams: "Всё из Pro, плюс управление командой и правами доступа. Оплата за каждого участника, минимум 3 человека."

  zoom:
    source: "zoom.us/pricing"
    plans:
      Pro: "Встречи до 30 часов, до 100 участников, 10 ГБ облака на пользователя, безлимитные ИИ-итоги встреч, Zoom Mail и Calendar."
      Business: "Встречи до 30 часов, до 300 участников, 10 ГБ облака на лицензию, безлимитные ИИ-итоги, безлимитные доски и страницы записи, вход через корпоративную учётку (SSO)."
    notes:
      - "В бесплатной версии встречи до 40 минут, до 100 участников, запись только на компьютер."

  spotify:
    source: "spotify.com/premium"
    plans:
      Individual: "1 аккаунт: без рекламы, музыка в формате lossless, прослушивание офлайн, 15 часов аудиокниг в месяц."
      Duo: "2 аккаунта для двоих, живущих по одному адресу."
      Family: "До 6 аккаунтов для семьи по одному адресу, родительский контроль."
    notes:
      - "Во всех тарифах: без рекламы, офлайн, любые треки в любом порядке."

  youtube:
    source: "support.google.com/youtube"
    plans:
      Premium: "Без рекламы, фоновое воспроизведение, загрузка видео для просмотра офлайн, YouTube Music Premium."
    notes:
      - "В семейном тарифе все участники должны жить по одному адресу с владельцем семьи."
      - "Загруженные видео доступны офлайн 30 дней."

  notion:
    source: "notion.com/pricing"
    plans:
      Plus: "Файлы до 5 ГБ, история страниц 30 дней. Notion AI — только пробный ограниченный доступ."
      Business: "Notion AI включён: агент Notion, ИИ-заметки встреч, поиск по подключённым сервисам. Файлы до 5 ГБ, история 90 дней."
    notes:
      - "В бесплатной версии файлы до 5 МБ, история 7 дней."
