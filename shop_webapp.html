<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<title>Магазин</title>
<style>
  :root{
    --bg:#0f0f0f; --bg2:#1a1a1a; --bg3:#111; --border:#2a2a2a;
    --text:#e9eaed; --text2:#8b8f96; --text3:#555; --green:#10a37f;
  }
  html[data-theme="light"]{
    --bg:#f9fafb; --bg2:#fff; --bg3:#f3f4f6; --border:#e5e7eb;
    --text:#111; --text2:#6b7280; --text3:#9ca3af;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .screen{display:none}
  .screen.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .wrap{padding:14px 14px 30px;max-width:640px;margin:0 auto}

  /* Верхняя мини-панель */
  .tgbar{display:flex;gap:8px;justify-content:flex-end;padding:8px 10px 0}
  .pill{font-size:12px;font-weight:600;color:#fff;background:rgba(120,124,138,.34);border:none;border-radius:15px;padding:7px 11px}

  /* Баннеры */
  .banners{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 14px;scrollbar-width:none}
  .banners::-webkit-scrollbar{height:0}
  .banner{flex:0 0 92%;scroll-snap-align:center;border-radius:16px;overflow:hidden;position:relative;cursor:pointer;display:block;padding:0;color:#fff;background:linear-gradient(135deg,#10a37f,#0c7d61)}
  .banner:active{transform:scale(.99)}
  .banner .b-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
  .banner .b-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.05));z-index:1}
  .banner .b-content{position:relative;z-index:2;display:flex;align-items:center}
  .banner .b-emoji{font-size:38px;margin-right:12px}
  .banner .b-tt{font-size:16px;font-weight:800;line-height:1.15}
  .banner .b-sub{font-size:12px;opacity:.92;margin-top:3px}
  .hero{padding:6px 2px 12px}
  .hero h1{font-size:23px;font-weight:800}
  .hero p{color:var(--text2);font-size:13px;margin-top:3px}

  /* Категории (чипсы) */
  .chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
  .chips::-webkit-scrollbar{height:0}
  .chip{flex:none;background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}

  /* Сетка сервисов */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:9px}
  .tile:active{transform:scale(.98)}
  .tile .ic{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35),inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden}
  .tile .ic svg{width:30px;height:30px;display:block;fill:#fff}
  .tile .ic svg *{fill:#fff}
  .tile .ic img.pnglogo{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
  .tile .ic .mono{font:800 22px/1 -apple-system,sans-serif;color:#fff}
  .tile .nm{font-size:14px;font-weight:700;line-height:1.2}
  .tile .pr{font-size:12px;color:var(--text2)}

  /* Карточка сервиса */
  .card-back{position:fixed;top:52px;left:10px;z-index:30;width:38px;height:38px;border-radius:50%;background:var(--bg2);border:1px solid var(--border);color:var(--text);font-size:24px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;padding-bottom:3px}
  #card .wrap{padding-top:22px}
  .card-head{display:flex;flex-direction:column;align-items:center;gap:12px;margin:6px 0 14px}
  .card-ic{width:80px;height:80px;border-radius:20px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4);overflow:hidden}
  .card-ic svg{width:48px;height:48px;display:block;fill:#fff}.card-ic svg *{fill:#fff}
  .card-ic img.pnglogo{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
  .card-ic .mono{font:800 36px/1 -apple-system,sans-serif;color:#fff}
  .card-name{font-size:22px;font-weight:800;text-align:center}
  .card-desc{font-size:13px;color:var(--text2);line-height:1.6;text-align:center;margin:8px 0 16px}
  .card-plans-h{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px}
  .plan{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .plan-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .plan-n{font-size:15px;font-weight:700}
  .plan-p{font-size:16px;font-weight:800;color:var(--green);white-space:nowrap}
  .plan-p span{font-size:11px;color:var(--text3);font-weight:600}
  .plan-d{font-size:12px;color:var(--text2);line-height:1.5;margin:6px 0 10px}
  .plan-buy{background:var(--green);color:#fff;text-align:center;font-weight:700;font-size:13px;padding:11px;border-radius:10px;cursor:pointer}
  .pay-methods{display:flex;gap:8px}
  .pay-methods .pm{flex:1;text-align:center;font-weight:700;font-size:13px;padding:12px;border-radius:10px;cursor:pointer;color:#fff}
  .pay-methods .pm.sbp{background:var(--green)}.pay-methods .pm.card{background:#3576f5}
  .pm-wait{text-align:center;font-size:12.5px;color:var(--text2);padding:10px}
  .pm-err{text-align:center;font-size:12.5px;color:#e5484d;padding:6px}
  .as-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .as-region{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px;cursor:pointer;font-weight:600;font-size:13px}
  .as-region:active{transform:scale(.97)}.as-region .as-flag{font-size:20px}
  .as-region .as-rname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .empty{color:var(--text2);text-align:center;padding:40px 10px;font-size:14px}
  /* Вкладки снизу */
  body{padding-bottom:66px}
  .tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--bg2);border-top:1px solid var(--border);z-index:40}
  .tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 11px;font-size:11px;color:var(--text2);cursor:pointer}
  .tabbar .tab .t-ic{font-size:20px;line-height:1}
  .tabbar .tab.on{color:var(--green)}
  .tabbar.hidden{display:none}
  /* Кабинет */
  .bal-row{display:flex;gap:10px;margin-bottom:14px}
  .bal{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px}
  .bal .v{font-size:22px;font-weight:800}
  .bal .l{font-size:12px;color:var(--text2);margin-top:2px}
  .block{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px}
  .block h3{font-size:14px;font-weight:700;margin-bottom:8px}
  .ref-link{font-size:12px;color:var(--green);word-break:break-all;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 10px;margin-bottom:8px}
  .ref-copy{background:var(--green);color:#fff;text-align:center;font-weight:700;font-size:13px;padding:10px;border-radius:10px;cursor:pointer}
  .ord{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
  .ord:last-child{border-bottom:none}
  .ord .o-l{color:var(--text)}.ord .o-s{color:var(--text2);font-size:11px}
  .ord .o-a{font-weight:700;white-space:nowrap}
  .gm-list{display:flex;flex-direction:column;gap:8px}
  .gm-group{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px;padding-left:2px}
  .gm-group:first-child{margin-top:0}
  .pm-back{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;padding:18px}
  .pm-card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:14px;max-width:420px;width:100%;max-height:88vh;overflow:auto}
  .upl-btn{border:1.5px dashed var(--border);border-radius:14px;padding:22px 12px;text-align:center;color:var(--text2);font-weight:600;font-size:14px;cursor:pointer}
  .upl-btn:active{transform:scale(.99)}
  .upl-prev{position:relative;border-radius:14px;overflow:hidden}
  .upl-prev img{width:100%;display:block;border-radius:14px;max-height:320px;object-fit:cover}
  .upl-re{margin-top:8px;text-align:center;font-size:13px;font-weight:600;color:var(--green);cursor:pointer}
  .act-steps{font-size:13px;color:var(--text);line-height:1.7}
  .act-link{margin-top:10px;text-align:center;font-size:13px;font-weight:700;color:var(--green);border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer}
  .act-note{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.5}
  .act-note code{background:var(--bg);border:1px solid var(--border);border-radius:5px;padding:1px 5px}
  .mdl-sel{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:13px 12px;font-size:15px;font-weight:700;color:var(--text);-webkit-appearance:none;appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b8f96' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:38px}
  .mdl-desc{font-size:12.5px;color:var(--text2);margin-top:8px;line-height:1.5}
  .mdl-desc b{color:var(--green)}
  .gen-vid{width:100%;border-radius:12px;display:block;background:#000;max-height:70vh}
  .vp-wrap{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px}
  .vp-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-bottom:10px}
  .vp-top .vp-t{color:var(--green);font-variant-numeric:tabular-nums}
  .vp-bar{height:8px;border-radius:6px;background:var(--bg3);overflow:hidden;position:relative}
  .vp-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),#0c7d61);transition:width .6s ease;position:relative;overflow:hidden}
  .vp-fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:vpsh 1.2s infinite}
  @keyframes vpsh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .vp-sub{font-size:11.5px;color:var(--text2);margin-top:8px;text-align:center}
  .fav-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;padding-left:2px;pointer-events:none}
  .fav-vplace{width:100%;height:100%;background:linear-gradient(135deg,#222,#111)}
  .gm{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:11px;cursor:pointer}
  .gm.on{border-color:var(--green);box-shadow:0 0 0 1px var(--green) inset}
  .gm-n{font-size:14px;font-weight:700}.gm-d{font-size:12px;color:var(--text2);margin-top:2px}
  .gm-c{font-size:12px;color:var(--green);font-weight:700;margin-top:3px}
  .gen-ta{width:100%;min-height:92px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;color:var(--text);font-size:14px;resize:vertical;font-family:inherit;box-sizing:border-box}
  .gen-img img{width:100%;border-radius:14px;display:block}
  .favs-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .fav{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:var(--bg)}
  .fav img{width:100%;height:100%;object-fit:cover;display:block}
  .fav-x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .prof{display:flex;align-items:center;gap:14px;background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}
  .prof .pav{width:56px;height:56px;border-radius:50%;overflow:hidden;flex:none;background:linear-gradient(135deg,var(--green),#0c7d61);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#fff}
  .prof .pav img{width:100%;height:100%;object-fit:cover;display:block}
  .prof .pn{font-size:17px;font-weight:800}
  .prof .pu{font-size:12px;color:var(--text2);margin-top:2px}
  .accents{display:flex;flex-wrap:wrap;gap:12px}
  .acc{width:42px;height:42px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:transform .1s}
  .acc:active{transform:scale(.9)}
  .acc.on{border-color:var(--text)}
</style>
</head>
<body>

<div id="home" class="screen active">
  <div class="tgbar"><span class="pill" onclick="_kbHide()">⌨️ Скрыть</span><span class="pill" onclick="_min()">🔽 Свернуть</span></div>
  <div class="wrap">
    <div class="hero"><h1>🛍 Магазин</h1><p>Подписки на ИИ-сервисы и пополнение App Store</p></div>
    <div class="banners" id="banners" style="display:none"></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div id="cabinet" class="screen">
  <div class="wrap">
    <div class="hero"><h1>👤 Кабинет</h1><p>Баланс, заказы и приглашения</p></div>
    <div id="cabinet-body"><div class="pm-wait">Загружаю…</div></div>
  </div>
</div>

<div id="card" class="screen">
  <div class="card-back" onclick="showHome()">‹</div>
  <div class="wrap"><div id="card-body"></div></div>
</div>

<div id="gen" class="screen">
  <div class="wrap">
    <div class="hero" id="gen-hero"><h1>🎨 Создать</h1><p>Генерация нейросетями</p></div>
    <div id="gen-body"></div>
  </div>
</div>

<div class="tabbar" id="tabbar">
  <div class="tab on" id="tab-catalog" onclick="switchTab('catalog')"><span class="t-ic">🛍</span><span>Каталог</span></div>
  <div class="tab" id="tab-gen" onclick="switchTab('gen')"><span class="t-ic">🎨</span><span>Создать</span></div>
  <div class="tab" id="tab-cabinet" onclick="switchTab('cabinet')"><span class="t-ic">👤</span><span>Кабинет</span></div>
</div>

<script>
var tg = null;
var CATALOG = {}, CATS = [], RECS = [];
var BOT_USERNAME = 'neirosetkaa_bot';
var _curCat = '*';
var DEFAULT_ACCENT = '#10a37f';
var ACCENTS = ['#a3e635','#22c55e','#3b82f6','#8b5cf6','#ec4899','#f59e0b','#ef4444','#10a37f'];
function _getAccent(){ try{ return localStorage.getItem('shop_accent')||''; }catch(e){ return ''; } }
function _applyAccent(c){ if(c) document.documentElement.style.setProperty('--green', c); }
function setAccent(c){
  try{ localStorage.setItem('shop_accent', c); }catch(e){}
  _applyAccent(c);
  var els=document.querySelectorAll('.acc');
  for(var i=0;i<els.length;i++){ els[i].classList.toggle('on', els[i].getAttribute('data-c')===c); }
}

function _esc1(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function _mono(name){ return '<span class="mono">'+((String(name||'?').trim().charAt(0)||'?').toUpperCase())+'</span>'; }
function _hue(key){ var h=0,i; for(i=0;i<(key||'x').length;i++){h=(h*31+key.charCodeAt(i))%360;} return 'linear-gradient(135deg,hsl('+h+',52%,42%),hsl('+((h+28)%360)+',54%,30%))'; }
var BG = { chatgpt:'#0d8f6f', claude:'#c15f3c', grok:'#000', perplexity:'#1f7a8c', zoom:'#2d8cff', midjourney:'#111317',
  canva:'linear-gradient(135deg,#00c4cc,#7d2ae8)', suno:'#0e0e10', spotify:'#1db954', elevenlabs:'#0e0e10',
  runway:'#0e0e10', gamma:'#7c3aed', capcut:'#111317', cursor:'#0e0e10', openrouter:'#6d6f7a', heygen:'#5b57e0',
  telegram:'#2aabee', youtube:'#ff0033', lovable:'#e5476d', appstore:'#111',
  gemini:'linear-gradient(135deg,#4285f4,#9b72cb)', kling:'#111317', manus:'#5b57e0' };
function _brandBg(key){ return BG[key] || _hue(key); }
function _iconHtml(logo, name){ var s=String(logo||''); return (s.indexOf('<svg')===0||s.indexOf('<img')===0)?logo:_mono(name); }
function _tileBg2(key, logo){ if(logo && String(logo).indexOf('pnglogo')>=0) return '#fff'; if(_isAppStore(key,(CATALOG[key]&&CATALOG[key].name)))return '#111'; return _brandBg(key); }
function _isAppStore(key, name){ var s=((key||'')+' '+(name||'')).toLowerCase().replace(/[^a-z]/g,''); return s.indexOf('appstore')>=0||s.indexOf('icloud')>=0; }
function _minPrice(c){ var m=0; (c.plans||[]).forEach(function(p){ if(!m||p.price<m)m=p.price; }); return m; }

function _api(path, body){
  body = body||{}; try{ body.initData=(tg&&tg.initData)?tg.initData:''; }catch(e){ body.initData=''; }
  return fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json().catch(function(){return{ok:false}})}).catch(function(){return{ok:false}});
}

/* ─── Баннеры ─── */
function renderBanners(){
  var el=document.getElementById('banners'); if(!el) return;
  var B=window.__BANNERS__||[];
  if(!B.length){ el.style.display='none'; return; }
  el.style.display='';
  el.innerHTML=B.map(function(b,i){
    var bg = b.img ? '<div class="b-bg" data-img="'+i+'"></div><div class="b-shade"></div>' : '';
    var tc=b.tc||'#fff';
    var ar=(b.ar&&/^\d+:\d+$/.test(b.ar))?b.ar.replace(':','/'):(b.h?('340/'+b.h):'16/6');
    var st='style="aspect-ratio:'+ar+';height:auto;'+((!b.img && b.bg)?('background:'+b.bg):'')+'"';
    var ex=(b.ex!=null?b.ex:5), ey=(b.ey!=null?b.ey:28), tx=(b.tx!=null?b.tx:22), ty=(b.ty!=null?b.ty:24);
    var em = b.emoji ? ('<div class="b-emoji" style="position:absolute;z-index:2;left:'+ex+'%;top:'+ey+'%">'+b.emoji+'</div>') : '';
    var txt = '<div style="position:absolute;z-index:2;left:'+tx+'%;top:'+ty+'%;max-width:74%;color:'+tc+'"><div class="b-tt">'+(b.title||'')+'</div>'+(b.sub?'<div class="b-sub">'+b.sub+'</div>':'')+'</div>';
    return '<div class="banner" '+st+' onclick="bannerTap('+i+')">'+bg+em+txt+'</div>';
  }).join('');
  var bgs=el.querySelectorAll('.b-bg');
  for(var i=0;i<bgs.length;i++){ var idx=+bgs[i].getAttribute('data-img'); var im=(B[idx]&&B[idx].img)||''; if(im) bgs[i].style.backgroundImage='url("'+im+'")'; }
}
function bannerTap(i){
  var b=(window.__BANNERS__||[])[i]; if(!b) return;
  if(b.act==='svc' && b.val){ openCard(b.val); }
  else if(b.act==='cat' && b.val){ setCat(b.val); window.scrollTo(0,0); }
  else if(b.act==='url' && b.val){ try{ if(tg&&tg.openLink){ tg.openLink(b.val); return; } }catch(e){} try{ window.open(b.val,'_blank'); }catch(e){} }
}

/* ─── Главная: категории + сетка ─── */
function _catKeysSet(){ var s={}; CATS.forEach(function(c){(c.keys||[]).forEach(function(k){s[k]=1;});}); return s; }
function renderChips(){
  var el=document.getElementById('chips'); if(!el) return;
  var chips=[['*','Все']];
  CATS.forEach(function(c,i){ chips.push([''+i, c.emoji+' '+c.name]); });
  // «Другое» — сервисы без категории
  var inCat=_catKeysSet(); var hasOther=Object.keys(CATALOG).some(function(k){return !inCat[k];});
  if(hasOther) chips.push(['other','✨ Другое']);
  el.innerHTML=chips.map(function(c){
    return '<div class="chip'+(_curCat===c[0]?' on':'')+'" onclick="setCat(\''+c[0]+'\')">'+c[1]+'</div>';
  }).join('');
}
function setCat(c){ _curCat=c; renderChips(); renderGrid(); }
function _servicesFor(cat){
  var keys;
  if(cat==='*'){ keys=Object.keys(CATALOG); }
  else if(cat==='other'){ var inCat=_catKeysSet(); keys=Object.keys(CATALOG).filter(function(k){return !inCat[k];}); }
  else { var c=CATS[+cat]; keys=(c&&c.keys||[]).filter(function(k){return CATALOG[k];}); }
  return keys;
}
function renderGrid(){
  var el=document.getElementById('grid'); if(!el) return;
  var keys=_servicesFor(_curCat);
  if(!keys.length){ el.innerHTML='<div class="empty">Здесь пока пусто</div>'; return; }
  el.innerHTML=keys.map(function(k){
    var c=CATALOG[k]; if(!c) return '';

function switchTab(which){
  var tb=document.getElementById('tabbar'); if(tb) tb.classList.remove('hidden');
  document.getElementById('card').classList.remove('active');
  ['home','gen','cabinet'].forEach(function(id){var e=document.getElementById(id);if(e)e.classList.remove('active');});
  ['catalog','gen','cabinet'].forEach(function(id){var e=document.getElementById('tab-'+id);if(e)e.classList.remove('on');});
  if(which==='cabinet'){ document.getElementById('cabinet').classList.add('active'); document.getElementById('tab-cabinet').classList.add('on'); loadCabinet(); }
  else if(which==='gen'){ document.getElementById('gen').classList.add('active'); document.getElementById('tab-gen').classList.add('on'); renderGen(); }
  else { document.getElementById('home').classList.add('active'); document.getElementById('tab-catalog').classList.add('on'); }
  window.scrollTo(0,0);
}
function showHome(){ switchTab('catalog'); }
function _showCard(){
  document.getElementById('home').classList.remove('active');
  document.getElementById('cabinet').classList.remove('active');
  document.getElementById('card').classList.add('active');
  var tb=document.getElementById('tabbar'); if(tb) tb.classList.add('hidden');
  window.scrollTo(0,0);
}

function _mkSelect(selId,models,curKey,order,onchange){
  var groups={}; models.forEach(function(m){var g=m.group||'';(groups[g]=groups[g]||[]).push(m);});
  var gkeys;
  if(order&&order.length){ gkeys=order.filter(function(g){return groups[g];}).concat(Object.keys(groups).filter(function(g){return order.indexOf(g)<0;})); }
  else { gkeys=Object.keys(groups); }
  var inner=gkeys.map(function(g){
    var opts=groups[g].map(function(m){return '<option value="'+m.key+'"'+(m.key===curKey?' selected':'')+'>'+_h(m.name)+' · '+m.credits+' кр</option>';}).join('');
    return g?('<optgroup label="'+_h(g)+'">'+opts+'</optgroup>'):opts;
  }).join('');
  return '<select id="'+selId+'" class="mdl-sel" onchange="'+onchange+'">'+inner+'</select>';
}

function doGenVideo(){
  if(window._vidBusy) return;
  _saveVidPrompt();
  var p=(window._vidPrompt||'').trim();
  var res=document.getElementById('vid-result'); if(!res) return;
  if(p.length<2){ res.innerHTML='<div class="pm-err">Опиши, что снять</div>'; return; }
  window._vidBusy=true; window._lastGenPromptV=p; window._genProgLabel='🎬 Генерирую видео…'; window._genGenStart=Date.now();
  var btn=document.getElementById('vid-btn'); if(btn) btn.style.display='none';
  res.innerHTML=_vidProgHtml(0);
  var restore=function(){ window._vidBusy=false; var b2=document.getElementById('vid-btn'); if(b2) b2.style.display=''; };
  _api('/api/gen/video',{model:window._vidModel,prompt:p,aspect:window._vidAspect,duration:window._vidDur}).then(function(d){
    if(!res){ restore(); return; }
    if(d&&d.ok&&d.job){ _vidPoll(d.job,0,'video',restore); return; }
    if(d&&d.error==='credits'){ res.innerHTML='<div class="pm-err">Не хватает кредитов (нужно '+(d.need||'')+', есть '+(d.have||0)+'). Пополни в «Каталоге».</div>'; }
    else if(d&&String(d.error||'').indexOf('auth')===0){ res.innerHTML='<div class="pm-err">Сессия устарела — закрой и открой приложение заново.</div>'; }
    else { res.innerHTML='<div class="pm-err">Не удалось запустить генерацию. Попробуй ещё раз.</div>'; }
    restore();
  }).catch(function(){ if(res) res.innerHTML='<div class="pm-err">Ошибка сети. Попробуй ещё раз.</div>'; restore(); });
}

function _vidPoll(job,tries,kind,restore){
  var resId=_vidResId(kind);
  var res=document.getElementById(resId);
  if(tries>150){ if(res) res.innerHTML='<div class="pm-err">Долго нет ответа. Если готово — придёт в чат бота.</div>'; restore(); return; }
  _api('/api/gen/video-status',{job:job}).then(function(d){
    if(!res) res=document.getElementById(resId);
    if(!d||!d.ok){ setTimeout(function(){_vidPoll(job,tries+1,kind,restore);},4000); return; }
    if(d.status==='pending'){
      if(res) res.innerHTML=_vidProgHtml(_genElapsed());
      setTimeout(function(){_vidPoll(job,tries+1,kind,restore);},4000); return;
    }
    if(d.status==='done'){
      window._lastGenToken=d.token||''; window._lastVidUrl=d.url||'';
      var src = d.token ? (location.origin+'/genimg?t='+d.token) : (d.url||'');
      _setLast(kind,{kind:'video',src:src,token:(d.token||''),dlUrl:(d.url||''),size:d.size,credits:d.credits,prompt:(window._lastGenPromptV||'')});
      if(d.fid){ _api('/api/gen/hist-add',{kind:'video',fid:d.fid,prompt:window._lastGenPromptV||''}); }
      // сброс формы, чтобы можно было сразу создать ещё
      if(kind==='anim'){ window._animBusy=false; window._animImg=null; window._animPrompt=''; window._animAspectAuto=false; }
      else { window._vidBusy=false; window._vidPrompt=''; }
      try{ if(tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
      renderGen();
      return;
    }
    // error
    if(res) res.innerHTML='<div class="pm-err">Не получилось сгенерировать видео. Кредиты возвращены — попробуй ещё раз или другую модель.</div>';
    restore();
  }).catch(function(){ setTimeout(function(){_vidPoll(job,tries+1,kind,restore);},4000); });
}

// ── Загрузка и уменьшение фото пользователя ──
function _pickImage(cb){
  var inp=document.createElement('input'); inp.type='file'; inp.accept='image/*';
  inp.onchange=function(){
    var f=inp.files&&inp.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        var mx=1536, sc=Math.min(1,mx/Math.max(img.width,img.height));
        var w=Math.round(img.width*sc), h=Math.round(img.height*sc);
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        cb(c.toDataURL('image/jpeg',0.9), img.width, img.height);
      };
      img.onerror=function(){ cb(null); };
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
// Определяет ближайший формат видео по соотношению сторон фото
function _detectAspect(w,h){
  if(!w||!h) return '16:9';
  var r=w/h;
  var cands=[['1:1',1],['16:9',16/9],['9:16',9/16]];
  var best='16:9', bd=1e9;
  cands.forEach(function(c){ var d=Math.abs(r-c[1]); if(d<bd){bd=d;best=c[0];} });
  return best;
}

    body.innerHTML=okline
      +'<div class="block"><h3>Как активировать</h3>'
      +'<div class="act-steps">1. Зайди на <b>chatgpt.com</b> и авторизуйся (Chrome/Safari).<br>'
      +'2. В том же браузере открой <b>chatgpt.com/api/auth/session</b>.<br>'
      +'3. Скопируй <b>весь</b> текст со страницы.<br>'
      +'4. Вставь его ниже и нажми «Активировать».</div>'
      +'<div class="act-link" onclick="_openUrl(\'https://chatgpt.com/api/auth/session\')">🔗 Открыть страницу с токеном</div></div>'
      +'<div class="block"><h3>Токен</h3><textarea id="act-token" class="gen-ta" placeholder="Вставь сюда весь текст со страницы session…"></textarea>'
      +'<div class="act-note">⚠️ Аккаунт должен быть на бесплатном плане. 🎟 Код: <code>'+_h(a.code)+'</code></div></div>'
      +'<div id="act-result"></div>'
      +'<div class="plan-buy" id="act-btn" onclick="doActivate()">✨ Активировать ChatGPT</div>';
  } else {
    body.innerHTML=okline
      +'<div class="block"><h3>Как активировать</h3>'
      +'<div class="act-steps">1. Зайди на <b>claude.ai</b> и авторизуйся.<br>'
      +'2. Открой <b>claude.ai/settings/account</b>.<br>'
      +'3. Прокрути до <b>Organization ID</b> и скопируй (UUID).<br>'
      +'4. Вставь ниже и нажми «Активировать».</div>'
      +'<div class="act-link" onclick="_openUrl(\'https://claude.ai/settings/account\')">🔗 Открыть настройки Claude</div></div>'
      +'<div class="block"><h3>Organization ID</h3><input id="act-org" class="gen-ta" style="min-height:0;height:44px" placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx">'
      +'<div class="act-note">⚠️ Если есть платная подписка — сначала отмени её на claude.ai/settings/billing. 🎟 Код: <code>'+_h(a.code)+'</code></div></div>'
      +'<div id="act-result"></div>'
      +'<div class="plan-buy" id="act-btn" onclick="doActivate()">⚡ Активировать Claude</div>';
  }
}
function _actBusy(on){ var b=document.getElementById('act-btn'); if(b) b.style.display=on?'none':''; window._actInFlight=on; }
function doActivate(){
  if(window._actInFlight) return;
  var a=window._act||{}; var res=document.getElementById('act-result'); if(!res) return;
  if(a.service==='chatgpt'){
    var raw=(document.getElementById('act-token')||{}).value||'';
    var tok=_actExtractToken(raw);
    if(tok.indexOf('eyJ')!==0||tok.length<100){ res.innerHTML='<div class="pm-err">Токен не найден. Скопируй весь текст со страницы chatgpt.com/api/auth/session.</div>'; return; }
    _actBusy(true);
    res.innerHTML='<div class="pm-wait">✨ Активирую ChatGPT… обычно 1–2 минуты, не закрывай экран.</div>';
    _api('/api/activate-chatgpt',{token:tok,raw_token:raw,code:a.code,init_data:(tg?tg.initData:''),force:window._actForce?1:0}).then(function(d){
      if(d&&d.job_id){ _actPollGpt(d.job_id,0); }
      else { res.innerHTML='<div class="pm-err">'+_h((d&&d.error)||'Не удалось запустить активацию.')+'</div>'; _actBusy(false); }
    }).catch(function(){ res.innerHTML='<div class="pm-err">Ошибка сети. Попробуй ещё раз.</div>'; _actBusy(false); });
  } else {
    var org=(((document.getElementById('act-org')||{}).value||'').trim()).toLowerCase();
    if(!/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(org)){ res.innerHTML='<div class="pm-err">Неверный формат. Organization ID — UUID вида xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx.</div>'; return; }
    _actBusy(true);
    res.innerHTML='<div class="pm-wait">⚡ Активирую Claude… обычно 1–2 минуты (иногда до 5), не закрывай экран.</div>';
    _api('/api/activate-claude',{org_id:org,code:a.code,init_data:(tg?tg.initData:''),force:window._actForce?1:0}).then(function(d){
      if(d&&d.order_id){ _actPollClaude(d.order_id,0); }
      else { res.innerHTML='<div class="pm-err">'+_h((d&&d.error)||'Не удалось запустить активацию.')+'</div>'; _actBusy(false); }
    }).catch(function(){ res.innerHTML='<div class="pm-err">Ошибка сети. Попробуй ещё раз.</div>'; _actBusy(false); });
  }
}
function _actForceRetry(){ window._actForce=true; doActivate(); }
function _actOk(){
  var res=document.getElementById('act-result');
  try{ if(tg&&tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
  if(res) res.innerHTML='<div class="block" style="text-align:center;padding:22px 14px"><div style="font-size:46px">🎉</div>'
    +'<div style="font-size:17px;font-weight:800;margin:8px 0 4px">Подписка активирована!</div>'
    +'<div class="card-desc">Готово — можно пользоваться. Детали пришли в чат бота.</div>'
    +'<div class="plan-buy" onclick="showHome()">Вернуться в каталог</div></div>';
}
function _actErr(msg,force){
  var res=document.getElementById('act-result'); _actBusy(false);
  if(!res) return;
  var html='<div class="pm-err">'+_h(msg||'Не получилось активировать.')+'</div>';
  if(force){ html+='<div class="plan-buy" style="margin-top:8px" onclick="_actForceRetry()">Активировать всё равно</div>'; }
  res.innerHTML=html;
}
function _actPollGpt(job,tries){
  if(tries>120){ _actErr('Активация занимает слишком долго. Напиши в поддержку — поможем.'); return; }
  fetch('/api/activate-status/'+job).then(function(r){return r.json();}).then(function(d){
    if(!d){ setTimeout(function(){_actPollGpt(job,tries+1);},3000); return; }
    if(d.status==='done'){
      if(d.success){ _actOk(); }
      else if(d.need_force){ _actErr((d.error||'На этом аккаунте уже есть подписка.'),true); }
      else if(d.pending){ var res=document.getElementById('act-result'); if(res) res.innerHTML='<div class="pm-wait">Почти готово — активация ещё выполняется. Проверь чат бота через минуту.</div>'; _actBusy(false); }
      else { _actErr(d.error); }
      return;
    }
    setTimeout(function(){_actPollGpt(job,tries+1);},3000);
  }).catch(function(){ setTimeout(function(){_actPollGpt(job,tries+1);},3000); });
}
function _actPollClaude(oid,tries){
  if(tries>200){ _actErr('Активация затянулась. Напиши в поддержку — поможем.'); return; }
  fetch('/api/activate-claude-status/'+encodeURIComponent(oid)).then(function(r){return r.json();}).then(function(d){
    if(!d){ setTimeout(function(){_actPollClaude(oid,tries+1);},5000); return; }
    if(d.status==='done'){
      if(d.need_force){ _actErr((d.error||'На этом аккаунте уже есть подписка.'),true); }
      else if(d.pending){ var res=document.getElementById('act-result'); if(res) res.innerHTML='<div class="pm-wait">Почти готово — активация ещё выполняется. Проверь чат бота через минуту.</div>'; _actBusy(false); }
      else if(d.success!==false){ _actOk(); }
      else { _actErr(d.error); }
      return;
    }
    if(d.status==='failed'){ _actErr(d.error||'Активация не удалась'); return; }
    setTimeout(function(){_actPollClaude(oid,tries+1);},5000);
  }).catch(function(){ setTimeout(function(){_actPollClaude(oid,tries+1);},5000); });
}

/* ─── App Store (NS Gifts) ─── */
function _appstoreLogo(){ for(var k in CATALOG){ if(_isAppStore(k,CATALOG[k].name)) return CATALOG[k].logo||''; } return ''; }
function _asHead(sub){
  var lg=_appstoreLogo(); var bg=(lg&&lg.indexOf('pnglogo')>=0)?'#fff':'#111';
  return '<div class="card-head"><div class="card-ic" style="background:'+bg+'">'+_iconHtml(lg,'A')+'</div>'
    +'<div class="card-name">iCloud / App Store</div></div>'
    +'<div class="card-desc">'+(sub||'Пополнение Apple ID. Код придёт автоматически после оплаты.')+'</div>';
}
function openAppstore(){
  var body=document.getElementById('card-body'); if(!body) return;
  body.innerHTML=_asHead()+'<div class="card-plans-h">Выбери регион</div><div id="as-body"><div class="pm-wait">Загружаю регионы…</div></div>';
  _showCard();
  _api('/api/appstore/regions').then(function(d){
    var el=document.getElementById('as-body'); if(!el)return;
    if(!d||!d.ok||!d.regions||!d.regions.length){ el.innerHTML='<div class="pm-err">Не удалось загрузить регионы. Попробуй позже.</div>'; return; }
    el.innerHTML='<div class="as-grid">'+d.regions.map(function(r){
      return '<div class="as-region" onclick="asDenoms('+r.catId+',\''+_esc1(r.name)+'\')"><span class="as-flag">'+(r.flag||'🌍')+'</span><span class="as-rname">'+r.name+'</span></div>';
    }).join('')+'</div>';
  });
}
function asDenoms(catId,name){
  var body=document.getElementById('card-body'); if(!body) return;
  body.innerHTML=_asHead('Регион: '+name)+'<div class="card-plans-h">Сумма пополнения</div><div id="as-body"><div class="pm-wait">Загружаю номиналы…</div></div>'
    +'<div class="plan-buy" style="margin-top:6px;background:transparent;border:1px solid var(--border);color:var(--text2)" onclick="openAppstore()">← Регионы</div>';
  _api('/api/appstore/denoms',{catId:catId}).then(function(d){
    var el=document.getElementById('as-body'); if(!el)return;
    if(!d||!d.ok||!d.denoms||!d.denoms.length){ el.innerHTML='<div class="pm-err">Нет доступных номиналов.</div>'; return; }
    el.innerHTML=d.denoms.map(function(p){
      return '<div class="plan"><div class="plan-h"><div class="plan-n">'+p.nominal+'</div><div class="plan-p">'+p.priceRub+'₽</div></div>'
        +'<div class="plan-buy" onclick="asMethod(this,'+catId+','+p.serviceId+')">Оформить за '+p.priceRub+'₽</div></div>';
    }).join('');
  });
}
function asMethod(btn,catId,serviceId){
  if(!btn)return; var w=document.createElement('div'); w.className='pay-methods';
  w.innerHTML='<div class="pm sbp" onclick="asPay(this,'+catId+','+serviceId+',\'sbp\')">⚡ СБП</div>'
    +'<div class="pm card" onclick="asPay(this,'+catId+','+serviceId+',\'card\')">💳 Картой</div>';
  btn.parentNode.replaceChild(w,btn);
}
function asPay(el,catId,serviceId,method){
  var row=el.parentNode; row.innerHTML='<div class="pm-wait">Создаю ссылку на оплату…</div>';
  _api('/api/appstore/pay',{catId:catId,serviceId:serviceId,method:method}).then(function(d){
    if(d&&d.ok&&d.url){ _afterPay(row,d.url,d.orderId); }
    else{ var m=(d&&d.error==='card_failed')?'Картой не удалось — попробуй СБП':(d&&d.error==='unavailable')?'Сервис временно недоступен':((d&&d.error)?('Ошибка: '+d.error):'Не получилось. Попробуй ещё раз'); row.innerHTML='<div class="pm-err">'+m+'</div>'; }
  });
}

/* ─── Панель ─── */
function _kbHide(){ try{var a=document.activeElement;if(a&&a.blur)a.blur();}catch(e){} }
function _min(){ _kbHide(); try{ if(tg&&typeof tg.minimize==='function'){tg.minimize();return;} }catch(e){} }

function _init(){
  tg=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:{ready:function(){},expand:function(){},initData:''};
  try{ tg.ready(); }catch(e){}
  try{ tg.expand(); }catch(e){}
  try{ if(tg.enableClosingConfirmation) tg.enableClosingConfirmation(); }catch(e){}
  try{ if(tg.colorScheme==='light') document.documentElement.setAttribute('data-theme','light'); }catch(e){}
  try{ var _a=_getAccent(); if(_a) _applyAccent(_a); }catch(e){}
  CATALOG=window.__CATALOG__||{}; CATS=window.__CATEGORIES__||[]; RECS=window.__RECS__||[];
  BOT_USERNAME=window.__BOT__||BOT_USERNAME;
  renderBanners(); renderChips(); renderGrid();
  // Deep-link: открыть сразу карточку сервиса (?svc=key или startapp=svc_key)
  try{
    var _svc='';
    var _m=location.search.match(/[?&]svc=([^&]+)/); if(_m) _svc=decodeURIComponent(_m[1]);
    if(!_svc){ var _sp=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||''; if(_sp.indexOf('svc_')===0) _svc=_sp.slice(4); }
    if(_svc && (CATALOG[_svc] || _isAppStore(_svc,''))) setTimeout(function(){ openCard(_svc); },60);
  }catch(e){}
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',_init); else _init();
</script>
